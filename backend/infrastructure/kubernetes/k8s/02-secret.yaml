# 企智连项目 Secret 配置
# 存储敏感信息（密码、密钥等）
# ⚠️ 注意：生产环境请使用外部密钥管理系统（如 Vault、AWS KMS）
# 这里的 base64 编码仅为示例，实际部署时请替换为真实加密值

apiVersion: v1
kind: Secret
metadata:
  name: ai-ready-db-secret
  namespace: ai-ready
  labels:
    app: ai-ready
    component: database
type: Opaque
stringData:
  # 数据库凭据（生产环境请使用强密码）
  DB_USERNAME: "aiready_user"
  DB_PASSWORD: "ChangeMeInProduction123!"
  DB_ROOT_PASSWORD: "RootChangeMeInProduction456!"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-ready-redis-secret
  namespace: ai-ready
  labels:
    app: ai-ready
    component: cache
type: Opaque
stringData:
  REDIS_PASSWORD: "RedisChangeMeInProduction789!"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-ready-jwt-secret
  namespace: ai-ready
  labels:
    app: ai-ready
    component: security
type: Opaque
stringData:
  JWT_SECRET: "YourSuperSecretJWTKeyChangeThisInProduction123456789"
  JWT_EXPIRATION: "86400"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-ready-app-secret
  namespace: ai-ready
  labels:
    app: ai-ready
    component: application
type: Opaque
stringData:
  # 第三方API密钥（示例）
  SMS_API_KEY: "your-sms-api-key-here"
  SMS_API_SECRET: "your-sms-api-secret-here"
  OSS_ACCESS_KEY: "your-oss-access-key-here"
  OSS_SECRET_KEY: "your-oss-secret-key-here"
  # 加密密钥
  ENCRYPTION_KEY: "your-encryption-key-32-chars-long!!"
---
# TLS证书 Secret（用于 HTTPS Ingress）
# 生产环境建议使用 cert-manager 自动管理证书
apiVersion: v1
kind: Secret
metadata:
  name: ai-ready-tls-secret
  namespace: ai-ready
  labels:
    app: ai-ready
    component: tls
type: kubernetes.io/tls
stringData:
  # 这里应该包含真实的 TLS 证书和私钥
  # tls.crt: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----
  # tls.key: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   ...
  #   -----END RSA PRIVATE KEY-----
  tls.crt: "placeholder-certificate"
  tls.key: "placeholder-private-key"
---
# Docker Registry Secret（用于拉取私有镜像）
# 使用命令生成：kubectl create secret docker-registry ai-ready-registry-secret \
#   --docker-server=your-registry.com \
#   --docker-username=your-username \
#   --docker-password=your-password \
#   --namespace=ai-ready
apiVersion: v1
kind: Secret
metadata:
  name: ai-ready-registry-secret
  namespace: ai-ready
  labels:
    app: ai-ready
    component: registry
type: kubernetes.io/dockerconfigjson
