# 开发环境配置
server:
  port: 5655

spring:
  main:
    allow-bean-definition-overriding: true
    web-application-type: servlet
    allow-circular-references: true  # 允许循环引用以解决BeanPostProcessor警告
  autoconfigure:
    exclude:
      - org.springframework.cloud.gateway.config.GatewayRedisAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayMetricsAutoConfiguration
      - org.optaplanner.spring.boot.autoconfigure.OptaPlannerAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false  # 关闭 JPA open-in-view 以消除警告
  datasource:
    url: jdbc:postgresql://localhost:5432/devdb
    username: devuser
    password: devuser123
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  sql:
    init:
      mode: never
  redis:
    enabled: true
  flyway:
    enabled: true
    out-of-order: true
    repair-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

ai-ready:
  rate-limit:
    enabled: true

management:
  health:
    rabbit:
      enabled: false
    elasticsearch:
      enabled: false
    db:
      enabled: true
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    cn.aiedge: DEBUG
    org.springframework.web: DEBUG

# ── 本地文件存储根目录（图片/附件）──
# ⚠️ 必须显式给绝对路径：代码默认值 ./uploads 是相对 JVM 工作目录解析的，
#    IDE 在模块目录启动、命令行在仓库根启动会写到不同目录，
#    导致 A 实例上传的图片在 B 实例上 404（前端 <img> 加载失败并刷 Sentry）。
storage:
  local:
    base-path: ${STORAGE_LOCAL_BASE_PATH:I:/AI-Ready/uploads}
