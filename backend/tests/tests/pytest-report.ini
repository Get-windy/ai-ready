[pytest]
# 测试报告配置

# 测试路径
testpaths = tests/api tests/e2e tests/integration tests/unit

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# HTML报告配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --html=reports/report.html
    --self-contained-html
    --json-report
    --json-report-file=reports/report.json
    --cov=src
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage.xml
    --cov-report=term-missing

# 标记定义
markers =
    ai: AI模块测试
    e2e: 端到端测试
    mock: Mock模式测试
    real: 真实服务测试
    core: 核心模块测试
    approval: 智能审批模块
    recommendation: 智能推荐模块
    report: 智能报表模块
    search: 智能搜索模块
    dialog: 智能对话模块
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试
    api: API测试
    integration: 集成测试
    performance: 性能测试
    security: 安全测试
    unit: 单元测试
    serial: 串行测试（不支持并行）
    parallel: 并行测试

# 忽略目录
norecursedirs = .git .tox build dist *.egg venv __pycache__ .pytest_cache

# 环境变量
env = 
    TEST_ENV=test
    PYTHONPATH=.
    PYTEST_CURRENT_TEST=1
