environment_variables:
  TEST_ENVIRONMENT: "integration"
  TEST_DATA_VOLUME: "medium"
  TEST_CONCURRENT_USERS: "50"
  TEST_DURATION_MINUTES: "10"
  
  SERVICE_REGISTRY_URL: "http://localhost:8848/nacos"
  CONFIG_CENTER_URL: "http://localhost:8848/nacos"
  API_GATEWAY_URL: "http://localhost:8080"
  
  DATABASE_URL: "jdbc:postgresql://localhost:5432/ai_ready_test"
  DATABASE_USERNAME: "test_user"
  DATABASE_PASSWORD: "test_password"
  
  REDIS_URL: "redis://localhost:6379"
  KAFKA_BOOTSTRAP_SERVERS: "localhost:9092,localhost:9093,localhost:9094"
  
  MONITORING_PROMETHEUS_URL: "http://localhost:9090"
  MONITORING_GRAFANA_URL: "http://localhost:3000"
  TRACING_JAEGER_URL: "http://localhost:16686"