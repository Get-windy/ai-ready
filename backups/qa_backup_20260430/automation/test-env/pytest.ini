[pytest]
# ========== 测试文件配置 ==========
# 测试文件匹配模式
testpaths = 
    tests
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
    *Test
python_functions = 
    test_*

# ========== 测试运行配置 ==========
# 默认命令行选项
addopts = 
    -v                  # 详细输出
    --strict-markers    # 严格标记检查
    --strict-config     # 严格配置检查
    --tb=short          # 简短的回溯信息
    --color=yes         # 彩色输出
    --durations=10      # 显示最慢的10个测试

# 测试发现配置
norecursedirs = 
    .git
    __pycache__
    *.egg-info
    .pytest_cache
    .tox
    build
    dist
    node_modules
    venv
    .venv
    env
    .env

# ========== 测试标记配置 ==========
# 预定义的测试标记
markers =
    # 测试类型标记
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    api: API测试
    ui: UI测试
    performance: 性能测试
    
    # 测试特性标记
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试（执行时间>1秒）
    flaky: 不稳定的测试
    xfail: 预期失败的测试
    skip: 跳过的测试
    
    # 功能模块标记
    auth: 认证授权测试
    user: 用户管理测试
    order: 订单管理测试
    product: 产品管理测试
    inventory: 库存管理测试
    payment: 支付测试
    notification: 通知测试
    
    # 技术栈标记
    database: 数据库测试
    cache: 缓存测试
    message_queue: 消息队列测试
    security: 安全测试

# ========== 测试过滤配置 ==========
# 测试过滤规则
filterwarnings =
    # 忽略特定警告
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning
    
    # 转换为错误
    error::UserWarning
    error::RuntimeWarning

# ========== 测试报告配置 ==========
# HTML报告配置
htmlpath = reports/pytest_report.html
html_self_contained = true
html_theme = standard

# JUnit报告配置
junit_suite_name = AI-Ready自动化测试
junit_logging = all
junit_duration_report = call

# Allure报告配置
allure_report_dir = reports/allure
allure_features = 
allure_stories = 

# ========== 测试执行配置 ==========
# 超时配置
timeout = 300                 # 单个测试超时时间（秒）
timeout_method = thread       # 超时检测方法

# 并行执行配置
# xdist = true
# numprocesses = auto
# maxprocesses = 4
# work-steal = true

# 失败重试配置
# reruns = 2
# reruns_delay = 1

# ========== 测试覆盖率配置 ==========
# 覆盖率报告配置
cov_source = 
    tests
    optimized_framework
cov_report = 
    term
    html
    xml
    json
cov_fail_under = 80           # 覆盖率低于80%时失败
cov_branch = true             # 分支覆盖率
cov_omit = 
    */test_*
    */__pycache__/*
    */tests/*

# ========== 测试日志配置 ==========
# 日志配置
log_level = INFO
log_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)8s %(name)s: %(message)s
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ========== 自定义配置 ==========
# 测试环境配置
test_env = test
test_config_file = optimized_framework/config/global.yaml

# 数据库配置
test_database = 
    postgresql
    redis

# API配置
test_api_base_url = http://localhost:8080
test_api_timeout = 30

# UI测试配置
test_browser = chrome
test_headless = true
test_viewport_width = 1920
test_viewport_height = 1080

# 性能测试配置
test_performance_threshold = 1000ms
test_concurrent_users = 10
test_duration = 5m

# ========== 插件配置 ==========
# 启用的pytest插件
required_plugins =
    pytest-cov
    pytest-html
    pytest-xdist
    pytest-timeout
    # pytest-rerunfailures
    # pytest-parallel
    # pytest-benchmark
    # allure-pytest
    # pytest-selenium
    # pytest-playwright

# ========== 钩子配置 ==========
# 自定义钩子配置
hook_timeout = 60
hook_retry = 3
hook_log_level = INFO

# ========== 环境变量配置 ==========
# 环境变量默认值
env =
    TEST_ENV=test
    PYTHONPATH=.
    PYTHONUNBUFFERED=1
    PYTHONDONTWRITEBYTECODE=1