cluster.name: "ai-ready-logs"
node.name: "ai-ready-node-1"

# 网络配置
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# 单节点模式
discovery.type: single-node

# 安全配置 (测试环境关闭)
xpack.security.enabled: false
xpack.security.http.ssl.enabled: false
xpack.security.transport.ssl.enabled: false

# 索引配置
action.destructive_requires_name: true

# 内存配置
bootstrap.memory_lock: false

# 索引模板配置
# 日志索引配置
index:
  number_of_shards: 1
  number_of_replicas: 0

# 索引生命周期管理
ilm:
  enabled: true

# 索引模板
# AI-Ready日志索引模板
index.templates:
  - name: "ai-ready-logs-template"
    pattern: "ai-ready-logs-*"
    settings:
      number_of_shards: 1
      number_of_replicas: 0
      refresh_interval: "5s"
    mappings:
      properties:
        "@timestamp":
          type: "date"
        message:
          type: "text"
        log.level:
          type: "keyword"
        service:
          type: "keyword"
        trace.id:
          type: "keyword"
        span.id:
          type: "keyword"
        component:
          type: "keyword"
        host.name:
          type: "keyword"

# 索引生命周期策略
ilm.policies:
  - name: "ai-ready-logs-policy"
    policy:
      phases:
        hot:
          min_age: "0ms"
          actions:
            rollover:
              max_age: "1d"
              max_size: "50gb"
        warm:
          min_age: "7d"
          actions:
            shrink:
              number_of_shards: 1
            forcemerge:
              max_num_segments: 1
        delete:
          min_age: "30d"
          actions:
            delete: {}

# 慢日志配置
index.search.slowlog.threshold.query.warn: "10s"
index.search.slowlog.threshold.query.info: "5s"
index.indexing.slowlog.threshold.index.warn: "10s"
index.indexing.slowlog.threshold.index.info: "5s"

# 监控配置
monitoring.enabled: false

# 路径配置
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs