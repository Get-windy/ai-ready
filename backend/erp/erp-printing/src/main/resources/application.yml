spring:
  application:
    name: erp-signature
  
  # [数据源已统一到 core-api 主模块管理，各子模块不再单独配置数据库连接]
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/ai_ready
  #   username: postgres
  #   password: postgres
  #   driver-class-name: org.postgresql.Driver
  
  redis:
    host: localhost
    port: 6379
    database: 0
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.aiedge.erp.signature.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8096

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    cn.aiedge: debug
    org.springframework: info