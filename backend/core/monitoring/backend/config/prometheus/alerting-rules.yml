# Prometheus 告警规则配置
# 版本: v1.0.0
# 环境: AI-Ready 测试环境
# 创建日期: 2026-04-30

groups:
  # ==================== 基础设施告警规则组 ====================
  - name: infrastructure-alerts
    interval: 30s
    rules:
      # 节点宕机告警
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          environment: test
          service: infrastructure
        annotations:
          summary: "节点 {{ $labels.instance }} 宕机"
          description: "节点 {{ $labels.instance }} 已经宕机超过2分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/infrastructure/node-down"

      # 高CPU使用率告警
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: critical
          environment: test
          service: infrastructure
        annotations:
          summary: "CPU使用率过高 - {{ $labels.instance }}"
          description: "节点 {{ $labels.instance }} 的CPU使用率超过90%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/infrastructure/high-cpu"

      # 高内存使用率告警
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
          environment: test
          service: infrastructure
        annotations:
          summary: "内存使用率过高 - {{ $labels.instance }}"
          description: "节点 {{ $labels.instance }} 的内存使用率超过90%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/infrastructure/high-memory"

      # 高磁盘使用率告警
      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} - node_filesystem_free_bytes{fstype!~"tmpfs|ramfs"}) / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs"} * 100 > 85
        for: 10m
        labels:
          severity: warning
          environment: test
          service: infrastructure
        annotations:
          summary: "磁盘使用率过高 - {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "节点 {{ $labels.instance }} 的挂载点 {{ $labels.mountpoint }} 磁盘使用率超过85%持续10分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/infrastructure/high-disk"

      # 系统负载过高告警
      - alert: HighSystemLoad
        expr: node_load1 > count by(instance) (node_cpu_seconds_total{mode="system"}) * 0.8
        for: 5m
        labels:
          severity: warning
          environment: test
          service: infrastructure
        annotations:
          summary: "系统负载过高 - {{ $labels.instance }}"
          description: "节点 {{ $labels.instance }} 的1分钟系统负载超过CPU核心数的80%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/infrastructure/high-load"

  # ==================== 应用服务告警规则组 ====================
  - name: application-alerts
    interval: 30s
    rules:
      # 服务不可用告警
      - alert: ServiceDown
        expr: up{job=~"ai-ready-.*"} == 0
        for: 1m
        labels:
          severity: critical
          environment: test
        annotations:
          summary: "服务 {{ $labels.job }} 不可用"
          description: "服务 {{ $labels.job }} 实例 {{ $labels.instance }} 已经不可用超过1分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/application/service-down"

      # 高JVM堆内存使用率告警
      - alert: HighJVMHeapUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} * 100 > 85
        for: 5m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "JVM堆内存使用率过高 - {{ $labels.job }}"
          description: "服务 {{ $labels.job }} 实例 {{ $labels.instance }} 的JVM堆内存使用率超过85%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/application/high-jvm-heap"

      # 频繁GC告警
      - alert: FrequentGC
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "频繁GC - {{ $labels.job }}"
          description: "服务 {{ $labels.job }} 实例 {{ $labels.instance }} 的GC暂停时间超过0.1秒/秒持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/application/frequent-gc"

      # 高线程数告警
      - alert: HighThreadCount
        expr: jvm_threads_live_threads > 500
        for: 5m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "线程数过高 - {{ $labels.job }}"
          description: "服务 {{ $labels.job }} 实例 {{ $labels.instance }} 的活跃线程数超过500持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/application/high-thread-count"

  # ==================== API性能告警规则组 ====================
  - name: api-performance-alerts
    interval: 30s
    rules:
      # API响应时间过长告警
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "API响应时间过高 - {{ $labels.uri }}"
          description: "API {{ $labels.uri }} 的P95响应时间超过2秒持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/api/high-latency"

      # API错误率过高告警
      - alert: HighAPIErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
          environment: test
        annotations:
          summary: "API错误率过高 - {{ $labels.uri }}"
          description: "API {{ $labels.uri }} 的错误率超过5%持续2分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/api/high-error-rate"

      # API吞吐量下降告警
      - alert: LowAPIThroughput
        expr: rate(http_server_requests_seconds_count[10m]) < rate(http_server_requests_seconds_count[40m:10m])
        for: 5m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "API吞吐量下降 - {{ $labels.uri }}"
          description: "API {{ $labels.uri }} 的吞吐量相比40分钟前下降"
          runbook: "https://wiki.ai-ready.com/runbooks/api/low-throughput"

  # ==================== 数据库告警规则组 ====================
  - name: database-alerts
    interval: 30s
    rules:
      # 数据库连接池耗尽告警
      - alert: DatabaseConnectionPoolExhausted
        expr: spring_datasource_max_connections - spring_datasource_active_connections < 5
        for: 2m
        labels:
          severity: critical
          environment: test
          service: database
        annotations:
          summary: "数据库连接池即将耗尽"
          description: "数据库连接池可用连接数小于5持续2分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/database/connection-pool-exhausted"

      # 慢查询过多告警
      - alert: HighSlowQueries
        expr: rate(pg_stat_statements_calls{query!~".*pg_stat.*"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          environment: test
          service: database
        annotations:
          summary: "慢查询过多"
          description: "慢查询数量超过10次/分钟持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/database/slow-queries"

      # 数据库锁等待告警
      - alert: DatabaseLockWait
        expr: pg_stat_activity_waiting > 5
        for: 2m
        labels:
          severity: warning
          environment: test
          service: database
        annotations:
          summary: "数据库锁等待过多"
          description: "数据库锁等待连接数超过5持续2分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/database/lock-wait"

  # ==================== 缓存告警规则组 ====================
  - name: cache-alerts
    interval: 30s
    rules:
      # Redis内存使用率过高告警
      - alert: HighRedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          environment: test
          service: cache
        annotations:
          summary: "Redis内存使用率过高"
          description: "Redis内存使用率超过85%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/cache/high-redis-memory"

      # Redis连接数过高告警
      - alert: HighRedisConnections
        expr: redis_connected_clients > 100
        for: 5m
        labels:
          severity: warning
          environment: test
          service: cache
        annotations:
          summary: "Redis连接数过高"
          description: "Redis连接数超过100持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/cache/high-redis-connections"

      # Redis缓存命中率低告警
      - alert: LowRedisHitRate
        expr: redis_keyspace_hits / (redis_keyspace_hits + redis_keyspace_misses) * 100 < 80
        for: 10m
        labels:
          severity: warning
          environment: test
          service: cache
        annotations:
          summary: "Redis缓存命中率低"
          description: "Redis缓存命中率低于80%持续10分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/cache/low-hit-rate"

  # ==================== 消息队列告警规则组 ====================
  - name: message-queue-alerts
    interval: 30s
    rules:
      # 消息队列积压告警
      - alert: MessageQueueBacklog
        expr: rabbitmq_queue_messages_ready > 1000
        for: 5m
        labels:
          severity: warning
          environment: test
          service: message-queue
        annotations:
          summary: "消息队列积压 - {{ $labels.queue }}"
          description: "队列 {{ $labels.queue }} 积压消息超过1000持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/message-queue/backlog"

      # 消息处理失败告警
      - alert: MessageProcessingFailed
        expr: rate(rabbitmq_queue_messages_unacknowledged[5m]) > 10
        for: 2m
        labels:
          severity: critical
          environment: test
          service: message-queue
        annotations:
          summary: "消息处理失败 - {{ $labels.queue }}"
          description: "队列 {{ $labels.queue }} 消息处理失败率过高"
          runbook: "https://wiki.ai-ready.com/runbooks/message-queue/processing-failed"

  # ==================== 业务指标告警规则组 ====================
  - name: business-metrics-alerts
    interval: 30s
    rules:
      # 用户登录失败率过高告警
      - alert: HighUserLoginFailureRate
        expr: rate(user_login_failed_total[5m]) / rate(user_login_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          environment: test
          service: authentication
        annotations:
          summary: "用户登录失败率过高"
          description: "用户登录失败率超过10%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/business/high-login-failure"

      # 订单创建失败率过高告警
      - alert: HighOrderCreationFailureRate
        expr: rate(order_creation_failed_total[5m]) / rate(order_creation_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          environment: test
          service: order
        annotations:
          summary: "订单创建失败率过高"
          description: "订单创建失败率超过5%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/business/high-order-failure"

      # 支付成功率过低告警
      - alert: LowPaymentSuccessRate
        expr: rate(payment_success_total[5m]) / rate(payment_total[5m]) < 0.95
        for: 5m
        labels:
          severity: critical
          environment: test
          service: payment
        annotations:
          summary: "支付成功率过低"
          description: "支付成功率低于95%持续5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/business/low-payment-success"

  # ==================== 监控系统自身告警规则组 ====================
  - name: monitoring-system-alerts
    interval: 30s
    rules:
      # Prometheus自身目标抓取失败告警
      - alert: PrometheusTargetScrapeFailed
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          environment: test
          service: monitoring
        annotations:
          summary: "Prometheus目标抓取失败 - {{ $labels.job }}"
          description: "Prometheus无法抓取目标 {{ $labels.instance }} 的数据超过5分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/monitoring/target-scrape-failed"

      # Prometheus存储写入失败告警
      - alert: PrometheusStorageWriteFailed
        expr: prometheus_tsdb_head_chunks_created_total - prometheus_tsdb_head_chunks > 1000
        for: 2m
        labels:
          severity: critical
          environment: test
          service: monitoring
        annotations:
          summary: "Prometheus存储写入失败"
          description: "Prometheus存储写入异常，chunk创建与存储差异过大"
          runbook: "https://wiki.ai-ready.com/runbooks/monitoring/storage-write-failed"

      # Grafana不可用告警
      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          severity: critical
          environment: test
          service: monitoring
        annotations:
          summary: "Grafana不可用"
          description: "Grafana监控面板不可用超过2分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/monitoring/grafana-down"

      # Alertmanager不可用告警
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
          environment: test
          service: monitoring
        annotations:
          summary: "Alertmanager不可用"
          description: "Alertmanager告警管理器不可用超过2分钟"
          runbook: "https://wiki.ai-ready.com/runbooks/monitoring/alertmanager-down"