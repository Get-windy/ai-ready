# Grafana优化配置 - Sprint 29
# 文件名: grafana-config-optimized.ini
# 版本: v2.0.0-optimized
# 更新日期: 2026-04-26
# 优化重点: 面板加载性能、数据源连接池、缓存策略

# ===========================================
# [server] - 服务配置优化
# ===========================================
[server]
# HTTP协议优化
protocol = http
http_addr = 0.0.0.0
http_port = 3000

# 性能优化配置
# 最大并发请求
max_connections = 500
# 连接超时优化（减少慢连接占用）
conn_timeout = 10s
# 读取超时优化
read_timeout = 30s
# 写入超时优化
write_timeout = 30s

# 压缩优化（减少传输数据量）
enable_gzip = true
gzip_level = 5

# 域名配置（生产环境）
domain = grafana.ai-ready.local
root_url = https://grafana.ai-ready.local/

# ===========================================
# [database] - 数据库配置优化
# ===========================================
[database]
# 使用PostgreSQL作为后端存储（提升查询性能）
type = postgres
host = postgres:5432
name = grafana
user = grafana
password = ${GRAFANA_DB_PASSWORD}

# 连接池优化配置
# 最大连接数（提升并发查询能力）
max_open_conn = 50
# 最大空闲连接（保持连接池活跃）
max_idle_conn = 25
# 连接最大生命周期（防止连接泄漏）
conn_max_lifetime = 5m

# 查询优化
query_log_mode = console

# ===========================================
# [dataproxy] - 数据源代理优化（关键优化）
# ===========================================
[dataproxy]
# 超时配置优化（防止面板加载卡顿）
timeout = 30s
# 保持连接活跃（减少重连开销）
keep_alive_seconds = 30
# 连接超时优化
connect_timeout = 10s
# 读超时优化
read_timeout = 30s
# 写超时优化
write_timeout = 30s

# 并发查询优化（关键性能提升）
# 最大并发查询请求
max_concurrent_queries = 50
# 启用查询缓存
enable_query_cache = true
# 缓存过期时间
cache_ttl = 5m
# 缓存最大条目数
cache_max_entries = 10000

# SSL配置
ssl_skip_verify = true

# ===========================================
# [session] - Session配置优化
# ===========================================
[session]
# Session存储优化（使用Redis分布式存储）
provider = redis
provider_config = addr=redis:6379,pool_size=50,db=1

# Session配置
cookie_name = grafana_session
cookie_secure = true
session_life_time = 86400  # 24小时

# ===========================================
# [cache] - 缓存配置优化（面板加载关键优化）
# ===========================================
[cache]
# 使用Redis缓存（提升面板加载速度）
enabled = true
type = redis

# Redis缓存配置
redis_addr = redis:6379
redis_db = 2
redis_pool_size = 50
redis_password = ${REDIS_PASSWORD}

# 缓存过期配置
default_ttl = 5m
dashboard_ttl = 10m
datasource_ttl = 1m

# ===========================================
# [alerting] - 告警配置优化
# ===========================================
[alerting]
# 告警执行优化
enabled = true
execute_alerts = true

# 告警检查间隔优化（减少告警延迟）
evaluation_interval = 10s

# 告警并发执行（提升告警处理速度）
max_alerts_per_cycle = 100

# 告警通知优化
notification_timeout = 30s

# ===========================================
# [unified_alerting] - 统一告警优化（Grafana 8+）
# ===========================================
[unified_alerting]
enabled = true

# 告警规则执行间隔
execute_interval = 10s

# 告警评估间隔
evaluation_interval = 10s

# 告警状态缓存
state_history_ttl = 24h

# ===========================================
# [dashboards] - 面板配置优化
# ===========================================
[dashboards]
# 面板版本控制
versions_to_keep = 20

# 面板自动刷新优化（减少用户手动刷新）
default_home_dashboard_path = /dashboards/home.json

# 面板导入优化
min_refresh_interval = 5s

# ===========================================
# [users] - 用户配置优化
# ===========================================
[users]
# 自动登录优化
auto_assign_org = true
auto_assign_org_id = 1

# 登录优化
login_default_theme = dark
login_disallowed_usernames = admin,grafana

# 用户限制
max_users = 100

# ===========================================
# [auth] - 认证配置优化
# ===========================================
[auth]
# 登录优化
disable_login_form = false

# OAuth优化（企业集成）
oauth_auto_login = false
oauth_state_cookie_max_age = 600

# Token优化
token_rotation_interval_minutes = 10

# ===========================================
# [security] - 安全配置优化
# ===========================================
[security]
# 安全优化
admin_user = admin
admin_password = ${GRAFANA_ADMIN_PASSWORD}

# 密码策略
min_password_length = 8

# 登录尝试限制
login_attempt_limit = 5
login_lockout_duration = 5m

# CSRF保护
csrf_protection = true

# ===========================================
# [metrics] - 指标配置优化
# ===========================================
[metrics]
# 内部指标启用
enabled = true
interval_seconds = 60s

# 指标过滤优化
basic_auth_username = metrics_user
basic_auth_password = ${GRAFANA_METRICS_PASSWORD}

# ===========================================
# [log] - 日志配置优化
# ===========================================
[log]
# 日志级别优化
level = info

# 日志格式优化
format = json

# 日志过滤优化（减少日志量）
[log.filters]
router = info
api = info
session = warning
dataproxy = info

# ===========================================
# [plugins] - 插件配置优化
# ===========================================
[plugins]
# 插件自动更新优化
allow_loading_unsigned_plugins = false

# 插件目录
enable_alpha = false
plugins_dir = /var/lib/grafana/plugins

# ===========================================
# 性能优化总结
# ===========================================
# 1. 连接池优化：PostgreSQL 50连接，Redis 50连接
# 2. 数据源代理优化：并发查询50，缓存10000条目
# 3. 缓存策略：Redis缓存，面板缓存10分钟
# 4. 告警优化：评估间隔10秒，并发执行100告警
# 5. HTTP优化：Gzip压缩，超时优化
# 6. Session优化：Redis分布式存储，24小时有效期