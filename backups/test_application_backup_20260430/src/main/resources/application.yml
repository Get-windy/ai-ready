# Spring Boot 3.2.0 测试应用配置
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-ready-test-app
  
  # 禁用不需要的功能以简化应用
  main:
    web-application-type: servlet
    banner-mode: console
  
  # 简单日志配置
  output:
    ansi:
      enabled: always

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# 日志配置
logging:
  level:
    root: INFO
    cn.aiedge: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/test-application.log
    max-size: 10MB
    max-history: 7

# 应用特定配置
app:
  name: AI-Ready Test Application
  version: 1.0.0
  description: 简化版测试应用，用于解除部署阻塞
  api:
    base-path: /api/v1
    cors:
      allowed-origins: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true