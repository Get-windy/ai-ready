# 预生产环境配置
environment:
  name: "staging"
  description: "预生产环境"
  url: "http://staging.ai-ready.local"
  api_base_url: "http://staging.ai-ready.local/api"

database:
  postgresql:
    host: "postgres-staging.ai-ready.local"
    port: 5432
    database: "ai_ready_staging"
    user: "staging_user"
    password: "staging_password_2026"
    pool_size: 15
    max_overflow: 30
  redis:
    host: "redis-staging.ai-ready.local"
    port: 6379
    db: 0
    password: "redis_staging_2026"
    max_connections: 100

message_queue:
  rabbitmq:
    host: "rabbitmq-staging.ai-ready.local"
    port: 5672
    vhost: "/staging"
    username: "staging_user"
    password: "rabbitmq_staging_2026"
    queue_prefix: "staging_"

api_gateway:
  url: "http://gateway-staging.ai-ready.local"
  timeout: 30
  retry_count: 3
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout_duration: 60000
    half_open_max_calls: 3

monitoring:
  prometheus:
    url: "http://prometheus-staging.ai-ready.local"
    scrape_interval: 15
  grafana:
    url: "http://grafana-staging.ai-ready.local"
    dashboard_id: "staging_env"
  alertmanager:
    url: "http://alertmanager-staging.ai-ready.local"
    receivers:
      - email
      - slack
      - webhook

test_data:
  users:
    count: 5000
    active_ratio: 0.7
  products:
    count: 20000
    categories: ["电子产品", "办公用品", "家居用品", "图书音像", "服装鞋帽"]
  orders:
    count: 50000
    date_range: "3 months"
  performance:
    concurrent_users: 100
    test_duration: "30m"
    think_time: "5s"