# Kafka 3.6 集群配置 - 测试环境
# Sprint 27+1 消息队列配置验证

apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: ai-ready-test
data:
  server.properties: |
    # 集群配置
    broker.id=${KAFKA_BROKER_ID}
    log.dirs=/var/lib/kafka/data
    
    # 监听器配置
    listeners=PLAINTEXT://:9092,SSL://:9093
    advertised.listeners=PLAINTEXT://kafka-${KAFKA_BROKER_ID}.kafka-headless.ai-ready-test.svc.cluster.local:9092,SSL://kafka-${KAFKA_BROKER_ID}.kafka-headless.ai-ready-test.svc.cluster.local:9093
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,SSL:SSL
    inter.broker.listener.name=PLAINTEXT
    
    # Zookeeper配置
    zookeeper.connect=zookeeper-0.zookeeper-headless.ai-ready-test.svc.cluster.local:2181,zookeeper-1.zookeeper-headless.ai-ready-test.svc.cluster.local:2181,zookeeper-2.zookeeper-headless.ai-ready-test.svc.cluster.local:2181
    zookeeper.connection.timeout.ms=18000
    
    # 日志保留配置
    log.retention.hours=168
    log.retention.bytes=107374182400
    log.segment.bytes=1073741824
    log.retention.check.interval.ms=300000
    
    # 副本配置
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    default.replication.factor=3
    min.insync.replicas=2
    
    # 网络配置
    num.network.threads=3
    num.io.threads=8
    socket.send.buffer.bytes=102400
    socket.receive.buffer.bytes=102400
    socket.request.max.bytes=104857600
    
    # 分区配置
    num.partitions=3
    num.recovery.threads.per.data.dir=1
    
    # 内部主题配置
    auto.create.topics.enable=false
    delete.topic.enable=true
    
    # 性能配置
    log.flush.interval.messages=10000
    log.flush.interval.ms=1000
    
    # 压缩配置
    compression.type=producer
    
    # 监控配置
    metric.reporters=kafka.metrics.KafkaMetricsReporter
    metrics.num.samples=2
    metrics.recording.level=INFO
    
    # 消费者组配置
    group.initial.rebalance.delay.ms=3000
    
    # 事务配置
    transaction.max.timeout.ms=900000
    transactional.id.expiration.ms=604800000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-scripts
  namespace: ai-ready-test
data:
  init.sh: |
    #!/bin/bash
    set -e
    
    # 设置broker ID
    export KAFKA_BROKER_ID=${HOSTNAME##*-}
    echo "Setting broker ID to: $KAFKA_BROKER_ID"
    
    # 替换配置文件中的环境变量
    envsubst < /config/server.properties > /tmp/server.properties
    mv /tmp/server.properties /config/server.properties
    
    # 启动Kafka
    exec kafka-server-start.sh /config/server.properties

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ai-ready-test
  labels:
    app: kafka
    version: "3.6"
spec:
  serviceName: kafka-headless
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - kafka
                topologyKey: kubernetes.io/hostname
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - name: plaintext
              containerPort: 9092
            - name: ssl
              containerPort: 9093
            - name: jmx
              containerPort: 9999
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx1G -Xms1G"
            - name: KAFKA_JMX_PORT
              value: "9999"
            - name: KAFKA_OPTS
              value: "-Djava.security.auth.login.config=/etc/kafka/jaas.conf"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
          command:
            - /bin/bash
            - -c
            - |
              export KAFKA_BROKER_ID=${HOSTNAME##*-}
              envsubst < /config/server.properties > /tmp/server.properties
              kafka-server-start.sh /tmp/server.properties
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - kafka-broker-api-versions.sh
                - --bootstrap-server
                - localhost:9092
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: kafka-config
        - name: scripts
          configMap:
            name: kafka-scripts
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: ai-ready-test
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: ssl
      port: 9093
      targetPort: 9093
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ai-ready-test
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: ssl
      port: 9093
      targetPort: 9093
  type: ClusterIP

---
# Zookeeper配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-config
  namespace: ai-ready-test
data:
  zookeeper.properties: |
    tickTime=2000
    dataDir=/var/lib/zookeeper/data
    dataLogDir=/var/lib/zookeeper/log
    clientPort=2181
    initLimit=5
    syncLimit=2
    server.0=zookeeper-0.zookeeper-headless.ai-ready-test.svc.cluster.local:2888:3888
    server.1=zookeeper-1.zookeeper-headless.ai-ready-test.svc.cluster.local:2888:3888
    server.2=zookeeper-2.zookeeper-headless.ai-ready-test.svc.cluster.local:2888:3888
    autopurge.snapRetainCount=3
    autopurge.purgeInterval=24
    maxClientCnxns=60
    admin.enableServer=false

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: ai-ready-test
  labels:
    app: zookeeper
spec:
  serviceName: zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - zookeeper
                topologyKey: kubernetes.io/hostname
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - name: client
              containerPort: 2181
            - name: follower
              containerPort: 2888
            - name: election
              containerPort: 3888
          env:
            - name: ZOOKEEPER_SERVER_ID
              value: "${HOSTNAME##*-}"
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_INIT_LIMIT
              value: "5"
            - name: ZOOKEEPER_SYNC_LIMIT
              value: "2"
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
            - name: config
              mountPath: /etc/kafka/zookeeper.properties
              subPath: zookeeper.properties
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - zkServer.sh
                - status
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - zkServer.sh
                - status
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: zookeeper-config
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
    - metadata:
        name: zookeeper-log
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: ai-ready-test
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: follower
      port: 2888
      targetPort: 2888
    - name: election
      port: 3888
      targetPort: 3888
  clusterIP: None

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: ai-ready-test
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
  type: ClusterIP

---
# Kafka Topics配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-config
  namespace: ai-ready-test
data:
  topics.json: |
    {
      "topics": [
        {
          "name": "test-topic-1",
          "partitions": 3,
          "replicationFactor": 3,
          "config": {
            "retention.ms": "604800000",
            "cleanup.policy": "delete",
            "min.insync.replicas": "2"
          }
        },
        {
          "name": "test-topic-2",
          "partitions": 6,
          "replicationFactor": 3,
          "config": {
            "retention.ms": "2592000000",
            "cleanup.policy": "compact",
            "min.insync.replicas": "2"
          }
        },
        {
          "name": "dead-letter-topic",
          "partitions": 3,
          "replicationFactor": 3,
          "config": {
            "retention.ms": "1209600000",
            "cleanup.policy": "delete",
            "max.message.bytes": "10485760"
          }
        }
      ]
    }
