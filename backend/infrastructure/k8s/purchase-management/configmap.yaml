# ERP采购管理模块Kubernetes配置映射
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-purchase-config
  namespace: erp
  labels:
    app: erp-purchase-service
    component: purchase-management
    environment: test
data:
  # 应用配置文件
  application.yml: |
    # 采购管理模块配置
    server:
      port: 8080
    
    spring:
      application:
        name: erp-purchase-service
      
      # 数据源配置（通过环境变量注入）
      datasource:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=true
        username: ${DB_USER}
        password: ${DB_PASSWORD}
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
      
      # Redis配置
      redis:
        host: ${REDIS_HOST}
        port: 6379
        password: ${REDIS_PASSWORD}
        database: 3
      
      # RabbitMQ配置
      rabbitmq:
        host: ${RABBITMQ_HOST}
        port: 5672
        username: ${RABBITMQ_USER}
        password: ${RABBITMQ_PASSWORD}
        virtual-host: /erp_purchase_test
    
    # 采购模块特定配置
    erp:
      purchase:
        api:
          prefix: /api/v1/purchase
          admin-prefix: /api/admin/purchase
          mobile-prefix: /api/mobile/purchase
        business:
          default-currency: CNY
          tax-rate: 0.13
          approval-threshold: 10000.00
          auto-approve-enabled: false
        integration:
          finance:
            base-url: http://erp-finance-service.erp.svc.cluster.local:8080
            timeout: 10000
          stock:
            base-url: http://erp-stock-service.erp.svc.cluster.local:8080
            timeout: 10000
          supplier:
            base-url: http://erp-supplier-service.erp.svc.cluster.local:8080
            timeout: 8000
        security:
          allowed-origins: https://test.ai-ready.com,https://admin-test.ai-ready.com
          allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    
    # 监控配置
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
        base-path: /actuator
      metrics:
        export:
          prometheus:
            enabled: true
        tags:
          environment: test
          application: erp-purchase-service
  
  # 日志配置文件
  logback-spring.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
        <include resource="org/springframework/boot/logging/logback/defaults.xml"/>
        
        <property name="LOG_PATH" value="/app/logs"/>
        <property name="LOG_FILE" value="${LOG_PATH}/erp-purchase.log"/>
        <property name="MAX_FILE_SIZE" value="50MB"/>
        <property name="MAX_HISTORY" value="30"/>
        
        <!-- 控制台输出 -->
        <appender name="CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>
        
        <!-- 文件输出 -->
        <appender name="FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <file>${LOG_FILE}</file>
            <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
                <fileNamePattern>${LOG_PATH}/erp-purchase-%d{yyyy-MM-dd}.%i.log</fileNamePattern>
                <timeBasedFileNamingAndTriggeringPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedFNATP">
                    <maxFileSize>${MAX_FILE_SIZE}</maxFileSize>
                </timeBasedFileNamingAndTriggeringPolicy>
                <maxHistory>${MAX_HISTORY}</maxHistory>
                <totalSizeCap>5GB</totalSizeCap>
            </rollingPolicy>
            <encoder>
                <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
                <charset>UTF-8</charset>
            </encoder>
        </appender>
        
        <!-- 异步文件输出 -->
        <appender name="ASYNC_FILE" class="ch.qos.logback.classic.AsyncAppender">
            <appender-ref ref="FILE"/>
            <queueSize>512</queueSize>
            <discardingThreshold>0</discardingThreshold>
            <includeCallerData>true</includeCallerData>
        </appender>
        
        <!-- 日志级别配置 -->
        <logger name="cn.aiedge.erp.purchase" level="INFO" additivity="false">
            <appender-ref ref="CONSOLE"/>
            <appender-ref ref="ASYNC_FILE"/>
        </logger>
        
        <logger name="org.springframework.web" level="WARN"/>
        <logger name="org.mybatis" level="WARN"/>
        
        <!-- SQL执行日志 -->
        <logger name="cn.aiedge.erp.purchase.mapper" level="DEBUG" additivity="false">
            <appender-ref ref="ASYNC_FILE"/>
        </logger>
        
        <!-- 根日志 -->
        <root level="INFO">
            <appender-ref ref="CONSOLE"/>
            <appender-ref ref="ASYNC_FILE"/>
        </root>
    </configuration>
  
  # Prometheus监控指标配置
  prometheus-rules.yml: |
    groups:
    - name: erp-purchase-rules
      rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{job="erp-purchase-service",status!~"2.."}[5m]) * 100 / rate(http_server_requests_seconds_count{job="erp-purchase-service"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "采购模块高错误率"
          description: "采购服务错误率超过10% (当前值: {{ $value }}%)"
      
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="erp-purchase-service"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          environment: test
        annotations:
          summary: "采购模块响应时间过高"
          description: "采购服务P95响应时间超过1秒 (当前值: {{ $value }}秒)"
      
      - alert: ServiceDown
        expr: up{job="erp-purchase-service"} == 0
        for: 1m
        labels:
          severity: critical
          environment: test
        annotations:
          summary: "采购服务下线"
          description: "采购服务已下线超过1分钟"
  
  # 健康检查配置
  health-check-config.yml: |
    # 健康检查配置
    management:
      health:
        db:
          enabled: true
          validation-query: "SELECT 1"
        redis:
          enabled: true
        rabbit:
          enabled: true
        diskspace:
          enabled: true
          threshold: 10MB
        ping:
          enabled: true
        readiness-state:
          enabled: true
        liveness-state:
          enabled: true