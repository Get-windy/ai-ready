global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alert@ai-ready.com'
  smtp_auth_username: ''
  smtp_auth_password: ''

# 路由配置
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    # 严重告警路由
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    
    # 警告路由
    - match:
        severity: warning
      receiver: 'warning'

# 接收器配置
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/alerts/webhook'
        send_resolved: true

  - name: 'critical'
    email_configs:
      - to: 'admin@ai-ready.com'
        subject: '[CRITICAL] AI-Ready 告警: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          告警名称: {{ .Annotations.summary }}
          严重程度: {{ .Labels.severity }}
          实例: {{ .Labels.instance }}
          描述: {{ .Annotations.description }}
          时间: {{ .StartsAt }}
          {{ end }}
    
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/alerts/webhook'
        send_resolved: true

  - name: 'warning'
    email_configs:
      - to: 'ops@ai-ready.com'
        subject: '[WARNING] AI-Ready 告警: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          告警名称: {{ .Annotations.summary }}
          严重程度: {{ .Labels.severity }}
          实例: {{ .Labels.instance }}
          描述: {{ .Annotations.description }}
          时间: {{ .StartsAt }}
          {{ end }}

# 抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
