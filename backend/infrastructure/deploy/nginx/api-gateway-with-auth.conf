# AI-Ready Test Environment API Gateway Configuration with OAuth2 Authentication
# API Gateway (Nginx) - Routes requests to microservices with JWT validation

upstream user-service {
    server localhost:8081;
    server localhost:8082;
}

upstream order-service {
    server localhost:8083;
}

upstream inventory-service {
    server localhost:8085;
}

upstream monitoring-service {
    server localhost:8086;
}

upstream auth-service {
    server localhost:8087;
}

server {
    listen 8080;
    server_name localhost;
    
    # Logging
    access_log /var/log/nginx/api-gateway-access.log;
    error_log /var/log/nginx/api-gateway-error.log;
    
    # Authentication Endpoint - No auth required
    location /oauth2/ {
        proxy_pass http://auth-service/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Health Check Endpoint - No auth required
    location /actuator/health {
        proxy_pass http://localhost:8086/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Swagger UI - No auth required
    location /swagger-ui/ {
        proxy_pass http://user-service/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    location /v3/api-docs {
        proxy_pass http://user-service/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # JWT Token Validation Configuration
    # This would normally require lua-nginx-module or nginx-jwt module
    # For now, we'll rely on microservices to validate tokens
    
    # User Service Routes - with token forwarding
    location /api/users/ {
        # Validate JWT token if present
        if ($http_authorization ~* "^Bearer\s+(.+)$") {
            set $jwt_token $1;
            # Token validation would happen here with lua-nginx-module
            # For now, just forward to service
        }
        
        proxy_pass http://user-service/api/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward Authorization header
        proxy_set_header Authorization $http_authorization;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Order Service Routes - with token forwarding
    location /api/orders/ {
        # Basic token presence check
        if ($http_authorization = "") {
            return 401 '{"error":"unauthorized","message":"Missing Authorization header"}';
        }
        
        if ($http_authorization !~* "^Bearer\s+") {
            return 401 '{"error":"unauthorized","message":"Invalid Authorization format. Expected: Bearer <token>"}';
        }
        
        proxy_pass http://order-service/api/orders/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward Authorization header
        proxy_set_header Authorization $http_authorization;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Inventory Service Routes - with token forwarding
    location /api/inventory/ {
        # Basic token presence check
        if ($http_authorization = "") {
            return 401 '{"error":"unauthorized","message":"Missing Authorization header"}';
        }
        
        proxy_pass http://inventory-service/api/inventory/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Forward Authorization header
        proxy_set_header Authorization $http_authorization;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Monitoring Service Routes - with basic auth
    location /api/monitoring/ {
        # Basic authentication for monitoring endpoints
        auth_basic "Monitoring API";
        auth_basic_user_file /etc/nginx/htpasswd.monitoring;
        
        proxy_pass http://monitoring-service/api/monitoring/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Admin Endpoints - with basic auth
    location /admin/ {
        auth_basic "Admin Area";
        auth_basic_user_file /etc/nginx/htpasswd.admin;
        
        proxy_pass http://localhost:8086/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # API Discovery - No auth required
    location / {
        default_type application/json;
        return 200 '{
            "status":"OK",
            "timestamp":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "services":{
                "authentication":"/oauth2/",
                "users":"/api/users/",
                "orders":"/api/orders/",
                "inventory":"/api/inventory/",
                "monitoring":"/api/monitoring/",
                "health":"/actuator/health",
                "documentation":"/swagger-ui/"
            },
            "authentication":{
                "type":"JWT Bearer Token",
                "header":"Authorization: Bearer <token>",
                "token_endpoint":"/oauth2/token"
            },
            "security_notes":[
                "Order and Inventory APIs require JWT Bearer token",
                "Monitoring API uses Basic Authentication",
                "Admin endpoints require admin credentials"
            ]
        }';
    }
}

# Rate limiting for authentication endpoints
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 8088;
    server_name auth.localhost;
    
    location /oauth2/token {
        limit_req zone=auth burst=20 nodelay;
        
        proxy_pass http://auth-service/oauth2/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /oauth2/authorize {
        limit_req zone=auth burst=20 nodelay;
        
        proxy_pass http://auth-service/oauth2/authorize;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /oauth2/userinfo {
        proxy_pass http://auth-service/oauth2/userinfo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}