# Grafana 数据源自动配置
# Version: v1.0.0
# 创建日期: 2026-04-28

apiVersion: 1

# 删除未在此文件中定义的数据源
deleteDatasources:
  - name: Prometheus-Old
    orgId: 1

datasources:
  # Prometheus 主数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.45.0"
      cacheLevel: 'High'
    updateIntervalSeconds: 30

  # Redis 数据源
  - name: Redis-Main
    type: redis-datasource
    access: proxy
    orgId: 1
    url: redis://redis-main:6379
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    jsonData:
      client: standalone
      poolSize: 5

  # Elasticsearch 日志数据源
  - name: Elasticsearch-Logs
    type: elasticsearch
    access: proxy
    orgId: 1
    url: http://elasticsearch:9200
    database: "ai-ready-logs-*"
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    jsonData:
      esVersion: "7.10.0"
      timeField: "@timestamp"
      interval: Daily
      logMessageField: message
      logLevelField: log.level