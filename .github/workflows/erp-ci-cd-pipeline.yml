# ERP系统 CI/CD 流水线
# 支持多环境自动化部署

name: ERP CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - release/*
    paths:
      - 'backend/**'
      - '.github/workflows/erp-ci-cd-pipeline.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
        - dev
        - test
        - staging
        - prod
      version:
        description: '部署版本'
        required: false
        type: string

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_REPOSITORY: aiedge/erp
  K8S_NAMESPACE: erp-${{ github.event.inputs.environment || 'staging' }}
  HELM_CHART_DIR: ./backend/deploy/helm

jobs:
  # 架构治理检查 - 基于紧急制动教训集成
  architecture-governance-check:
    name: 架构治理检查
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 执行架构治理检查
      run: |
        echo "开始执行架构治理检查..."
        echo "基于紧急制动教训：防止架构问题积累导致的架构混乱"
        echo "检查项目："
        echo "1. 目录结构合规性"
        echo "2. 模块边界检查"
        echo "3. 依赖关系检查"
        echo "4. 架构规范检查"
        
        # 确保脚本可执行
        chmod +x .github/workflows/architectural-governance-check.sh
        
        # 执行架构检查
        if .github/workflows/architectural-governance-check.sh; then
          echo "✅ 架构治理检查通过，流水线继续执行"
          exit 0
        else
          echo "❌ 架构治理检查失败，流水线被阻止"
          echo ""
          echo "紧急制动教训表明：缺乏自动化流程约束导致架构问题积累"
          echo "请修复以下架构问题："
          echo "1. 目录结构混乱 - 检查重复模块和目录结构"
          echo "2. 模块边界不清 - 检查跨模块依赖关系"
          echo "3. 依赖版本不一致 - 检查pom.xml依赖版本"
          echo "4. 架构规范违反 - 检查API路径和包命名规范"
          echo ""
          echo "详细报告请查看架构检查报告"
          exit 1
        fi
        
    - name: 上传架构检查报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: architecture-governance-report
        path: architecture-governance-report.md

  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    needs: [architecture-governance-check]
    if: github.event_name != 'workflow_dispatch'
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 设置Java环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 缓存Maven依赖
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: 代码静态分析
      run: |
        cd backend
        mvn checkstyle:check
        mvn spotbugs:check
        
    - name: 单元测试
      run: |
        cd backend
        mvn test -B
        
    - name: 测试覆盖率检查
      run: |
        cd backend
        mvn jacoco:check

  build-and-push:
    name: 构建和推送镜像
    runs-on: ubuntu-latest
    needs: [architecture-governance-check, code-quality]
    
    outputs:
      image-tag: ${{ steps.tag-image.outputs.tag }}
      
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 设置Java环境
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: 登录容器镜像仓库
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        
    - name: 生成镜像标签
      id: tag-image
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.version }}" != "" ]]; then
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "main" ]]; then
          echo "tag=latest" >> $GITHUB_OUTPUT
        elif [[ "${{ github.ref_name }}" == "develop" ]]; then
          echo "tag=develop-${{ github.sha }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_OUTPUT
        fi
        
    - name: 构建和推送镜像
      run: |
        cd backend
        # 获取所有ERP模块
        modules=$(find . -name "pom.xml" -type f | grep -E "erp/.*/pom.xml" | xargs dirname)
        
        for module in $modules; do
          module_name=$(basename $module)
          echo "构建模块: $module_name"
          
          # 构建Docker镜像
          docker build \
            -f ../backend/deploy/kubernetes/Dockerfile.template \
            --build-arg MODULE_PATH=$module \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/$module_name:${{ steps.tag-image.outputs.tag }} \
            .
            
          # 推送镜像
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/$module_name:${{ steps.tag-image.outputs.tag }}
        done
        
    - name: 生成SBOM
      run: |
        # 使用Trivy生成软件物料清单
        for image in ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/*:${{ steps.tag-image.outputs.tag }}; do
          trivy image --format spdx-json --output sbom-${{ steps.tag-image.outputs.tag }}.json $image
        done
        
    - name: 上传SBOM到安全仓库
      uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ steps.tag-image.outputs.tag }}
        path: sbom-*.json

  security-scan:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: [build-and-push]
    
    steps:
    - name: 检查镜像安全
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/erp-customer:${{ needs.build-and-push.outputs.image-tag }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: 上传安全扫描结果
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: 依赖安全检查
      run: |
        cd backend
        mvn org.owasp:dependency-check-maven:check

  # 部署前架构治理门禁 - 确保部署的代码符合架构规范
  architecture-deployment-gate:
    name: 部署前架构治理门禁
    runs-on: ubuntu-latest
    needs: [architecture-governance-check, security-scan]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/release/*' || github.ref == 'refs/heads/main'
    
    steps:
    - name: 检查架构治理状态
      run: |
        echo "检查部署前架构治理状态..."
        echo "基于紧急制动教训：确保部署的代码符合架构规范"
        echo ""
        echo "检查通过标准："
        echo "1. ✅ 架构治理检查通过"
        echo "2. ✅ 安全扫描通过"
        echo "3. ✅ 代码质量检查通过"
        echo ""
        echo "部署前架构治理门禁检查完成，允许部署"

  deploy-to-dev:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    needs: [architecture-deployment-gate]
    if: github.ref == 'refs/heads/develop'
    environment: dev
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 设置Kubectl上下文
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: 配置Kubernetes访问
      run: |
        echo "${{ secrets.K8S_DEV_CONFIG }}" | base64 -d > kubeconfig-dev.yaml
        
    - name: 部署到开发环境
      run: |
        export KUBECONFIG=kubeconfig-dev.yaml
        helm upgrade --install erp-dev ${{ env.HELM_CHART_DIR }} \
          --namespace ${{ env.K8S_NAMESPACE }} \
          --set image.tag=${{ needs.build-and-push.outputs.image-tag }} \
          --values ${{ env.HELM_CHART_DIR }}/values-dev.yaml \
          --wait
        
    - name: 运行健康检查
      run: |
        export KUBECONFIG=kubeconfig-dev.yaml
        kubectl rollout status deployment/erp-customer-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=300s
        
    - name: 运行集成测试
      run: |
        # 执行集成测试脚本
        ./backend/scripts/run-integration-tests.sh --env dev

  deploy-to-test:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: [deploy-to-dev, architecture-deployment-gate]
    if: github.ref == 'refs/heads/release/*'
    environment: test
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 设置Kubectl上下文
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: 配置Kubernetes访问
      run: |
        echo "${{ secrets.K8S_TEST_CONFIG }}" | base64 -d > kubeconfig-test.yaml
        
    - name: 部署到测试环境
      run: |
        export KUBECONFIG=kubeconfig-test.yaml
        helm upgrade --install erp-test ${{ env.HELM_CHART_DIR }} \
          --namespace ${{ env.K8S_NAMESPACE }} \
          --set image.tag=${{ needs.build-and-push.outputs.image-tag }} \
          --values ${{ env.HELM_CHART_DIR }}/values-test.yaml \
          --wait
        
    - name: 运行性能测试
      run: |
        # 执行性能测试脚本
        ./backend/scripts/run-performance-tests.sh --env test
        
    - name: 生成测试报告
      uses: dorny/test-reporter@v1
      with:
        name: ERP Test Report
        path: test-results/*.xml
        reporter: java-junit

  deploy-to-staging:
    name: 部署到预发环境
    runs-on: ubuntu-latest
    needs: [deploy-to-test, architecture-deployment-gate]
    if: github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 设置Kubectl上下文
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: 配置Kubernetes访问
      run: |
        echo "${{ secrets.K8S_STAGING_CONFIG }}" | base64 -d > kubeconfig-staging.yaml
        
    - name: 部署到预发环境
      run: |
        export KUBECONFIG=kubeconfig-staging.yaml
        helm upgrade --install erp-staging ${{ env.HELM_CHART_DIR }} \
          --namespace ${{ env.K8S_NAMESPACE }} \
          --set image.tag=${{ needs.build-and-push.outputs.image-tag }} \
          --values ${{ env.HELM_CHART_DIR }}/values-staging.yaml \
          --wait
        
    - name: 运行E2E测试
      run: |
        # 执行端到端测试脚本
        ./backend/scripts/run-e2e-tests.sh --env staging
        
    - name: 性能基准测试
      run: |
        # 执行性能基准测试
        ./backend/scripts/run-benchmark-tests.sh --env staging

  deploy-to-prod:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: [deploy-to-staging, architecture-deployment-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: prod
    
    steps:
    - name: 等待人工审批
      uses: trstringer/manual-approval@v1
      with:
        secret: ${{ github.token }}
        approvers: ${{ secrets.PROD_DEPLOY_APPROVERS }}
        minimum-approvals: 2
        
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 设置Kubectl上下文
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: 配置Kubernetes访问
      run: |
        echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > kubeconfig-prod.yaml
        
    - name: 蓝绿部署到生产环境
      run: |
        export KUBECONFIG=kubeconfig-prod.yaml
        
        # 创建新版本部署
        helm upgrade --install erp-prod-v2 ${{ env.HELM_CHART_DIR }} \
          --namespace ${{ env.K8S_NAMESPACE }} \
          --set image.tag=${{ needs.build-and-push.outputs.image-tag }} \
          --values ${{ env.HELM_CHART_DIR }}/values-prod.yaml \
          --set deployment.strategy=blue-green \
          --wait
        
        # 流量切换
        kubectl patch ingress erp-ingress -n ${{ env.K8S_NAMESPACE }} \
          --type=json \
          -p='[{"op": "replace", "path": "/spec/rules/0/http/paths/0/backend/service/name", "value": "erp-prod-v2-service"}]'
        
        # 监控新版本健康状态
        sleep 300
        kubectl rollout status deployment/erp-prod-v2-deployment -n ${{ env.K8S_NAMESPACE }} --timeout=600s
        
        # 清理旧版本
        helm uninstall erp-prod-v1 -n ${{ env.K8S_NAMESPACE }}
        
    - name: 发送部署通知
      run: |
        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "text": "ERP系统生产部署完成",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*✅ ERP系统生产部署完成*"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*版本:*\n${{ needs.build-and-push.outputs.image-tag }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*环境:*\n生产环境"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*部署时间:*\n$(date)"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*提交:*\n${{ github.sha }}"
                  }
                ]
              }
            ]
          }'

  rollback:
    name: 回滚部署
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy-to-prod]
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 设置Kubectl上下文
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: 配置Kubernetes访问
      run: |
        echo "${{ secrets.K8S_PROD_CONFIG }}" | base64 -d > kubeconfig-prod.yaml
        
    - name: 执行回滚
      run: |
        export KUBECONFIG=kubeconfig-prod.yaml
        
        # 恢复流量到旧版本
        kubectl patch ingress erp-ingress -n ${{ env.K8S_NAMESPACE }} \
          --type=json \
          -p='[{"op": "replace", "path": "/spec/rules/0/http/paths/0/backend/service/name", "value": "erp-prod-v1-service"}]'
        
        # 删除新版本部署
        helm uninstall erp-prod-v2 -n ${{ env.K8S_NAMESPACE }}
        
    - name: 发送回滚通知
      run: |
        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "text": "⚠️ ERP系统生产部署回滚",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*⚠️ ERP系统生产部署回滚*"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*原因:*\n部署过程中出现错误"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*回滚时间:*\n$(date)"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*当前版本:*\n$(helm history erp-prod-v1 -n ${{ env.K8S_NAMESPACE }} --output json | jq -r ".Releases[0].Chart")"
                  }
                ]
              }
            ]
          }'