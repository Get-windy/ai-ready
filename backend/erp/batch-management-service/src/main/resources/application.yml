# Spring Boot Application Configuration
spring:
  application:
    name: batch-management-service
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/erp_batch?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 10000
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
      config:
        server-addr: localhost:8848
        file-extension: yml
        namespace: public
        group: DEFAULT_GROUP

# Server Configuration
server:
  port: 8082
  servlet:
    context-path: /batch
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    accept-count: 100
    max-connections: 10000

# Logging Configuration
logging:
  level:
    cn.aiedge.erp.batch: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
  file:
    name: logs/batch-management-service.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true
  packages-to-scan: cn.aiedge.erp.batch.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Batch Service Configuration
batch:
  service:
    # 批次号生成规则
    batch-no:
      prefix: BATCH
      format: "yyyyMMddHHmmss"
      length: 20
    # 批次状态流转配置
    state-transition:
      enabled: true
      allowed-transitions:
        CREATED: [ACTIVE, CANCELLED]
        ACTIVE: [INACTIVE, LOCKED, COMPLETED]
        INACTIVE: [ACTIVE, ARCHIVED]
        LOCKED: [ACTIVE, RELEASED]
        COMPLETED: [ARCHIVED]
    # 批次预警配置
    warning:
      expiration-days: 30
      low-quantity-threshold: 10
      enable-email-notification: true
      enable-sms-notification: false
    # 批次追溯配置
    trace:
      enabled: true
      retention-days: 365
      max-depth: 10
    # 批次流转配置
    flow:
      enabled: true
      supported-flows:
        - INBOUND
        - OUTBOUND
        - QUALITY_CHECK
        - TRANSFER
        - SPLIT
        - MERGE
        - ADJUSTMENT

# Security Configuration (if using Spring Security)
security:
  basic:
    enabled: false
  oauth2:
    resource:
      id: batch-service
      user-info-uri: http://auth-service:8080/auth/userinfo

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: batch-management-service
  tracing:
    sampling:
      probability: 1.0

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 30000
        logger-level: basic
  okhttp:
    enabled: true
  httpclient:
    enabled: false
  compression:
    request:
      enabled: true
    response:
      enabled: true

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      productService:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 60s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.net.SocketTimeoutException
  bulkhead:
    instances:
      productService:
        max-concurrent-calls: 10
        max-wait-duration: 10ms

# Cache Configuration
cache:
  type: redis
  redis:
    time-to-live: 300s
    cache-null-values: false
    key-prefix: batch:cache:
    use-key-prefix: true