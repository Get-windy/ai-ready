  kubernetes-cluster.json: |
    {
      "dashboard": {
        "id": null,
        "uid": "kubernetes-cluster",
        "title": "Kubernetes Cluster",
        "tags": ["kubernetes", "cluster", "monitoring"],
        "style": "dark",
        "timezone": "browser",
        "editable": true,
        "hideControls": false,
        "sharedCrosshair": false,
        "panels": [],
        "time": {
          "from": "now