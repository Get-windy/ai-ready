# AI-Ready Blue-Green Active Service
# 对外暴露的生产服务 - 通过修改selector切换流量
apiVersion: v1
kind: Service
metadata:
  name: ai-ready-api-active
  namespace: ai-ready
  labels:
    app: ai-ready-api
    type: active
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  # 默认指向blue版本，切换时修改为green
  selector:
    app: ai-ready-api
    version: blue  # 切换时改为 green
---
# Preview Service - 用于测试新版本
apiVersion: v1
kind: Service
metadata:
  name: ai-ready-api-preview
  namespace: ai-ready
  labels:
    app: ai-ready-api
    type: preview
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  # 指向非活跃版本
  selector:
    app: ai-ready-api
    version: green  # 如果active是blue，preview就是green
