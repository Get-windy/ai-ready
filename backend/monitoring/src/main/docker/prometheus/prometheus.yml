# AI-Ready 监控告警模块 - Prometheus 主配置文件
# 版本: v1.0
# 最后更新: 2026-04-27

global:
  # 全局抓取间隔
  scrape_interval: 15s
  # 全局评估间隔
  evaluation_interval: 15s
  # 外部标签
  external_labels:
    cluster: 'ai-ready'
    environment: '${ENVIRONMENT:-development}'
    region: 'cn-east-1'

# 告警规则文件
rule_files:
  - '/prometheus/rules/alert-rules.yml'
  - '/prometheus/rules/recording-rules.yml'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      # 告警管理器超时设置
      timeout: 10s
      # API版本
      api_version: v2

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    metrics_path: '/metrics'
    # 重命名标签
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'prometheus-server'

  # 节点导出器监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
    metrics_path: '/metrics'
    # 添加节点标签
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: '${HOSTNAME}'
      - source_labels: [job]
        target_label: job
        replacement: 'node-exporter'

  # Spring Boot应用监控
  - job_name: 'spring-boot-applications'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    # Kubernetes服务发现
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
            - default
    # 基于注解的过滤
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_service_name]
        action: replace
        target_label: kubernetes_service_name
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

  # AI模块监控
  - job_name: 'ai-module'
    static_configs:
      - targets:
          - 'ai-module:8080'
          - 'ai-model-service:8081'
    scrape_interval: 10s
    metrics_path: '/metrics'
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        regex: '([^:]+):\d+'
        replacement: '$1'
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-module-${1}'

  # 数据库监控
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s
    metrics_path: '/metrics'
    params:
      collect[]:
        - 'database'
        - 'table'
        - 'index'
        - 'replication'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-primary'

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
    metrics_path: '/metrics'
    params:
      check-keys: ['*']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis-cache'

  # 消息队列监控
  - job_name: 'rocketmq-exporter'
    static_configs:
      - targets: ['rocketmq-exporter:5557']
    scrape_interval: 30s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'rocketmq-broker'

  # 容器监控 (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s
    metrics_path: '/metrics'
    scheme: 'http'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'cadvisor-node'

  # 黑盒监控
  - job_name: 'blackbox-exporter'
    metrics_path: '/probe'
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'https://ai-ready.local'
          - 'https://monitoring.ai-ready.local'
          - 'https://api.ai-ready.local'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  # 自定义应用监控
  - job_name: 'custom-metrics'
    static_configs:
      - targets:
          - 'custom-exporter:9095'
    scrape_interval: 15s
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: exporter
        replacement: 'custom'

# 远程写入配置 (可选)
remote_write:
  - url: "https://prometheus-remote-write.example.com/api/v1/write"
    basic_auth:
      username: "${REMOTE_WRITE_USER}"
      password: "${REMOTE_WRITE_PASSWORD}"
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'up|process_.*|go_.*'
        action: drop
    queue_config:
      max_samples_per_send: 1000
      capacity: 10000
      max_shards: 200
      min_shards: 1
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms

# 远程读取配置 (可选)
remote_read:
  - url: "https://prometheus-remote-read.example.com/api/v1/read"
    basic_auth:
      username: "${REMOTE_READ_USER}"
      password: "${REMOTE_READ_PASSWORD}"
    read_recent: true

# 存储配置
storage:
  tsdb:
    # 数据保留时间
    retention: 30d
    # 数据保留大小
    retention.size: 15GB
    # 块的最大数量
    max_block_chunk_segment_size: 512MB
    # WAL压缩
    wal_compression: true
    # 头部块压缩
    head_chunks_write_buffer_size: 4194304

# 查询配置
query:
  # 查询超时时间
  timeout: 2m
  # 最大并发查询数
  max_concurrent: 20
  # 查询日志
  lookback_delta: 5m

# Web配置
web:
  # Web界面监听地址
  listen-address: ':9090'
  # 最大连接数
  max-connections: 512
  # 读取超时
  read-timeout: 5m
  # 写入超时
  write-timeout: 5m
  # 启用生命周期API
  enable-lifecycle: true
  # 启用管理员API
  enable-admin-api: true
  # 页面标题
  page-title: "AI-Ready Prometheus"
  # CORS配置
  cors-origin: ".*"

# 日志配置
log:
  level: info
  format: json
  # 日志文件
  file: "/var/log/prometheus/prometheus.log"

# 追踪配置 (OpenTelemetry)
tracing:
  enabled: false
  # Jaeger配置
  jaeger:
    url: "http://jaeger-collector:14268/api/traces"
    service_name: "prometheus"
    sampler_type: "const"
    sampler_param: 1

# 性能配置
scrape:
  # 抓取超时
  scrape_timeout: 10s
  # 最大样本数
  sample_limit: 5000000
  # 目标限制
  target_limit: 5000
  # 标签限制
  label_limit: 100
  # 标签名称长度限制
  label_name_length_limit: 512
  # 标签值长度限制
  label_value_length_limit: 2048

# 指标配置
metric_relabel_configs: []