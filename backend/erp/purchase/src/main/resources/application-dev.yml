# 开发环境配置
spring:
  datasource:
    # 默认PostgreSQL, 可选MySQL: jdbc:mysql://localhost:3306/erp_purchase_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    url: jdbc:postgresql://localhost:5432/erp_purchase_dev
    username: purchase_dev
    password: DevPassword123!
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  
  redis:
    host: localhost
    port: 6379
    password: 
    database: 2
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /erp_purchase_dev
  
  # 开发环境启用详细日志
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 开发环境日志配置
logging:
  level:
    cn.aiedge.erp.purchase: DEBUG
    org.springframework.web: DEBUG
    org.mybatis: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  
# 开发环境监控配置
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# 开发环境采购模块配置
erp:
  purchase:
    business:
      auto-approve-enabled: true
      approval-threshold: 5000.00
    integration:
      finance:
        base-url: http://localhost:8082/finance
        timeout: 3000
      stock:
        base-url: http://localhost:8083/stock
        timeout: 3000
      supplier:
        base-url: http://localhost:8084/supplier
        timeout: 2000
    security:
      allowed-origins: http://localhost:3000,http://localhost:8080,http://localhost:5173
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH