spring:
  application:
    name: erp-price-engine
  
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_price_db
    username: erp_user
    password: ${DB_PASSWORD:erp_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
    show-sql: false
  
  cache:
    type: redis
    redis:
      time-to-live: 60000
  
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: price-engine-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# 价格引擎配置
price-engine:
  config:
    default-priority: 100
    conflict-resolution: HIGHER_PRIORITY_WINS
    validation:
      enabled: true
      strict-mode: false
    cache:
      enabled: true
      ttl-seconds: 300
  
  optimization:
    algorithm: GENETIC
    max-iterations: 1000
    population-size: 100
    mutation-rate: 0.1
    crossover-rate: 0.8
  
  execution:
    max-retries: 3
    retry-delay-ms: 1000
    timeout-seconds: 30
    batch-size: 100
  
  monitoring:
    enabled: true
    metrics-interval-seconds: 60
    alert-threshold-percent: 80

# 日志配置
logging:
  level:
    cn.aiedge.erp.price.engine: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/erp-price-engine.log
    max-size: 10MB
    max-history: 30

# 服务器配置
server:
  port: 8082
  servlet:
    context-path: /api/price-engine
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/json,application/xml
    min-response-size: 2048