<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智企连 — 离线</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #f5f7fa; color: #333;
    }
    .container { text-align: center; padding: 40px 24px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 20px; margin-bottom: 8px; color: #1a1a1a; }
    p { font-size: 14px; color: #999; margin-bottom: 24px; }
    button {
      background: #1988fa; color: #fff; border: none;
      padding: 10px 32px; border-radius: 24px; font-size: 16px;
      cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { opacity: 0.8; }
    .auto-retry { font-size: 12px; color: #ccc; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>您当前处于离线状态</h1>
    <p>请检查网络连接后重试</p>
    <button onclick="location.reload()">尝试重新连接</button>
    <p class="auto-retry" id="retry-status"></p>
  </div>
  <script>
    // 自动重试逻辑
    let attempts = 0;
    const maxAttempts = 5;
    const interval = setInterval(async () => {
      attempts++;
      document.getElementById('retry-status').textContent =
        `自动重试中 (${attempts}/${maxAttempts})...`;
      try {
        const res = await fetch('/api/health');
        if (res.ok) location.reload();
      } catch {}
      if (attempts >= maxAttempts) {
        clearInterval(interval);
        document.getElementById('retry-status').textContent = '请手动点击上方按钮';
      }
    }, 5000);
  </script>
</body>
</html>
