# 🚀 ERP批次管理模块 - Helm Values文件
# 版本: 1.0.0
# 创建时间: 2026-05-05
# 紧急优化: 解决内存泄漏、连接池、负载均衡问题

# 应用基本信息
appName: erp-batch-sn
namespace: erp-prod
version: v1.0.0-optimized

# 副本配置
replicaCount: 2

# 🎯 镜像配置
image:
  repository: registry.ai-ready.cn/erp/erp-batch-sn
  tag: latest
  pullPolicy: Always
  pullSecret: ai-ready-registry-secret

# 🎯 Spring配置
spring:
  profile: prod-optimized

# 🎯 Java JVM优化配置（解决内存泄漏）
java:
  opts: >
    -Xms512m
    -Xmx1024m
    -XX:MetaspaceSize=128m
    -XX:MaxMetaspaceSize=256m
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+ParallelRefProcEnabled
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/app/logs/heapdump.hprof
    -XX:ErrorFile=/app/logs/hs_err_pid%p.log
    -XX:+PrintGCDetails
    -XX:+PrintGCDateStamps
    -Xloggc:/app/logs/gc.log
    -XX:+UseGCLogFileRotation
    -XX:NumberOfGCLogFiles=5
    -XX:GCLogFileSize=10M
    -Djava.security.egd=file:/dev/./urandom
    -Dfile.encoding=UTF-8
    -Duser.timezone=Asia/Shanghai

# 🎯 资源限制（优化内存使用）
resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1536Mi"   # 1.5GB，防止内存泄漏导致节点问题
    cpu: "1000m"      # 1个CPU核心

# 🎯 环境变量配置
env:
  # 数据库配置
  DB_HOST: postgres-primary.erp.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: ai_ready
  DB_SCHEMA: erp_batch_sn
  DB_USERNAME: erp_app_user
  # 密码通过secret注入
  
  # Redis配置
  REDIS_HOST: redis-master.erp.svc.cluster.local
  REDIS_PORT: "6379"
  
  # 应用配置
  SERVER_PORT: "8080"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_ERP_BATCHSN: "DEBUG"
  
  # 性能优化配置
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "10000"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "10"
  SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE: "50"
  
  # 内存泄漏监控
  JAVA_TOOL_OPTIONS: "-XX:NativeMemoryTracking=summary -XX:+PrintNMTStatistics"

# 🎯 服务配置（负载均衡优化）
service:
  type: ClusterIP
  port: 8080
  sessionAffinity: ClientIP  # 基于客户端IP的会话保持
  annotations:
    # 负载均衡配置
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    # 连接保持时间
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "60"
    
    # 监控配置
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/scheme: "http"

# 🎯 Ingress配置（如果需要外部访问）
ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/load-balance: "round_robin"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: batchsn.ai-ready.cn
      paths:
        - path: /
          pathType: Prefix

# 🎯 Horizontal Pod Autoscaling配置
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60

# 🎯 Pod Disruption Budget配置
pdb:
  enabled: true
  minAvailable: 1

# 🎯 网络策略
networkPolicy:
  enabled: true
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: erp-api-gateway
      ports:
        - protocol: TCP
          port: 8080

# 🎯 亲和性配置
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - erp-batch-sn
        topologyKey: kubernetes.io/hostname

# 🎯 节点选择器
nodeSelector:
  node-type: erp-compute

# 🎯 容忍度配置
tolerations:
  - key: "erp-critical"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# 🎯 卷配置
volumes:
  - name: logs-volume
    emptyDir: {}
  - name: config-volume
    configMap:
      name: erp-batch-sn-config
      
volumeMounts:
  - name: logs-volume
    mountPath: /app/logs
  - name: config-volume
    mountPath: /app/config

# 🎯 ServiceAccount配置
serviceAccount:
  create: true
  annotations: {}
  name: erp-batch-sn-sa

# 🎯 Istio配置
istio:
  enabled: true
  sidecar:
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"

# 🎯 探针优化配置
probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45    # 减少到45秒
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20    # 减少到20秒
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 2        # 需要2次成功才标记为就绪
  startup:
    path: /actuator/health
    initialDelaySeconds: 20    # 减少到20秒
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 15       # 减少到15次
    successThreshold: 1