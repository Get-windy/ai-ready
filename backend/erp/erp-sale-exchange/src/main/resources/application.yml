server:
  port: 8099

spring:
  application:
    name: erp-sale-exchange
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ai_ready?useUnicode=true&characterEncoding=utf8
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.aiedge.erp.sale.saleexchange.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      field-strategy: not_null

knife4j:
  enable: true
  openapi:
    title: 销售换货管理API
    description: 销售换货管理模块接口文档
    version: 1.0.0
    group:
      default:
        group-name: 销售换货管理
        api-rule: package
        api-rule-resources:
          - cn.aiedge.erp.sale.saleexchange.controller

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-write-header: true
  is-write-cookie: false
  is-write-body: false
