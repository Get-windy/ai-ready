# 测试环境配置 - 数据库连接池基本功能测试
spring:
  datasource:
    # 主数据源 - H2内存数据库（用于基本功能测试）
    primary:
      hikari:
        pool-name: Primary-Test-Pool
        jdbc-url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: 
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        connection-test-query: SELECT 1

    # 低并发测试数据源
    low-concurrency:
      hikari:
        pool-name: Low-Concurrency-Pool
        jdbc-url: jdbc:h2:mem:testdb_low;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: 
        maximum-pool-size: 10
        minimum-idle: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        connection-test-query: SELECT 1

    # 中并发测试数据源
    medium-concurrency:
      hikari:
        pool-name: Medium-Concurrency-Pool
        jdbc-url: jdbc:h2:mem:testdb_medium;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: 
        maximum-pool-size: 50
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        connection-test-query: SELECT 1

    # 高并发测试数据源
    high-concurrency:
      hikari:
        pool-name: High-Concurrency-Pool
        jdbc-url: jdbc:h2:mem:testdb_high;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: 
        maximum-pool-size: 100
        minimum-idle: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        connection-test-query: SELECT 1

    # H2专用测试数据源
    h2:
      hikari:
        pool-name: H2-Test-Pool
        jdbc-url: jdbc:h2:mem:testdb_h2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password: 
        maximum-pool-size: 30
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        connection-test-query: SELECT 1

# 日志配置
logging:
  level:
    cn.aiedge.test.connectionpool: DEBUG
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
