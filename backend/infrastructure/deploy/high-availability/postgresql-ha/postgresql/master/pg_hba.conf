# PostgreSQL 主节点客户端认证配置
# AI-Ready 测试环境高可用配置

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 本地连接
local   all             all                                     trust

# IPv4 本地主机连接
host    all             all             127.0.0.1/32            trust

# 复制用户连接（用于主从复制）
host    replication     replicator       172.31.1.0/24           md5
host    replication     replicator       172.30.0.0/16           md5

# 应用用户连接
host    all             ai_ready_user    172.31.1.0/24           md5
host    all             ai_ready_user    172.30.0.0/16           md5

# 监控用户连接
host    all             postgres_exporter 172.31.1.0/24          md5
host    all             postgres_exporter 172.30.0.0/16          md5

# 备份用户连接
host    all             ai_ready_backup   172.31.1.0/24          md5
host    all             ai_ready_backup   172.30.0.0/16          md5

# 管理用户连接
host    all             postgres          172.31.1.0/24          md5
host    all             postgres          172.30.0.0/16          md5

# 拒绝其他所有连接
host    all             all             0.0.0.0/0               reject