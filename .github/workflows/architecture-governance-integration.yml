# 架构治理集成CI/CD工作流
# 基于紧急制动教训，集成架构治理检查到现有CI/CD流水线
# 防止架构问题积累导致的架构混乱

name: Architecture Governance Integration

on:
  # 触发条件与现有ERP CI/CD流水线相同
  push:
    branches:
      - main
      - develop
      - release/*
    paths:
      - 'backend/**'
      - '.github/workflows/architecture-governance-integration.yml'
      - '.github/workflows/architectural-governance-check.sh'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'

jobs:
  # 架构治理检查 - 独立的检查任务，可作为门禁
  architecture-governance-check:
    name: 架构治理检查
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check-architecture.outputs.status }}
      report-path: ${{ steps.upload-report.outputs.report-path }}
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 执行架构治理检查
      id: check-architecture
      run: |
        # 确保脚本可执行
        chmod +x .github/workflows/architectural-governance-check.sh
        
        # 执行架构检查
        echo "开始执行架构治理检查..."
        if .github/workflows/architectural-governance-check.sh; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 架构治理检查通过"
        else
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "❌ 架构治理检查失败"
        fi
      
    - name: 上传架构检查报告
      id: upload-report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: architecture-governance-report-${{ github.sha }}
        path: architecture-governance-report.md
      continue-on-error: true
      
    - name: 失败通知
      if: failure()
      run: |
        echo "❌ 架构治理检查失败，请查看架构检查报告修复问题"
        echo "发现的架构问题可能包括："
        echo "- 目录结构混乱"
        echo "- 模块边界不清晰"
        echo "- 依赖关系问题"
        echo "- 架构规范违反"

  # 架构治理门禁 - 基于检查结果决定是否继续流水线
  architecture-gate:
    name: 架构治理门禁
    runs-on: ubuntu-latest
    needs: architecture-governance-check
    if: always()
    
    steps:
    - name: 下载架构检查报告
      uses: actions/download-artifact@v4
      with:
        name: architecture-governance-report-${{ github.sha }}
        
    - name: 检查架构治理结果
      run: |
        echo "检查架构治理结果..."
        
        if [[ "${{ needs.architecture-governance-check.outputs.status }}" == "success" ]]; then
          echo "✅ 架构治理检查通过，允许继续流水线"
          exit 0
        else
          echo "❌ 架构治理检查失败，流水线被阻止"
          echo ""
          echo "=== 架构治理门禁阻止 ==="
          echo ""
          echo "原因：架构检查未通过"
          echo ""
          echo "请修复以下架构问题后再试："
          echo "1. 检查并修复目录结构问题"
          echo "2. 明确模块边界，减少不必要的跨模块依赖"
          echo "3. 统一依赖版本，避免版本冲突"
          echo "4. 遵循架构规范，确保代码一致性"
          echo ""
          echo "详细报告请查看架构检查报告"
          exit 1
        fi

  # 架构治理报告生成 - 为团队提供可视化的架构健康报告
  architecture-report-generation:
    name: 架构治理报告生成
    runs-on: ubuntu-latest
    needs: architecture-governance-check
    if: always()
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
      
    - name: 下载架构检查报告
      uses: actions/download-artifact@v4
      with:
        name: architecture-governance-report-${{ github.sha }}
        
    - name: 生成架构健康评分
      run: |
        echo "生成架构健康评分..."
        
        # 读取架构检查报告
        if [[ -f "architecture-governance-report.md" ]]; then
          # 分析报告内容
          total_checks=4
          passed_checks=$(grep -c "✅" architecture-governance-report.md || echo 0)
          failed_checks=$(grep -c "❌" architecture-governance-report.md || echo 0)
          warning_checks=$(grep -c "⚠️" architecture-governance-report.md || echo 0)
          
          # 计算健康评分
          if (( total_checks > 0 )); then
            health_score=$(( (passed_checks * 100) / total_checks ))
          else
            health_score=0
          fi
          
          # 生成健康报告
          cat > architecture-health-report.md << EOF
# 架构健康报告

## 报告信息
- **项目**: AI-Ready ERP系统
- **检查时间**: $(date)
- **Git提交**: $(git rev-parse --short HEAD 2>/dev/null || echo "N/A")
- **分支**: $(git branch --show-current 2>/dev/null || echo "N/A")

## 健康评分
**$health_score/100**

$(
if (( health_score >= 80 )); then
  echo "✅ 架构健康状况良好"
elif (( health_score >= 60 )); then
  echo "⚠️ 架构健康状况一般，需要改进"
else
  echo "❌ 架构健康状况不佳，需要立即修复"
fi
)

## 检查结果统计
- **总检查项目**: $total_checks
- **通过项目**: $passed_checks
- **失败项目**: $failed_checks
- **警告项目**: $warning_checks

## 趋势分析
$(
if (( health_score >= 80 )); then
  echo "📈 架构健康趋势：稳定向好"
elif (( health_score >= 60 )); then
  echo "📊 架构健康趋势：需要关注"
else
  echo "📉 架构健康趋势：需要立即干预"
fi
)

## 改进建议
1. 定期执行架构治理检查
2. 建立架构评审机制
3. 加强架构规范培训
4. 实施架构债务管理

---

*本报告基于架构治理检查生成，建议定期审查和改进*
EOF
          
          echo "架构健康评分: $health_score/100"
          echo "✅ 架构健康报告生成完成"
        else
          echo "⚠️ 未找到架构检查报告"
          exit 0
        fi
        
    - name: 上传架构健康报告
      uses: actions/upload-artifact@v4
      with:
        name: architecture-health-report-${{ github.sha }}
        path: architecture-health-report.md
        
    - name: 发布架构健康状态
      run: |
        echo "发布架构健康状态..."
        # 这里可以集成到团队通知工具，如Slack、企业微信等
        echo "架构治理检查完成，详情请查看架构健康报告"

