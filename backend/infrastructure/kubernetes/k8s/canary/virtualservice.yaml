# AI-Ready Canary Traffic Routing
# Istio VirtualService for Canary Deployment
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ai-ready-api
  namespace: ai-ready
spec:
  hosts:
    - ai-ready-api.ai-ready.svc.cluster.local
    - api.ai-ready.com
  gateways:
    - ai-ready-gateway
  http:
    # 匹配规则 - 内部测试用户走金丝雀
    - match:
        - headers:
            x-canary:
              exact: "true"
        - headers:
            x-user-group:
              exact: "beta"
        - queryParams:
            canary:
              exact: "true"
      route:
        - destination:
            host: ai-ready-api-canary
            port:
              number: 8080
          weight: 100

    # 匹配规则 - VIP用户灰度
    - match:
        - headers:
            x-user-tier:
              exact: "vip"
      route:
        - destination:
            host: ai-ready-api-stable
            port:
              number: 8080
          weight: 90
        - destination:
            host: ai-ready-api-canary
            port:
              number: 8080
          weight: 10

    # 默认流量分配 - 渐进式灰度
    - route:
        - destination:
            host: ai-ready-api-stable
            port:
              number: 8080
          weight: 95  # 95% 稳定版本
        - destination:
            host: ai-ready-api-canary
            port:
              number: 8080
          weight: 5   # 5% 金丝雀版本
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
      timeout: 10s
      fault:
        delay:
          percentage:
            value: 0.1
          fixedDelay: 5s
---
# DestinationRule for traffic policies
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ai-ready-api
  namespace: ai-ready
spec:
  host: ai-ready-api-stable
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
    loadBalancer:
      simple: LEAST_CONN
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  subsets:
    - name: stable
      labels:
        version: stable
    - name: canary
      labels:
        version: canary
