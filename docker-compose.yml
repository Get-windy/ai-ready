version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: ai-ready-postgres
    environment:
      POSTGRES_DB: ai-ready
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ready-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai-ready
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SYNC_ENGINE_URL: http://sync-engine:9800
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Python同步引擎
  sync-engine:
    build:
      context: ./backend/sync-engine
      dockerfile: Dockerfile
    container_name: ai-ready-sync-engine
    ports:
      - "9800:9800"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ai-ready
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9800/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
