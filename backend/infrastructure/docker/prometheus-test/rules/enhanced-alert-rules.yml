# AI-Ready 测试环境增强告警规则
# Version: v1.1.0
# 创建日期: 2026-04-28
# 用途: 补充系统资源、容器、网络等监控告警规则

groups:
  # ========== 系统资源告警 ==========
  - name: system_resource_alerts
    interval: 30s
    rules:
      # CPU使用率过高
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "CPU使用率过高"
          description: "CPU使用率超过80%，当前值: {{ $value }}%，实例: {{ $labels.instance }}"
          runbook_url: "https://docs.ai-ready.com/runbook/cpu"

      # CPU使用率严重过高
      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "CPU使用率严重过高"
          description: "CPU使用率超过95%，当前值: {{ $value }}%，实例: {{ $labels.instance }}，需要立即处理"

      # 内存使用率过高
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "内存使用率过高"
          description: "内存使用率超过85%，当前值: {{ $value }}%，可用内存: {{ with $query `node_memory_MemAvailable_bytes` }}{{ . }}{{ end }}"

      # 内存使用率严重过高
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "内存使用率严重过高"
          description: "内存使用率超过95%，当前值: {{ $value }}%，可能发生OOM，需要立即处理"

      # 磁盘使用率过高
      - alert: HighDiskUsage
        expr: (1 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}))) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "磁盘使用率过高"
          description: "磁盘使用率超过85%，当前值: {{ $value }}%，挂载点: {{ $labels.mountpoint }}"

      # 磁盘使用率严重过高
      - alert: CriticalDiskUsage
        expr: (1 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}))) * 100 > 95
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "磁盘空间即将耗尽"
          description: "磁盘使用率超过95%，当前值: {{ $value }}%，挂载点: {{ $labels.mountpoint }}，需要立即清理"

      # 磁盘IO等待时间过长
      - alert: HighDiskIOWait
        expr: irate(node_cpu_seconds_total{mode="iowait"}[5m]) * 100 > 10
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "磁盘IO等待时间过长"
          description: "磁盘IO等待时间超过10%，当前值: {{ $value }}%，可能存在磁盘性能问题"

  # ========== 网络告警 ==========
  - name: network_alerts
    interval: 30s
    rules:
      # 网络丢包率高
      - alert: HighNetworkPacketDrop
        expr: (rate(node_network_receive_drop_total[5m]) + rate(node_network_transmit_drop_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "网络丢包率过高"
          description: "网络丢包率超过0.1%，接口: {{ $labels.interface }}，需要检查网络配置"

      # 网络错误率高
      - alert: HighNetworkErrors
        expr: (rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "网络错误率过高"
          description: "网络错误率超过0.05%，接口: {{ $labels.interface }}，需要检查网络设备"

      # TCP连接数过高
      - alert: HighTCPConnections
        expr: node_netstat_Tcp_CurrEstab > 5000
        for: 5m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "TCP连接数过高"
          description: "当前TCP连接数: {{ $value }}，可能存在连接泄漏或负载过高"

  # ========== 容器告警 ==========
  - name: container_alerts
    interval: 30s
    rules:
      # 容器CPU使用过高
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{container_label!="",container_label!="POD"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "容器CPU使用过高"
          description: "容器 {{ $labels.container_label }} CPU使用率: {{ $value }}%，需要检查应用性能"

      # 容器内存使用过高
      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{container_label!="",container_label!="POD"} / container_spec_memory_limit_bytes{container_label!="",container_label!="POD"} * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "容器内存使用过高"
          description: "容器 {{ $labels.container_label }} 内存使用率: {{ $value }}%，可能触发OOM"

      # 容器重启频繁
      - alert: ContainerRestartingFrequently
        expr: increase(container_restart_count{container_label!="",container_label!="POD"}[1h]) > 5
        for: 0m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "容器频繁重启"
          description: "容器 {{ $labels.container_label }} 在过去1小时内重启了 {{ $value }} 次，需要检查应用稳定性"

  # ========== 数据库详细告警 ==========
  - name: database_detailed_alerts
    interval: 30s
    rules:
      # PostgreSQL连接池耗尽
      - alert: PostgresConnectionPoolExhausted
        expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 90
        for: 5m
        labels:
          severity: critical
          category: database
          database: postgresql
        annotations:
          summary: "PostgreSQL连接池即将耗尽"
          description: "PostgreSQL连接池使用率超过90%，当前连接数: {{ $value }}，需要优化连接管理"

      # PostgreSQL复制延迟
      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 5m
        labels:
          severity: warning
          category: database
          database: postgresql
        annotations:
          summary: "PostgreSQL复制延迟过高"
          description: "PostgreSQL复制延迟超过30秒，当前延迟: {{ $value }}秒"

      # Redis内存使用过高
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: database
          database: redis
        annotations:
          summary: "Redis内存使用过高"
          description: "Redis {{ $labels.instance }} 内存使用率: {{ $value }}%，可能触发内存淘汰策略"

      # Redis连接数过高
      - alert: RedisHighConnections
        expr: redis_connected_clients > 500
        for: 5m
        labels:
          severity: warning
          category: database
          database: redis
        annotations:
          summary: "Redis连接数过高"
          description: "Redis {{ $labels.instance }} 当前连接数: {{ $value }}，需要检查连接管理"

      # Kafka消息堆积
      - alert: KafkaMessageLag
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
          category: messaging
          messaging: kafka
        annotations:
          summary: "Kafka消息堆积"
          description: "Kafka消费者组 {{ $labels.group }} 消息堆积: {{ $value }}条，需要检查消费者性能"

  # ========== 日志错误告警 ==========
  - name: log_error_alerts
    interval: 30s
    rules:
      # 高频错误日志
      - alert: HighFrequencyErrorLogs
        expr: sum(rate(log_messages_total{level="error"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: logs
        annotations:
          summary: "高频错误日志"
          description: "错误日志频率超过10/分钟，当前: {{ $value }}/分钟，需要查看日志详情"

      # 致命错误日志
      - alert: CriticalErrorLogs
        expr: sum(rate(log_messages_total{level="fatal"}[5m])) > 0
        for: 0m
        labels:
          severity: critical
          category: logs
        annotations:
          summary: "检测到致命错误日志"
          description: "检测到致命错误日志，当前频率: {{ $value }}/分钟，需要立即查看日志详情"

  # ========== 业务指标告警 ==========
  - name: business_metric_alerts
    interval: 30s
    rules:
      # API响应时间过长
      - alert: APIResponseTimeTooLong
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)) > 5
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "API响应时间过长"
          description: "服务 {{ $labels.job }} 的99分位响应时间超过5秒，当前: {{ $value }}秒，用户体验可能受影响"

      # 订单处理延迟
      - alert: OrderProcessingDelay
        expr: avg(order_processing_duration_seconds) > 10
        for: 5m
        labels:
          severity: warning
          category: business
        annotations:
          summary: "订单处理延迟"
          description: "订单平均处理时间超过10秒，当前: {{ $value }}秒"

      # 库存同步失败
      - alert: InventorySyncFailed
        expr: increase(inventory_sync_errors_total[5m]) > 5
        for: 0m
        labels:
          severity: critical
          category: business
        annotations:
          summary: "库存同步失败"
          description: "过去5分钟内库存同步失败 {{ $value }} 次，需要检查同步服务状态"