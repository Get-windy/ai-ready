    orgId: 1
    folder: '告警管理'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/alerts
      foldersFromFilesStructure: true

  # ==================== 默认仪表板 ====================
  - name: 'default-dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/default
      foldersFromFilesStructure: true