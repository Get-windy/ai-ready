# AI-Ready PostgreSQL高可用配置
# 主从复制 + 自动故障转移

version: '3.8'

networks:
  ai-ready-ha-network:
    external: true
    name: ai-ready-ha-network
  ai-ready-test-network:
    external: true
    name: ai-ready-test-network

volumes:
  postgres-master-data:
    driver: local
  postgres-replica1-data:
    driver: local
  postgres-replica2-data:
    driver: local
  postgres-backup:
    driver: local
  postgres-config:
    driver: local

services:
  # ============ PostgreSQL 主节点 ============
  postgres-master:
    image: postgres:15-alpine
    container_name: ai-ready-postgres-master
    restart: unless-stopped
    hostname: postgres-master
    ports:
      - "5432:5432"
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./postgresql/master/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/master/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
      - postgres-backup:/backup
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.1.10
      ai-ready-test-network:
    environment:
      POSTGRES_DB: ai_ready
      POSTGRES_USER: ai_ready_user
      POSTGRES_PASSWORD: ai_ready_password_2026
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password_2026
      POSTGRES_CONFIG_FILE: /etc/postgresql/postgresql.conf
      POSTGRES_HBA_FILE: /etc/postgresql/pg_hba.conf
    command: >
      postgres 
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c listen_addresses=*
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ready_user -d ai_ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "postgres-master"

  # ============ PostgreSQL 从节点1 ============
  postgres-replica1:
    image: postgres:15-alpine
    container_name: ai-ready-postgres-replica1
    restart: unless-stopped
    hostname: postgres-replica1
    ports:
      - "5433:5432"
    volumes:
      - postgres-replica1-data:/var/lib/postgresql/data
      - ./postgresql/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.1.11
      ai-ready-test-network:
    environment:
      POSTGRES_DB: ai_ready
      POSTGRES_USER: ai_ready_user
      POSTGRES_PASSWORD: ai_ready_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_MASTER_HOST: postgres-master
      POSTGRES_MASTER_PORT: 5432
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password_2026
    command: >
      sh -c '
      # 等待主节点启动
      until pg_isready -h postgres-master -p 5432 -U ai_ready_user; do
        echo "Waiting for master to start..."
        sleep 2
      done
      
      # 如果数据目录为空，则从主节点复制数据
      if [ ! -f "$PGDATA/PG_VERSION" ]; then
        echo "Initializing replica from master..."
        pg_basebackup -h postgres-master -p 5432 -U replicator -D $PGDATA -Fp -Xs -P -R
      fi
      
      # 启动PostgreSQL
      exec postgres 
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c listen_addresses=*
      -c hot_standby=on
      '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ready_user -d ai_ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1.5G
        reservations:
          cpus: '0.4'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "postgres-replica1"
    depends_on:
      postgres-master:
        condition: service_healthy

  # ============ PostgreSQL 从节点2 ============
  postgres-replica2:
    image: postgres:15-alpine
    container_name: ai-ready-postgres-replica2
    restart: unless-stopped
    hostname: postgres-replica2
    ports:
      - "5434:5432"
    volumes:
      - postgres-replica2-data:/var/lib/postgresql/data
      - ./postgresql/replica/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgresql/replica/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.1.12
      ai-ready-test-network:
    environment:
      POSTGRES_DB: ai_ready
      POSTGRES_USER: ai_ready_user
      POSTGRES_PASSWORD: ai_ready_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_MASTER_HOST: postgres-master
      POSTGRES_MASTER_PORT: 5432
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: replicator_password_2026
    command: >
      sh -c '
      # 等待主节点启动
      until pg_isready -h postgres-master -p 5432 -U ai_ready_user; do
        echo "Waiting for master to start..."
        sleep 2
      done
      
      # 如果数据目录为空，则从主节点复制数据
      if [ ! -f "$PGDATA/PG_VERSION" ]; then
        echo "Initializing replica from master..."
        pg_basebackup -h postgres-master -p 5432 -U replicator -D $PGDATA -Fp -Xs -P -R
      fi
      
      # 启动PostgreSQL
      exec postgres 
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c listen_addresses=*
      -c hot_standby=on
      '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_ready_user -d ai_ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 1.5G
        reservations:
          cpus: '0.4'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "postgres-replica2"
    depends_on:
      postgres-master:
        condition: service_healthy

  # ============ PgBouncer 连接池 ============
  pgbouncer:
    image: edoburu/pgbouncer:1.20-alpine
    container_name: ai-ready-pgbouncer
    restart: unless-stopped
    hostname: pgbouncer
    ports:
      - "6432:6432"
    volumes:
      - ./postgresql/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./postgresql/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.1.20
      ai-ready-test-network:
    environment:
      PGBOUNCER_AUTH_TYPE: md5
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
      PGBOUNCER_ADMIN_USERS: ai_ready_admin
      PGBOUNCER_STATS_USERS: ai_ready_stats
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 1000
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
      PGBOUNCER_RESERVE_POOL_SIZE: 5
    healthcheck:
      test: ["CMD", "pgbouncer", "-d", "-R", "/etc/pgbouncer/pgbouncer.ini"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "pgbouncer"
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-replica1:
        condition: service_healthy

  # ============ PostgreSQL 监控 ============
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ai-ready-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.1.30
      ai-ready-test-network:
    environment:
      DATA_SOURCE_NAME: "postgresql://ai_ready_user:ai_ready_password_2026@postgres-master:5432/ai_ready?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgresql/queries.yaml
    volumes:
      - ./postgresql/queries.yaml:/etc/postgresql/queries.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "postgres-exporter"
    depends_on:
      postgres-master:
        condition: service_healthy

  # ============ PostgreSQL 备份服务 ============
  postgres-backup:
    image: alpine:3.18
    container_name: ai-ready-postgres-backup
    restart: unless-stopped
    volumes:
      - postgres-backup:/backup
      - ./postgresql/backup/backup.sh:/backup.sh:ro
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.1.40
      ai-ready-test-network:
    environment:
      POSTGRES_HOST: postgres-master
      POSTGRES_PORT: 5432
      POSTGRES_USER: ai_ready_user
      POSTGRES_PASSWORD: ai_ready_password_2026
      POSTGRES_DATABASE: ai_ready
      BACKUP_RETENTION_DAYS: 7
      CRON_SCHEDULE: "0 2 * * *"  # 每天凌晨2点备份
    command: >
      sh -c '
      apk add --no-cache postgresql-client && \
      chmod +x /backup.sh && \
      echo "PostgreSQL backup service started" && \
      # 立即执行一次备份
      /backup.sh && \
      # 设置定时任务
      echo "$CRON_SCHEDULE /backup.sh" | crontab - && \
      # 启动cron服务
      crond -f -l 8
      '
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "postgres-backup"
    depends_on:
      postgres-master:
        condition: service_healthy