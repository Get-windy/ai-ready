spring:
  application:
    name: erp-purchase-exchange

  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_purchase_exchange
    username: erp_user
    password: ${DB_PASSWORD:erp_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # RabbitMQ配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5000
    template:
      exchange: purchase.exchange.exchange
      routing-key: purchase.exchange.routing.key
      default-receive-queue: purchase.exchange.queue

  # MyBatis配置
  mybatis-plus:
    mapper-locations: classpath*:/mapper/**/*.xml
    type-aliases-package: cn.aiedge.erp.purchase.purchaseexchange.entity
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # Activiti工作流配置
  activiti:
    database-schema-update: true
    db-history-used: true
    history-level: audit
    check-process-definitions: true
    process-definition-location-prefix: classpath:/processes/
    deployment-name: 采购换货工作流

# 服务端口
server:
  port: 8087
  servlet:
    context-path: /api/erp/purchase/exchange
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    swagger-model-name: 采购换货管理模块API文档
  basic:
    enable: false

# Spring Security配置
security:
  oauth2:
    resource-server:
      jwt:
        issuer-uri: http://localhost:8080/auth/realms/erp-system

# 应用配置
app:
  purchase-exchange:
    application-expiry-days: 30
    default-approval-process: purchase_exchange_approval
    max-exchange-quantity-ratio: 1.5
    exchange-code-prefix: EXC
    auto-evaluate-supplier: true
  upload:
    base-path: /opt/erp/uploads/purchase/exchange/
    allowed-extensions: .pdf,.jpg,.png,.jpeg,.gif,.doc,.docx,.xls,.xlsx
    max-size-mb: 10

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    cn.aiedge.erp.purchase.purchaseexchange: DEBUG
    org.springframework.security: INFO
    org.activiti: INFO
    com.baomidou.mybatisplus: INFO
  file:
    name: logs/purchase-exchange.log
    path: ./logs/
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# 缓存配置
cache:
  redis:
    exchange-order-expiration: 60
    supplier-stats-expiration: 24
    exchange-stats-expiration: 12
