# 缓存同步机制配置示例

app:
  cache:
    # 缓存同步配置
    sync:
      redis:
        sync-channel-prefix: "cache:sync:"
        sync-timeout: 5000  # 同步超时时间（毫秒）
        max-retries: 3      # 最大重试次数
        retry-delay: 100    # 重试延迟（毫秒）
      
      # 缓存保护配置
      protection:
        enable-penetration-protection: true  # 启用穿透保护
        enable-breakdown-protection: true    # 启用击穿保护
        enable-avalanche-protection: true    # 启用雪崩保护
        empty-value-ttl: 300                 # 空值缓存时间（秒）
        lock-timeout: 30                     # 分布式锁超时时间（秒）
      
      # 高级特性配置
      advanced:
        enable-write-through: true           # 启用Write Through
        enable-write-behind: true            # 启用Write Behind
        write-behind-thread-pool-size: 4     # Write Behind线程池大小
        write-behind-delay: 1000             # Write Behind延迟时间（毫秒）

    # 本地缓存配置
    local:
      default-cache:
        max-size: 10000
        expire-write-seconds: 600
        expire-access-seconds: 300
      
      user-cache:
        max-size: 5000
        expire-write-seconds: 7200
        expire-access-seconds: 3600
      
      stock-cache:
        max-size: 50000
        expire-write-seconds: 300
        expire-access-seconds: 120

# Redis连接配置
spring:
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 1000ms

# 示例：在业务服务中使用缓存同步机制
