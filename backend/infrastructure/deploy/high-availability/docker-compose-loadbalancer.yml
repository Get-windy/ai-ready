# AI-Ready 测试环境高可用负载均衡器配置
# 包含：Nginx负载均衡器 + SSL证书 + 健康检查

version: '3.8'

# ==================== 网络配置 ====================
networks:
  ai-ready-ha-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1
    name: ai-ready-ha-network

  # 连接到现有测试环境网络
  ai-ready-test-network:
    external: true
    name: ai-ready-test-network

# ==================== 数据卷配置 ====================
volumes:
  nginx-ssl-certs:
    driver: local
  nginx-config:
    driver: local
  nginx-logs:
    driver: local
  nginx-static:
    driver: local

# ==================== 服务配置 ====================
services:
  # ============ Nginx负载均衡器（主节点） ============
  nginx-loadbalancer-primary:
    image: nginx:1.24-alpine
    container_name: ai-ready-nginx-primary
    restart: unless-stopped
    hostname: nginx-primary
    ports:
      - "80:80"    # HTTP端口
      - "443:443"  # HTTPS端口
      - "8081:8081" # 内部API端口
    volumes:
      - ./nginx-loadbalancer.conf:/etc/nginx/nginx.conf:ro
      - ./ssl-certs:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
      - nginx-config:/etc/nginx/conf.d
      - nginx-static:/usr/share/nginx/html
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.0.10
      ai-ready-test-network:
    environment:
      NGINX_ENV: production
      TZ: Asia/Shanghai
      SSL_ENABLED: "true"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "nginx-primary"
    # 依赖的服务
    depends_on:
      - nginx-loadbalancer-backup
      - ssl-cert-generator

  # ============ Nginx负载均衡器（备用节点） ============
  nginx-loadbalancer-backup:
    image: nginx:1.24-alpine
    container_name: ai-ready-nginx-backup
    restart: unless-stopped
    hostname: nginx-backup
    ports:
      - "8080:80"   # HTTP备用端口
      - "8443:443"  # HTTPS备用端口
    volumes:
      - ./nginx-loadbalancer-backup.conf:/etc/nginx/nginx.conf:ro
      - ./ssl-certs:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx-logs:/var/log/nginx
      - nginx-config:/etc/nginx/conf.d
      - nginx-static:/usr/share/nginx/html
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.0.11
      ai-ready-test-network:
    environment:
      NGINX_ENV: backup
      TZ: Asia/Shanghai
      SSL_ENABLED: "true"
      NGINX_BACKUP: "true"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
        tag: "nginx-backup"
    # 等待主节点健康检查通过后再启动
    depends_on:
      nginx-loadbalancer-primary:
        condition: service_healthy

  # ============ SSL证书生成器 ============
  ssl-cert-generator:
    image: alpine:3.18
    container_name: ai-ready-ssl-generator
    restart: "no"
    volumes:
      - ./ssl-certs:/ssl-certs
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.0.20
    entrypoint: |
      sh -c '
      mkdir -p /ssl-certs && \
      cd /ssl-certs && \
      
      # 生成自签名CA证书
      openssl genrsa -out ca.key 4096 && \
      openssl req -new -x509 -days 3650 -key ca.key -out ca.crt \
        -subj "/C=CN/ST=Shanghai/L=Shanghai/O=AI-Ready/CN=AI-Ready CA" && \
      
      # 生成服务器证书私钥
      openssl genrsa -out ai-ready-test.key 2048 && \
      
      # 生成证书签名请求
      openssl req -new -key ai-ready-test.key -out ai-ready-test.csr \
        -subj "/C=CN/ST=Shanghai/L=Shanghai/O=AI-Ready/CN=ai-ready-test.local" && \
      
      # 生成服务器证书
      openssl x509 -req -days 365 -in ai-ready-test.csr -CA ca.crt -CAkey ca.key \
        -CAcreateserial -out ai-ready-test.crt && \
      
      # 生成客户端证书（用于双向TLS）
      openssl genrsa -out client.key 2048 && \
      openssl req -new -key client.key -out client.csr \
        -subj "/C=CN/ST=Shanghai/L=Shanghai/O=AI-Ready/CN=AI-Ready Client" && \
      openssl x509 -req -days 365 -in client.csr -CA ca.crt -CAkey ca.key \
        -CAcreateserial -out client.crt && \
      
      # 生成PKCS12格式的客户端证书
      openssl pkcs12 -export -clcerts -in client.crt -inkey client.key \
        -out client.p12 -password pass:ai-ready-2026 && \
      
      # 设置正确的权限
      chmod 644 *.crt *.key && \
      
      echo "SSL证书生成完成" && \
      ls -la /ssl-certs
      '
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ============ Keepalived（VIP管理） ============
  keepalived-primary:
    image: osixia/keepalived:2.2.5
    container_name: ai-ready-keepalived-primary
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.0.30
    volumes:
      - ./keepalived/keepalived-primary.conf:/container/service/keepalived/assets/keepalived.conf:ro
    environment:
      KEEPALIVED_VIRTUAL_IPS: "172.31.0.100/24"
      KEEPALIVED_PRIORITY: 150
      KEEPALIVED_INTERFACE: eth0
      KEEPALIVED_VIRTUAL_ROUTER_ID: 51
      KEEPALIVED_PASSWORD: ai-ready-vip-2026
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "5"
        tag: "keepalived-primary"

  # ============ 负载均衡监控 ============
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: ai-ready-nginx-exporter
    restart: unless-stopped
    ports:
      - "9113:9113"
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.0.40
      ai-ready-test-network:
    command:
      - '-nginx.scrape-uri=http://nginx-loadbalancer-primary:80/nginx_status'
    environment:
      EXPORTER_ENV: production
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9113/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ============ 健康检查服务 ============
  health-check-service:
    image: alpine:3.18
    container_name: ai-ready-health-check
    restart: unless-stopped
    networks:
      ai-ready-ha-network:
        ipv4_address: 172.31.0.50
      ai-ready-test-network:
    command: >
      sh -c '
      apk add --no-cache curl && \
      while true; do
        # 检查主Nginx
        if curl -f http://nginx-loadbalancer-primary:80/health > /dev/null 2>&1; then
          echo "$(date): Nginx primary is healthy"
        else
          echo "$(date): WARNING: Nginx primary is unhealthy"
        fi
        
        # 检查备用Nginx
        if curl -f http://nginx-loadbalancer-backup:80/health > /dev/null 2>&1; then
          echo "$(date): Nginx backup is healthy"
        else
          echo "$(date): WARNING: Nginx backup is unhealthy"
        fi
        
        sleep 30
      done
      '
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 32M

# ==================== 启动顺序和依赖 ====================
x-depends-on:
  startup-order: &startup-order
    condition: service_started
  healthy-order: &healthy-order
    condition: service_healthy
  completed-order: &completed-order
    condition: service_completed_successfully