[pytest]
# ============================
# AI-Ready 项目统一测试配置
# 优化版本 - Sprint 28+1
# ============================

# 测试路径配置
testpaths = 
    tests
    backend/tests/tests
    qa

# 测试文件匹配规则
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
python_functions = 
    test_*

# 执行策略优化
# ============================
# 1. 启用并行执行（根据CPU核心数自动调整）
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -n auto
    --dist=loadscope
    --maxfail=3
    --failed-first

# 2. 分层测试执行策略
xfail_strict = true
filterwarnings = 
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# 3. 性能优化配置
junit_family = xunit2
doctest_optionflags = NORMALIZE_WHITESPACE
doctest_encoding = utf-8
asyncio_mode = strict

# 报告生成配置
# ============================
# 1. JUnit XML 报告（CI/CD集成）
junit_suite_name = ai-ready-tests
junit_logging = all
junit_log_passing_tests = true

# 2. HTML 报告（本地查看）
htmlpath = reports/html/index.html
html = 
    title=AI-Ready 测试报告
    environment=Test Environment

# 3. JSON 报告（自动化分析）
jsonpath = reports/json/test-report.json

# 标记系统扩展
# ============================
markers =
    # 测试类型
    unit: 单元测试（快速执行）
    api: API测试
    integration: 集成测试
    e2e: 端到端测试（包含UI）
    performance: 性能测试
    security: 安全测试
    contract: 契约测试
    ui: 用户界面测试
    database: 数据库测试
    external: 外部依赖测试
    
    # 业务模块
    ai: AI模块测试
    erp: ERP模块测试
    crm: CRM模块测试
    finance: 财务模块测试
    order: 订单模块测试
    purchase: 采购模块测试
    inventory: 库存模块测试
    user: 用户模块测试
    permission: 权限模块测试
    monitoring: 监控模块测试
    
    # 执行策略
    smoke: 冒烟测试（核心功能）
    regression: 回归测试
    critical: 关键路径测试
    slow: 慢速测试（超过5秒）
    flaky: 不稳定的测试
    manual: 需要手动执行的测试
    automated: 自动化测试
    
    # 环境标记
    ci: 只能在CI环境运行
    local: 只能在本地环境运行
    staging: 只能在预发布环境运行
    production: 只能在生产环境运行

# 测试筛选规则
# ============================
# 1. 默认包含的标记（执行所有标记为unit/api/integration的测试）
markexpr = unit or api or integration

# 2. 根据环境自动调整
#    - 本地开发环境：执行所有非slow测试
#    - CI/CD环境：执行所有测试
#    - 预发布环境：执行smoke+critical+e2e测试

# 忽略目录
norecursedirs = 
    .git
    .tox
    .pytest_cache
    .benchmarks
    .vscode
    __pycache__
    build
    dist
    *.egg
    venv
    node_modules
    target
    .idea
    .mypy_cache

# 环境变量配置
# ============================
env = 
    TEST_ENVIRONMENT=optimized
    TEST_MAX_WORKERS=auto
    TEST_TIMEOUT=30
    TEST_RETRY_COUNT=3
    TEST_PARALLEL=true
    TEST_HTML_REPORT=true
    TEST_JSON_REPORT=true
    TEST_JUNIT_REPORT=true
    PYTHONPATH=.
    PYTHONUNBUFFERED=1

# 自定义配置
# ============================
[pytest-cov]
addopts = --cov=backend --cov-report=html --cov-report=xml --cov-report=term
fail_under = 80
exclude_lines = 
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError

[pytest-benchmark]
min_time = 0.000005
max_time = 1.0
min_rounds = 5
warmup = false

[pytest-html]
extra_html = <meta charset="utf-8">
environment = 
    Project=AI-Ready
    Branch=main
    Version=1.0.0
    Framework=pytest

# 测试执行钩子
# ============================
[pytest:before_test]
cleanup_old_reports = true
create_report_dirs = true

[pytest:after_test]
send_notifications = false
archive_reports = true