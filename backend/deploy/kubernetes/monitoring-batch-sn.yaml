# 🚀 ERP批次管理模块监控告警配置
# 版本: 1.0.0
# 创建时间: 2026-05-05
# 紧急优化: 完善监控告警体系，覆盖100%关键指标

---
# 🎯 Prometheus ServiceMonitor配置
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: erp-batch-sn-monitor
  namespace: monitoring
  labels:
    app: erp-batch-sn
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: erp-batch-sn
  namespaceSelector:
    matchNames:
      - erp-prod
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s
    params:
      format: ["prometheus"]
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node_name
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod_name
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    metricRelabelings:
    - sourceLabels: [__name__]
      regex: '(jvm_.*|process_.*|system_.*|tomcat_.*|hikaricp_.*|http_server_.*)'
      action: keep

---
# 🎯 PrometheusRule - JVM监控告警
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: erp-batch-sn-jvm-alerts
  namespace: monitoring
  labels:
    app: erp-batch-sn
    release: prometheus-stack
spec:
  groups:
  - name: jvm.alerts
    interval: 30s
    rules:
    
    # 🚨 JVM内存泄漏检测规则
    - alert: ERPBatchSnJVMHeapMemoryLeak
      expr: |
        increase(jvm_memory_used_bytes{area="heap", job="erp-batch-sn"}[1h]) > 500 * 1024 * 1024  # 1小时内堆内存增长超过500MB
      for: 15m
      labels:
        severity: critical
        component: jvm
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块JVM堆内存泄漏检测"
        description: |
          Pod {{ $labels.pod_name }} 的堆内存在过去1小时内增长了 {{ $value | humanize }} 字节，可能存在内存泄漏。
          当前使用量: {{ printf "%.2f" (div (query "jvm_memory_used_bytes{area=\"heap\", pod=\"$pod\"}") 1024 1024) }} MB
          最大堆内存: {{ printf "%.2f" (div (query "jvm_memory_max_bytes{area=\"heap\", pod=\"$pod\"}") 1024 1024) }} MB
    
    # ⚠️ JVM内存使用率高
    - alert: ERPBatchSnJVMHeapMemoryHigh
      expr: |
        jvm_memory_used_bytes{area="heap", job="erp-batch-sn"} / jvm_memory_max_bytes{area="heap", job="erp-batch-sn"} > 0.85
      for: 5m
      labels:
        severity: warning
        component: jvm
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块JVM堆内存使用率过高"
        description: |
          Pod {{ $labels.pod_name }} 的堆内存使用率超过85%，当前使用率: {{ printf "%.1f" (multiply (divide (query "jvm_memory_used_bytes{area=\"heap\", pod=\"$pod\"}") (query "jvm_memory_max_bytes{area=\"heap\", pod=\"$pod\"}")) 100) }}%
          建议检查内存泄漏或增加JVM堆内存。
    
    # 🚨 GC暂停时间过长
    - alert: ERPBatchSnGCPauseTooLong
      expr: |
        rate(jvm_gc_pause_seconds_sum{job="erp-batch-sn"}[5m]) > 5
      for: 2m
      labels:
        severity: critical
        component: jvm
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块GC暂停时间过长"
        description: |
          Pod {{ $labels.pod_name }} 的GC暂停时间过长，过去5分钟平均: {{ printf "%.2f" $value }} 秒。
          可能原因：内存泄漏、堆内存不足、GC配置不当。
    
    # ⚠️ 线程数过多
    - alert: ERPBatchSnThreadCountHigh
      expr: |
        jvm_threads_live_threads{job="erp-batch-sn"} > 500
      for: 5m
      labels:
        severity: warning
        component: jvm
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块线程数过多"
        description: |
          Pod {{ $labels.pod_name }} 的活跃线程数超过500，当前: {{ $value }} 个线程。
          可能原因：线程池配置不当、线程泄漏。

---
# 🎯 PrometheusRule - 数据库连接池监控告警
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: erp-batch-sn-db-alerts
  namespace: monitoring
  labels:
    app: erp-batch-sn
    release: prometheus-stack
spec:
  groups:
  - name: database.alerts
    interval: 30s
    rules:
    
    # 🚨 数据库连接池耗尽
    - alert: ERPBatchSnDBConnectionPoolExhausted
      expr: |
        hikaricp_connections_active{pool="HikariPool-1", job="erp-batch-sn"} == hikaricp_connections_max{pool="HikariPool-1", job="erp-batch-sn"}
      for: 2m
      labels:
        severity: critical
        component: database
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块数据库连接池耗尽"
        description: |
          Pod {{ $labels.pod_name }} 的数据库连接池已耗尽，所有连接都在使用中。
          活动连接数: {{ query "hikaricp_connections_active{pool=\"HikariPool-1\", pod=\"$pod\"}" }}
          最大连接数: {{ query "hikaricp_connections_max{pool=\"HikariPool-1\", pod=\"$pod\"}" }}
          等待连接数: {{ query "hikaricp_connections_pending{pool=\"HikariPool-1\", pod=\"$pod\"}" }}
    
    # ⚠️ 数据库连接等待时间过长
    - alert: ERPBatchSnDBConnectionWaitHigh
      expr: |
        rate(hikaricp_connections_timeout_total{pool="HikariPool-1", job="erp-batch-sn"}[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
        component: database
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块数据库连接等待超时"
        description: |
          Pod {{ $labels.pod_name }} 的数据库连接等待频繁超时，过去5分钟超时率: {{ printf "%.2f" $value }} 次/秒。
          建议增加连接池大小或优化SQL查询。
    
    # ⚠️ 数据库连接获取时间过长
    - alert: ERPBatchSnDBConnectionAcquireSlow
      expr: |
        histogram_quantile(0.95, rate(hikaricp_connection_acquired_seconds_bucket{pool="HikariPool-1", job="erp-batch-sn"}[5m])) > 1
      for: 5m
      labels:
        severity: warning
        component: database
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块数据库连接获取过慢"
        description: |
          Pod {{ $labels.pod_name }} 获取数据库连接的95分位时间超过1秒，当前: {{ printf "%.2f" $value }} 秒。
          可能原因：数据库压力大、网络延迟、连接池配置不当。

---
# 🎯 PrometheusRule - 应用性能监控告警
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: erp-batch-sn-performance-alerts
  namespace: monitoring
  labels:
    app: erp-batch-sn
    release: prometheus-stack
spec:
  groups:
  - name: performance.alerts
    interval: 30s
    rules:
    
    # 🚨 API响应时间过长
    - alert: ERPBatchSnAPIResponseSlow
      expr: |
        histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job="erp-batch-sn", status!~"5.."}[5m])) > 3
      for: 5m
      labels:
        severity: warning
        component: api
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块API响应时间过长"
        description: |
          Pod {{ $labels.pod_name }} 的API响应95分位时间超过3秒，当前: {{ printf "%.2f" $value }} 秒。
          端点: {{ $labels.uri }}
          方法: {{ $labels.method }}
    
    # 🚨 API错误率过高
    - alert: ERPBatchSnAPIErrorRateHigh
      expr: |
        sum(rate(http_server_requests_seconds_count{job="erp-batch-sn", status=~"5.."}[5m])) 
        / 
        sum(rate(http_server_requests_seconds_count{job="erp-batch-sn"}[5m])) > 0.01
      for: 5m
      labels:
        severity: critical
        component: api
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块API错误率过高"
        description: |
          Pod {{ $labels.pod_name }} 的API错误率超过1%，当前: {{ printf "%.2f" (multiply $value 100) }}%。
          建议检查应用日志和依赖服务状态。
    
    # ⚠️ 活跃HTTP连接数过高
    - alert: ERPBatchSnHTTPConnectionsHigh
      expr: |
        tomcat_threads_current_threads{name="http-nio-8080", job="erp-batch-sn"} > 150
      for: 5m
      labels:
        severity: warning
        component: http
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块HTTP连接数过高"
        description: |
          Pod {{ $labels.pod_name }} 的活跃HTTP连接数超过150，当前: {{ $value }} 个连接。
          可能原因：请求处理慢、连接未及时释放。

---
# 🎯 PrometheusRule - Pod和容器监控告警
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: erp-batch-sn-pod-alerts
  namespace: monitoring
  labels:
    app: erp-batch-sn
    release: prometheus-stack
spec:
  groups:
  - name: pod.alerts
    interval: 30s
    rules:
    
    # 🚨 Pod频繁重启
    - alert: ERPBatchSnPodFrequentRestart
      expr: |
        rate(kube_pod_container_status_restarts_total{container="erp-batch-sn", namespace="erp-prod"}[1h]) > 0.1
      for: 5m
      labels:
        severity: critical
        component: pod
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块Pod频繁重启"
        description: |
          Pod {{ $labels.pod }} 在过去1小时内重启超过0.1次/小时，当前重启率: {{ printf "%.2f" $value }} 次/小时。
          总重启次数: {{ query "kube_pod_container_status_restarts_total{container=\"erp-batch-sn\", pod=\"$pod\"}" }}
          建议检查应用日志、资源限制和健康检查配置。
    
    # 🚨 Pod内存使用率过高
    - alert: ERPBatchSnPodMemoryUsageHigh
      expr: |
        container_memory_working_set_bytes{container="erp-batch-sn", namespace="erp-prod"}
        /
        container_spec_memory_limit_bytes{container="erp-batch-sn", namespace="erp-prod"} > 0.9
      for: 5m
      labels:
        severity: critical
        component: pod
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块Pod内存使用率过高"
        description: |
          Pod {{ $labels.pod }} 的内存使用率超过90%，当前: {{ printf "%.1f" (multiply $value 100) }}%。
          使用量: {{ printf "%.2f" (div (query "container_memory_working_set_bytes{container=\"erp-batch-sn\", pod=\"$pod\"}") 1024 1024) }} MB
          限制: {{ printf "%.2f" (div (query "container_spec_memory_limit_bytes{container=\"erp-batch-sn\", pod=\"$pod\"}") 1024 1024) }} MB
    
    # ⚠️ Pod CPU使用率过高
    - alert: ERPBatchSnPodCPUUsageHigh
      expr: |
        rate(container_cpu_usage_seconds_total{container="erp-batch-sn", namespace="erp-prod"}[5m]) 
        / 
        container_spec_cpu_quota{container="erp-batch-sn", namespace="erp-prod"} > 0.8
      for: 5m
      labels:
        severity: warning
        component: pod
        module: batch-sn
      annotations:
        summary: "ERP批次管理模块Pod CPU使用率过高"
        description: |
          Pod {{ $labels.pod }} 的CPU使用率超过80%，当前: {{ printf "%.1f" (multiply $value 100) }}%。
          建议优化代码或增加CPU资源限制。

---
# 🎯 Grafana Dashboard配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-batch-sn-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  erp-batch-sn-overview.json: |-
    {
      "title": "ERP批次管理模块监控大盘",
      "tags": ["erp", "batch-sn", "java", "spring-boot"],
      "timezone": "browser",
      "panels": [
        // JVM监控面板
        {
          "title": "JVM堆内存使用",
          "type": "graph",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\", job=\"erp-batch-sn\"}",
              "legendFormat": "{{pod}} - 已使用"
            },
            {
              "expr": "jvm_memory_max_bytes{area=\"heap\", job=\"erp-batch-sn\"}",
              "legendFormat": "{{pod}} - 最大"
            }
          ]
        },
        // 数据库连接池面板
        {
          "title": "数据库连接池状态",
          "type": "stat",
          "targets": [
            {
              "expr": "hikaricp_connections_active{pool=\"HikariPool-1\", job=\"erp-batch-sn\"}",
              "legendFormat": "活动连接"
            },
            {
              "expr": "hikaricp_connections_idle{pool=\"HikariPool-1\", job=\"erp-batch-sn\"}",
              "legendFormat": "空闲连接"
            },
            {
              "expr": "hikaricp_connections_pending{pool=\"HikariPool-1\", job=\"erp-batch-sn\"}",
              "legendFormat": "等待连接"
            }
          ]
        },
        // API性能面板
        {
          "title": "API响应时间",
          "type": "heatmap",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{job=\"erp-batch-sn\"}[5m]))",
              "legendFormat": "95分位响应时间"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 27,
      "version": 1
    }