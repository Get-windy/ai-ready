# 测试环境配置
server:
  port: 8081

spring:
  datasource:
    # 默认PostgreSQL, 可选MySQL: jdbc:mysql://test-mysql:3306/erp_purchase_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=true
    url: jdbc:postgresql://test-postgres:5432/erp_purchase_test
    username: purchase_test
    password: ${TEST_DB_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
  
  redis:
    host: test-redis
    port: 6379
    password: ${TEST_REDIS_PASSWORD}
    database: 3
  
  rabbitmq:
    host: test-rabbitmq
    port: 5672
    username: purchase_test
    password: ${TEST_MQ_PASSWORD}
    virtual-host: /erp_purchase_test
  
  # 测试环境配置
  jpa:
    hibernate:
      ddl-auto: update

# 测试环境日志配置
logging:
  level:
    cn.aiedge.erp.purchase: INFO
    org.springframework.web: WARN
  file:
    name: /var/log/erp-purchase/erp-purchase-test.log

# 测试环境采购模块配置
erp:
  purchase:
    business:
      auto-approve-enabled: false
      approval-threshold: 10000.00
    integration:
      finance:
        base-url: http://test-finance:8082/finance
        timeout: 10000
      stock:
        base-url: http://test-stock:8083/stock
        timeout: 10000
      supplier:
        base-url: http://test-supplier:8084/supplier
        timeout: 8000
    security:
      allowed-origins: https://test.ai-ready.com,https://admin-test.ai-ready.com
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS

# 测试环境监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    tags:
      environment: test
      application: erp-purchase-service