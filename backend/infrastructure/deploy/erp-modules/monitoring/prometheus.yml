# Prometheus Configuration for ERP Modules
# 监控5个P0 ERP核心模块

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'erp-modules'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - localhost:9093

# 告警规则文件
rule_files:
  - '/etc/prometheus/alerts/erp-modules-alerts.yml'
  - '/etc/prometheus/alerts/business-metrics-alerts.yml'

# 数据采集配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL监控
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-ready-erp-postgres'

  # Redis监控
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-ready-erp-redis'

  # 批次/序列号管理模块监控
  - job_name: 'erp-batch-sn'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['erp-batch-sn:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-ready-erp-batch-sn'
      - source_labels: []
        target_label: module
        replacement: 'batch-sn'

  # 发票管理模块监控
  - job_name: 'erp-invoice'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['erp-invoice:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-ready-erp-invoice'
      - source_labels: []
        target_label: module
        replacement: 'invoice'

  # 采购询价/报价管理模块监控
  - job_name: 'erp-purchase-exchange'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['erp-purchase-exchange:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-ready-erp-purchase-exchange'
      - source_labels: []
        target_label: module
        replacement: 'purchase-exchange'

  # 销售价格策略管理模块监控
  - job_name: 'erp-sales-exchange'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['erp-sales-exchange:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-ready-erp-sales-exchange'
      - source_labels: []
        target_label: module
        replacement: 'sales-exchange'

  # 供应商协同门户模块监控
  - job_name: 'supplier-portal'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['supplier-portal:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ai-ready-supplier-portal'
      - source_labels: []
        target_label: module
        replacement: 'supplier-portal'

  # Docker容器监控（cAdvisor）
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Node系统监控
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']