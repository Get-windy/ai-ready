# ============================================================
# HikariCP 连接池优化配置 - Sprint 27+1 测试环境
# 基于性能测试验证结果，针对 PostgreSQL 优化
# 最后更新: 2026-04-27
# ============================================================

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      # ---- 核心连接池参数 ----
      # 最小空闲连接数：保持10个空闲连接，避免频繁创建
      minimum-idle: 10
      # 最大连接数：经测试50为最佳平衡点（100连接无显著性能提升）
      maximum-pool-size: 50
      # 连接获取超时：30秒，超过则抛异常
      connection-timeout: 30000
      # 空闲连接超时：10分钟
      idle-timeout: 600000
      # 连接最大生命周期：30分钟，防止连接因数据库端超时导致问题
      max-lifetime: 1800000
      # 连接测试查询（PostgreSQL）
      connection-test-query: SELECT 1
      # 自动提交：关闭，由业务层控制事务
      auto-commit: false
      
      # ---- 健康检查与泄漏检测 ----
      # 健康检查间隔：2分钟
      health-check-interval: 120000
      # 健康检查超时：10秒
      health-check-timeout: 10000
      # 连接泄漏检测阈值：5秒（超过则记录警告）
      leak-detection-threshold: 5000
      
      # ---- 性能优化参数 ----
      # 允许在获取连接时设置网络超时
      allow-pool-suspension: false
      # 初始化失败时是否快速失败
      initialization-fail-timeout: 1
      # 验证超时：5秒
      validation-timeout: 5000
      # 保持连接活跃：每10分钟发送保活查询
      keepalive-time: 600000
      # 注册MBeans用于JMX监控
      register-mbeans: true
      
      # ---- 连接池名称（用于监控区分） ----
      pool-name: QizhilianHikariPool
      
      # ---- 数据源特定属性（PostgreSQL） ----
      data-source-properties:
        # 连接超时（PostgreSQL驱动层）
        socketTimeout: 30
        # 应用名称（在 pg_stat_activity 中可见）
        ApplicationName: qizhilian-test
        # 取消信号超时
        cancelSignalTimeout: 10
        # TCP keepalive
        tcpKeepAlive: true
        # 日志级别
        loggerLevel: OFF

---
# 生产环境覆盖配置（生产环境使用更高的连接数）
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      minimum-idle: 20
      maximum-pool-size: 100
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 10000
      keepalive-time: 300000

---
# 开发环境覆盖配置（轻量级）
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 10000
      leak-detection-threshold: 30000