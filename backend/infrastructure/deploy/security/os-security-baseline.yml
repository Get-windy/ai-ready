# ==========================================
# 操作系统安全基线配置 (OS Security Baseline)
# AI-Ready 测试环境
# ==========================================

os_security:
  name: "AI-Ready Test Environment OS Security Baseline"
  version: "1.0.0"
  date: "2026-04-29"
  environment: "test"

  # 1. 用户权限管理
  user_management:
    - rule: "禁用root远程登录"
      control: "PAM配置"
      command: "sed -i 's/#PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config"
      verify: "grep 'PermitRootLogin no' /etc/ssh/sshd_config"
      severity: "critical"
      
    - rule: "创建专用运行用户"
      control: "用户管理"
      command: "useradd -r -s /bin/false ai-ready || true"
      verify: "id ai-ready"
      severity: "high"
      
    - rule: "设置强密码策略"
      control: "PAM配置"
      config:
        minlen: 12
        minclass: 3
        maxrepeat: 2
        dcredit: -1
        ucredit: -1
        ocredit: -1
      severity: "high"
      
    - rule: "定期更换密码 (90天)"
      control: "密码过期策略"
      command: "chage -M 90 ai-ready"
      verify: "chage -l ai-ready | grep 'Maximum number of days'"
      severity: "medium"

  # 2. 文件权限管理
  file_permissions:
    - rule: "关键配置文件权限"
      files:
        - path: "/etc/passwd"
          mode: "644"
        - path: "/etc/shadow"
          mode: "000"
        - path: "/etc/ssh/sshd_config"
          mode: "600"
      severity: "critical"
      
    - rule: "Docker守护进程权限"
      path: "/var/run/docker.sock"
      mode: "660"
      group: "docker"
      severity: "high"
      
    - rule: "应用日志文件权限"
      path: "/var/log/ai-ready"
      mode: "750"
      owner: "ai-ready"
      group: "ai-ready"
      severity: "medium"

  # 3. 服务配置
  service_configuration:
    - rule: "禁用不必要的服务"
      disabled_services:
        - telnet
        - ftp
        - nfs
        - smb
      verify: "systemctl list-unit-files | grep -E 'telnet|ftp|nfs|smb'"
      severity: "high"
      
    - rule: "SSH安全加固"
      config:
        Protocol: 2
        MaxAuthTries: 3
        ClientAliveInterval: 300
        ClientAliveCountMax: 2
        LoginGraceTime: 60
        MaxSessions: 2
        PasswordAuthentication: "no"  # 测试环境可设为yes
        PubkeyAuthentication: "yes"
      severity: "critical"
      
    - rule: "启用审计日志"
      service: "auditd"
      config:
        log_file: "/var/log/audit/audit.log"
        log_group: "root"
        log_format: "RAW"
        flush: "INCREMENTAL_ASYNC"
        freq: 50
      severity: "high"

  # 4. 系统加固
  system_hardening:
    - rule: "启用SELinux/AppArmor"
      control: "强制访问控制"
      verify: "getenforce || aa-status"
      severity: "high"
      
    - rule: "配置系统资源限制"
      config:
        nproc: 65535
        nofile: 65535
        core: 0
        memlock: unlimited
      severity: "medium"
      
    - rule: "禁用核心转储"
      command: "echo '* soft core 0' >> /etc/security/limits.conf"
      verify: "ulimit -c"
      severity: "medium"
      
    - rule: "配置时区和NTP同步"
      timezone: "Asia/Shanghai"
      ntp_servers:
        - "ntp.aliyun.com"
        - "ntp.tencent.com"
      severity: "low"

  # 5. 日志管理
  log_management:
    - rule: "集中日志收集"
      rsyslog_config:
        - "*.* @@log-server:514"
      severity: "medium"
      
    - rule: "日志轮转配置"
      logrotate:
        - path: "/var/log/ai-ready/*.log"
          rotate: 30
          compress: true
          missingok: true
          notifempty: true
      severity: "low"

  # 6. 合规检查
  compliance_checks:
    - standard: "CIS Benchmark"
      version: "v3.0.0"
      target_score: 85
      
    - standard: "等保2.0"
      level: "三级"
      items:
        - "身份鉴别"
        - "访问控制"
        - "安全审计"
        - "入侵防范"
        - "数据完整性"

# 验证命令
verification_commands:
  - name: "检查SSH配置"
    command: "sshd -t && echo 'SSH配置有效'"
    
  - name: "检查开放端口"
    command: "ss -tulnp | grep -E ':22|:80|:443|:8080'"
    
  - name: "检查用户列表"
    command: "awk -F: '$3 >= 1000 {print $1}' /etc/passwd"
    
  - name: "检查文件权限"
    command: "stat -c '%a %n' /etc/passwd /etc/shadow /etc/ssh/sshd_config"
