# 企智连项目 Service 配置
# 定义服务发现和负载均衡

---
# 后端服务 - ClusterIP（内部访问）
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ai-ready
  labels:
    app: ai-ready
    component: backend
spec:
  type: ClusterIP
  selector:
    app: ai-ready
    component: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: management
      port: 8081
      targetPort: 8081
      protocol: TCP
  sessionAffinity: None
---
# 前端服务 - ClusterIP（内部访问，通过Ingress暴露）
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ai-ready
  labels:
    app: ai-ready
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: ai-ready
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
# PostgreSQL 数据库服务
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ai-ready
  labels:
    app: ai-ready
    component: database
spec:
  type: ClusterIP
  selector:
    app: ai-ready
    component: database
    db: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
# Redis 缓存服务
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ai-ready
  labels:
    app: ai-ready
    component: cache
spec:
  type: ClusterIP
  selector:
    app: ai-ready
    component: cache
    db: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
