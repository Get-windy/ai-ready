input {
  # Filebeat输入
  beats {
    port => 5000
    type => "logs"
  }

  # TCP输入 (用于应用直接发送日志)
  tcp {
    port => 5001
    codec => json_lines
    type => "application"
  }
}

filter {
  # 解析JSON日志
  if [type] == "application" {
    json {
      source => "message"
      target => "parsed"
    }
  }

  # 解析应用日志字段
  if [parsed] {
    # 提取服务名称
    if [parsed][service] {
      mutate {
        add_field => { "service" => "%{[parsed][service]}" }
      }
    }

    # 提取日志级别
    if [parsed][level] {
      mutate {
        add_field => { "log.level" => "%{[parsed][level]}" }
      }
    }

    # 提取跟踪ID
    if [parsed][traceId] {
      mutate {
        add_field => { "trace.id" => "%{[parsed][traceId]}" }
      }
    }

    # 提取组件名称
    if [parsed][component] {
      mutate {
        add_field => { "component" => "%{[parsed][component]}" }
      }
    }

    # 提取主机名称
    if [parsed][host] {
      mutate {
        add_field => { "host.name" => "%{[parsed][host]}" }
      }
    }

    # 提取时间戳
    if [parsed][timestamp] {
      date {
        match => [ "[parsed][timestamp]", "ISO8601", "UNIX", "yyyy-MM-dd HH:mm:ss.SSS" ]
        target => "@timestamp"
      }
    }
  }

  # 解析容器日志 (Docker日志)
  if [container][id] {
    mutate {
      add_field => { "container_id" => "%{[container][id]}" }
    }
  }

  # 错误日志标记
  if [log.level] == "ERROR" or [log.level] == "FATAL" {
    mutate {
      add_tag => [ "error", "critical" ]
    }
  }

  # 警告日志标记
  if [log.level] == "WARN" or [log.level] == "WARNING" {
    mutate {
      add_tag => [ "warning" ]
    }
  }

  # 删除不需要的字段
  mutate {
    remove_field => [ "parsed", "host", "offset" ]
  }
}

output {
  # 输出到Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ai-ready-logs-%{+YYYY.MM.dd}"
    template_name => "ai-ready-logs-template"
    template_overwrite => true
    ilm_enabled => true
    ilm_rollover_alias => "ai-ready-logs"
    ilm_policy => "ai-ready-logs-policy"
  }

  # 错误日志输出到专门的索引
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "ai-ready-errors-%{+YYYY.MM.dd}"
    }
  }

  # 输出到文件 (用于调试)
  file {
    path => "/var/log/logstash/output.log"
    codec => json_lines
  }

  # 输出到标准输出 (调试)
  stdout {
    codec => rubydebug
  }
}