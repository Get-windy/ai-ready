# 系统监控告警规则
# 文件名: system-alerts.yml
# 版本: v1.0.0
# 创建日期: 2026-04-27

groups:
  # ===========================================
  # 系统资源监控告警
  # ===========================================
  - name: system-resource-alerts
    interval: 30s
    rules:
      # CPU使用率过高
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: node
          category: resource
        annotations:
          summary: "CPU使用率过高 (实例 {{ $labels.instance }})"
          description: "CPU使用率超过80%持续5分钟。当前值: {{ $value }}%"
          impact: "可能影响应用性能，响应时间可能增加"
          action: "检查CPU密集型进程，考虑扩容或优化代码"
          runbook: "https://wiki.ai-ready.local/runbooks/high-cpu-usage"
      
      # 内存使用率过高
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: node
          category: resource
        annotations:
          summary: "内存使用率过高 (实例 {{ $labels.instance }})"
          description: "内存使用率超过85%持续5分钟。当前值: {{ $value }}%"
          impact: "可能导致应用OOM或性能下降"
          action: "检查内存泄漏，考虑增加内存或优化内存使用"
          runbook: "https://wiki.ai-ready.local/runbooks/high-memory-usage"
      
      # 磁盘使用率过高
      - alert: HighDiskUsage
        expr: (1 - node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: node
          category: resource
        annotations:
          summary: "磁盘使用率过高 (实例 {{ $labels.instance }}, 挂载点 {{ $labels.mountpoint }})"
          description: "磁盘使用率超过90%持续5分钟。当前值: {{ $value }}%"
          impact: "可能导致应用无法写入，服务中断"
          action: "立即清理磁盘空间或扩容磁盘"
          runbook: "https://wiki.ai-ready.local/runbooks/high-disk-usage"
      
      # 节点宕机
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: node
          category: availability
        annotations:
          summary: "节点宕机 (实例 {{ $labels.instance }})"
          description: "节点监控端点无法访问超过1分钟"
          impact: "节点上的所有服务可能不可用"
          action: "立即检查节点状态，重启或修复"
          runbook: "https://wiki.ai-ready.local/runbooks/node-down"
      
      # 系统负载过高
      - alert: HighSystemLoad
        expr: node_load5 > node:node_num_cpu:avg5m * 1.5
        for: 5m
        labels:
          severity: warning
          service: node
          category: performance
        annotations:
          summary: "系统负载过高 (实例 {{ $labels.instance }})"
          description: "5分钟平均负载超过CPU核心数1.5倍。当前值: {{ $value }}"
          impact: "系统响应变慢，任务排队"
          action: "检查高负载进程，优化资源分配"
          runbook: "https://wiki.ai-ready.local/runbooks/high-system-load"

  # ===========================================
  # 服务监控告警
  # ===========================================
  - name: service-monitoring-alerts
    interval: 30s
    rules:
      # 服务不可用
      - alert: ServiceDown
        expr: up{job!="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
          category: availability
        annotations:
          summary: "服务不可用 (服务 {{ $labels.job }}, 实例 {{ $labels.instance }})"
          description: "服务监控端点无法访问超过2分钟"
          impact: "服务功能不可用"
          action: "检查服务状态，重启服务"
          runbook: "https://wiki.ai-ready.local/runbooks/service-down"
      
      # 服务响应时间过高
      - alert: HighServiceResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
          category: performance
        annotations:
          summary: "服务响应时间过高 (服务 {{ $labels.job }})"
          description: "95%分位响应时间超过2秒持续5分钟。当前值: {{ $value }}秒"
          impact: "用户体验下降，可能影响业务"
          action: "优化服务性能，检查数据库查询"
          runbook: "https://wiki.ai-ready.local/runbooks/high-response-time"
      
      # 服务错误率过高
      - alert: HighServiceErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
          category: quality
        annotations:
          summary: "服务错误率过高 (服务 {{ $labels.job }})"
          description: "HTTP 5xx错误率超过5%持续5分钟。当前值: {{ $value }}%"
          impact: "用户请求失败，业务受影响"
          action: "检查应用日志，修复错误"
          runbook: "https://wiki.ai-ready.local/runbooks/high-error-rate"
      
      # 服务请求量突增
      - alert: ServiceRequestSpike
        expr: rate(http_requests_total[5m]) / rate(http_requests_total[5m] offset 10m) > 3
        for: 2m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
          category: traffic
        annotations:
          summary: "服务请求量突增 (服务 {{ $labels.job }})"
          description: "请求量比10分钟前增长超过3倍持续2分钟"
          impact: "可能导致服务过载"
          action: "检查是否为正常流量，考虑扩容"
          runbook: "https://wiki.ai-ready.local/runbooks/request-spike"

  # ===========================================
  # 数据库监控告警
  # ===========================================
  - name: database-monitoring-alerts
    interval: 30s
    rules:
      # 数据库连接数过高
      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends{datname!~"template.*|postgres"} > 100
        for: 5m
        labels:
          severity: warning
          service: postgres
          category: connection
        annotations:
          summary: "数据库连接数过高 (数据库 {{ $labels.datname }})"
          description: "数据库活动连接数超过100持续5分钟。当前值: {{ $value }}"
          impact: "可能影响新连接建立，性能下降"
          action: "检查连接泄漏，优化连接池配置"
          runbook: "https://wiki.ai-ready.local/runbooks/high-db-connections"
      
      # 数据库慢查询
      - alert: DatabaseSlowQueries
        expr: rate(pg_stat_statements_total_time_seconds[5m]) / rate(pg_stat_statements_calls[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          service: postgres
          category: performance
        annotations:
          summary: "数据库慢查询 (数据库 {{ $labels.datname }})"
          description: "平均查询执行时间超过100毫秒持续5分钟。当前值: {{ $value }}秒"
          impact: "应用响应时间变慢"
          action: "优化慢查询，添加索引"
          runbook: "https://wiki.ai-ready.local/runbooks/slow-queries"
      
      # 数据库死锁
      - alert: DatabaseDeadlocks
        expr: increase(pg_stat_database_deadlocks[5m]) > 0
        labels:
          severity: critical
          service: postgres
          category: deadlock
        annotations:
          summary: "数据库死锁检测 (数据库 {{ $labels.datname }})"
          description: "检测到数据库死锁"
          impact: "事务被阻塞，业务受影响"
          action: "立即检查并解决死锁"
          runbook: "https://wiki.ai-ready.local/runbooks/database-deadlocks"
      
      # 数据库复制延迟
      - alert: DatabaseReplicationLag
        expr: pg_replication_lag_seconds > 30
        for: 2m
        labels:
          severity: warning
          service: postgres
          category: replication
        annotations:
          summary: "数据库复制延迟过高"
          description: "数据库复制延迟超过30秒持续2分钟。当前值: {{ $value }}秒"
          impact: "从库数据可能过时"
          action: "检查网络和主库负载"
          runbook: "https://wiki.ai-ready.local/runbooks/replication-lag"

  # ===========================================
  # 缓存监控告警
  # ===========================================
  - name: cache-monitoring-alerts
    interval: 30s
    rules:
      # Redis内存使用率过高
      - alert: HighRedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 5m
        labels:
          severity: warning
          service: redis
          category: resource
        annotations:
          summary: "Redis内存使用率过高"
          description: "Redis内存使用率超过80%持续5分钟。当前值: {{ $value }}%"
          impact: "可能触发逐出策略，数据丢失"
          action: "清理过期键，增加内存或优化数据"
          runbook: "https://wiki.ai-ready.local/runbooks/high-redis-memory"
      
      # Redis连接数过高
      - alert: HighRedisConnections
        expr: redis_connected_clients > 1000
        for: 5m
        labels:
          severity: warning
          service: redis
          category: connection
        annotations:
          summary: "Redis连接数过高"
          description: "Redis连接数超过1000持续5分钟。当前值: {{ $value }}"
          impact: "可能影响新连接建立"
          action: "检查连接泄漏，优化连接池"
          runbook: "https://wiki.ai-ready.local/runbooks/high-redis-connections"
      
      # Redis命中率过低
      - alert: LowRedisHitRate
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.8
        for: 10m
        labels:
          severity: warning
          service: redis
          category: performance
        annotations:
          summary: "Redis命中率过低"
          description: "Redis缓存命中率低于80%持续10分钟。当前值: {{ $value }}%"
          impact: "缓存效果差，数据库压力增加"
          action: "优化缓存策略，检查缓存键设计"
          runbook: "https://wiki.ai-ready.local/runbooks/low-redis-hit-rate"

  # ===========================================
  # 消息队列监控告警
  # ===========================================
  - name: message-queue-alerts
    interval: 30s
    rules:
      # RabbitMQ队列积压
      - alert: RabbitMQQueueBacklog
        expr: rabbitmq_queue_messages_ready > 1000
        for: 5m
        labels:
          severity: warning
          service: rabbitmq
          category: backlog
        annotations:
          summary: "RabbitMQ队列积压 (队列 {{ $labels.queue }})"
          description: "队列消息积压超过1000持续5分钟。当前值: {{ $value }}"
          impact: "消息处理延迟增加"
          action: "增加消费者，优化处理逻辑"
          runbook: "https://wiki.ai-ready.local/runbooks/rabbitmq-backlog"
      
      # RabbitMQ连接数过高
      - alert: HighRabbitMQConnections
        expr: rabbitmq_connections_total > 500
        for: 5m
        labels:
          severity: warning
          service: rabbitmq
          category: connection
        annotations:
          summary: "RabbitMQ连接数过高"
          description: "RabbitMQ连接数超过500持续5分钟。当前值: {{ $value }}"
          impact: "可能影响性能"
          action: "检查连接泄漏"
          runbook: "https://wiki.ai-ready.local/runbooks/high-rabbitmq-connections"

  # ===========================================
  # 业务指标监控告警
  # ===========================================
  - name: business-metrics-alerts
    interval: 30s
    rules:
      # 订单创建失败率过高
      - alert: HighOrderCreationFailureRate
        expr: rate(order_creation_failed_total[5m]) / rate(order_creation_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: order
          category: business
        annotations:
          summary: "订单创建失败率过高"
          description: "订单创建失败率超过10%持续5分钟。当前值: {{ $value }}%"
          impact: "直接影响业务收入"
          action: "立即检查订单系统"
          runbook: "https://wiki.ai-ready.local/runbooks/order-creation-failure"
      
      # 支付成功率过低
      - alert: LowPaymentSuccessRate
        expr: rate(payment_success_total[5m]) / rate(payment_total[5m]) < 0.95
        for: 5m
        labels:
          severity: critical
          service: payment
          category: business
        annotations:
          summary: "支付成功率过低"
          description: "支付成功率低于95%持续5分钟。当前值: {{ $value }}%"
          impact: "直接影响业务收入"
          action: "检查支付通道和风控系统"
          runbook: "https://wiki.ai-ready.local/runbooks/payment-failure"
      
      # 用户活跃度下降
      - alert: UserActivityDrop
        expr: active_users_total < (active_users_total offset 1d) * 0.7
        for: 1h
        labels:
          severity: warning
          service: user
          category: business
        annotations:
          summary: "用户活跃度显著下降"
          description: "当前活跃用户数比昨天下降超过30%持续1小时"
          impact: "可能影响业务指标"
          action: "检查系统问题或市场变化"
          runbook: "https://wiki.ai-ready.local/runbooks/user-activity-drop"