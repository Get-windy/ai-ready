# 财务管理模块配置文件
server:
  port: 8085
  servlet:
    context-path: /api/v1/finance

spring:
  application:
    name: finance-management-service
  
  # 数据库配置 (默认PostgreSQL, 可选MySQL: jdbc:mysql://localhost:3306/ai_ready_finance?...)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/ai_ready_finance
    username: ${DB_USERNAME:finance_user}
    password: ${DB_PASSWORD:finance_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  # Redis配置
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 5
    timeout: 5000
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
        max-wait: -1
  
  # 消息队列配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        concurrency: 5
        max-concurrency: 20
        prefetch: 1
        acknowledge-mode: manual
  
  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 3600000
      key-prefix: finance:
      cache-null-values: false

# 日志配置
logging:
  level:
    cn.aiedge.finance: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 自定义财务管理配置
finance:
  # 会计期间配置
  accounting:
    fiscal-year-start-month: 1
    auto-close-period: true
    close-warning-days: 5
  
  # 预算配置
  budget:
    approval-required: true
    approval-threshold: 10000
    variance-alert-percentage: 10
  
  # 支付配置
  payment:
    gateway:
      default: alipay
      supported: [alipay, wechat, bank_transfer]
    retry:
      max-attempts: 3
      delay-ms: 5000
  
  # 报表配置
  report:
    export-formats: [pdf, excel, csv]
    max-rows: 10000
    cache-duration-minutes: 30
  
  # 税务配置
  tax:
    default-rate: 0.13
    calculation-method: inclusive
    auto-calculate: true

# 安全配置
security:
  jwt:
    secret: ${JWT_SECRET:finance_management_secret_key_2026}
    expiration: 86400000
  cors:
    allowed-origins: 
      - http://localhost:8080
      - http://localhost:3000
      - https://ai-ready.example.com
    allowed-methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: 
      - Authorization
      - Content-Type
      - X-Requested-With
    allow-credentials: true

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# API文档配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha