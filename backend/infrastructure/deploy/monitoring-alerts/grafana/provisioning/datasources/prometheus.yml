# Grafana数据源配置 - Prometheus
# 文件名: prometheus.yml
# 版本: v1.0.0
# 创建日期: 2026-04-27

apiVersion: 1

datasources:
  # 主Prometheus数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus-monitoring:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 30s
      queryTimeout: 60s
      httpMethod: POST
      manageAlerts: true
      prometheusVersion: 2.45.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
    secureJsonData:
      tlsSkipVerify: true
  
  # VictoriaMetrics数据源（长期存储）
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    editable: true
    jsonData:
      timeInterval: 1m
      queryTimeout: 120s
      httpMethod: POST
      prometheusVersion: 2.45.0
  
  # PostgreSQL数据源
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres-monitoring:5432
    database: monitoring_db
    user: monitoring_user
    secureJsonData:
      password: monitoring_pass_123
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
  
  # MySQL数据源
  - name: MySQL
    type: mysql
    access: proxy
    url: mysql-monitoring:3306
    database: monitoring_metrics
    user: monitoring_user
    secureJsonData:
      password: mysql_monitoring_pass_123
    editable: true
    jsonData:
      timezone: Asia/Shanghai
  
  # Redis数据源
  - name: Redis
    type: redis-datasource
    access: proxy
    url: redis-monitoring:6379
    editable: true
    jsonData:
      poolSize: 10
      timeout: 10
      pingInterval: 0
      pipelineWindow: 0
    secureJsonData:
      password: redis_monitoring_pass_123
  
  # Elasticsearch数据源（日志）
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    editable: true
    jsonData:
      timeField: '@timestamp'
      interval: Daily
      timeInterval: 1m
      logMessageField: message
      logLevelField: level
      maxConcurrentShardRequests: 5
      includeFrozen: false
  
  # Loki数据源（日志）
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
  
  # Tempo数据源（分布式追踪）
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      nodeGraph:
        enabled: true
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: true
        tags: ['job', 'instance', 'pod', 'namespace']
        mappedTags: [{ key: 'service.name', value: 'service' }]
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'
  
  # Jaeger数据源（追踪）
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: true
  
  # 监控API数据源
  - name: Monitoring-API
    type: prometheus
    access: proxy
    url: http://monitoring-api-service:8080/actuator/prometheus
    editable: true
    jsonData:
      timeInterval: 30s
      queryTimeout: 60s
      httpMethod: GET
  
  # 自定义导出器数据源
  - name: Custom-Exporter
    type: prometheus
    access: proxy
    url: http://custom-exporter-monitoring:9101/metrics
    editable: true
    jsonData:
      timeInterval: 30s
      queryTimeout: 60s
      httpMethod: GET