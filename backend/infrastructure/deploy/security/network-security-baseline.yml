# ==========================================
# 网络安全基线配置 (Network Security Baseline)
# AI-Ready 测试环境
# ==========================================

network_security:
  name: "AI-Ready Test Environment Network Security Baseline"
  version: "1.0.0"
  date: "2026-04-29"
  environment: "test"

  # 1. 防火墙规则
  firewall_rules:
    # 默认拒绝所有入站流量
    default_policy:
      input: "DROP"
      forward: "DROP"
      output: "ACCEPT"
    
    # 允许的入站规则
    inbound_rules:
      - protocol: "tcp"
        port: 22
        source: "192.168.0.0/16"  # 仅限内网SSH
        action: "ACCEPT"
        description: "SSH管理访问"
        
      - protocol: "tcp"
        port: 8080
        source: "0.0.0.0/0"
        action: "ACCEPT"
        description: "API Gateway服务"
        limit: "100/minute"
        
      - protocol: "tcp"
        port: 5432
        source: "172.17.0.0/16"  # 仅Docker网络
        action: "ACCEPT"
        description: "PostgreSQL数据库"
        
      - protocol: "tcp"
        port: 6379
        source: "172.17.0.0/16"
        action: "ACCEPT"
        description: "Redis缓存"
        
      - protocol: "tcp"
        port: 9090
        source: "192.168.0.0/16"
        action: "ACCEPT"
        description: "Prometheus监控"
        
      - protocol: "tcp"
        port: 3000
        source: "192.168.0.0/16"
        action: "ACCEPT"
        description: "Grafana监控面板"
        
      - protocol: "tcp"
        port: 9092
        source: "172.17.0.0/16"
        action: "ACCEPT"
        description: "Kafka消息队列"
        
      - protocol: "tcp"
        port: 2181
        source: "172.17.0.0/16"
        action: "ACCEPT"
        description: "Zookeeper协调服务"
    
    # 阻止的危险端口
    blocked_ports:
      - port: 23
        description: "Telnet (明文传输)"
      - port: 21
        description: "FTP (不安全)"
      - port: 53
        description: "DNS (防止暴露)"
      - port: 161
        description: "SNMP (管理协议)"
      - port: 445
        description: "SMB (文件共享)"
      - port: 3389
        description: "RDP (远程桌面)"
    
    # 速率限制
    rate_limits:
      - port: 8080
        limit: "100/minute"
        burst: 20
      - port: 22
        limit: "10/minute"
        burst: 5

  # 2. 网络隔离
  network_isolation:
    # Docker网络隔离
    docker_networks:
      - name: "ai-ready-test-network"
        driver: "bridge"
        subnet: "172.20.0.0/16"
        gateway: "172.20.0.1"
        internal: false  # 测试环境允许外部访问
        
      - name: "ai-ready-db-network"
        driver: "bridge"
        subnet: "172.21.0.0/16"
        internal: true  # 数据库网络仅内部访问
    
    # Kubernetes NetworkPolicy (如使用K8s)
    k8s_network_policies:
      - name: "default-deny-all"
        policy_types:
          - "Ingress"
          - "Egress"
        pod_selector: {}
        
      - name: "allow-api-ingress"
        pod_selector:
          match_labels:
            app: "api-gateway"
        policy_types:
          - "Ingress"
        ingress:
          - from:
              - namespace_selector: {}
            ports:
              - protocol: "TCP"
                port: 8080

  # 3. TLS/SSL配置
  tls_configuration:
    minimum_tls_version: "TLSv1.2"
    disabled_protocols:
      - "SSLv2"
      - "SSLv3"
      - "TLSv1.0"
      - "TLSv1.1"
    
    cipher_suites:
      - "ECDHE-ECDSA-AES128-GCM-SHA256"
      - "ECDHE-RSA-AES128-GCM-SHA256"
      - "ECDHE-ECDSA-AES256-GCM-SHA384"
      - "ECDHE-RSA-AES256-GCM-SHA384"
    
    hsts:
      enabled: true
      max_age: 31536000  # 1年
      include_subdomains: true
      preload: true
    
    certificate:
      key_size: 2048
      algorithm: "RSA"
      validity_days: 365
      auto_renewal: true

  # 4. DDoS防护
  ddos_protection:
    syn_flood:
      enabled: true
      rate_limit: "1000/second"
      
    connection_limits:
      max_connections_per_ip: 100
      max_connections_total: 10000
      connection_timeout: 30
      
    http_flood:
      enabled: true
      request_limit: "1000/minute"
      burst: 100
      block_duration: 300  # 5分钟

  # 5. 入侵检测
  intrusion_detection:
    fail2ban:
      enabled: true
      jails:
        - name: "ssh"
          maxretry: 3
          findtime: 600
          bantime: 3600
          
        - name: "api-gateway"
          maxretry: 10
          findtime: 60
          bantime: 600
    
    port_scan_detection:
      enabled: true
      threshold: 10
      block_duration: 3600

  # 6. DNS安全
  dns_security:
    dnssec:
      enabled: true
    
    dns_over_https:
      enabled: true
      servers:
        - "https://dns.alidns.com/dns-query"
        - "https://doh.pub/dns-query"
    
    cache_poisoning_protection:
      enabled: true
      min_ttl: 300

# 验证命令
verification_commands:
  - name: "检查防火墙规则"
    command: "iptables -L -n -v | head -20"
    
  - name: "检查开放端口"
    command: "ss -tulnp | grep LISTEN"
    
  - name: "检查Docker网络"
    command: "docker network ls && docker network inspect ai-ready-test-network"
    
  - name: "测试TLS配置"
    command: "openssl s_client -connect localhost:8080 -tls1_2 </dev/null 2>/dev/null | grep 'Protocol'"
