# 应用配置
server:
  port: 8080
  context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_ready
    username: app_user
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 0

logging:
  level:
    root: INFO
    com.example: DEBUG
  file:
    name: logs/app/application.log
    max-size: 10MB
    max-history: 30
