# Docker Compose优化配置 - Sprint 29监控告警模块
# 文件名: docker-compose.monitoring-optimized.yml
# 版本: v2.0.0-optimized
# 更新日期: 2026-04-26
# 优化重点: 健康检查、资源限制、部署成功率

version: '3.8'

networks:
  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      device: /data/prometheus
      o: bind
  grafana-data:
    driver: local
    driver_opts:
      type: none
      device: /data/grafana
      o: bind
  alertmanager-data:
    driver: local
    driver_opts:
      type: none
      device: /data/alertmanager
      o: bind
  victoria-metrics-data:
    driver: local

services:
  # ===========================================
  # Prometheus - 优化配置
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus-optimized
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-optimized.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--storage.tsdb.wal-compression'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.external-url=https://prometheus.ai-ready.local'
      - '--web.route-prefix=/'
    networks:
      - monitoring-network
    # 健康检查优化（部署成功率关键）
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 资源限制优化（防止OOM）
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      # 重启策略优化
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    # 日志限制优化
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "app=monitoring"
      - "component=prometheus"
      - "version=v2.0.0-optimized"

  # ===========================================
  # Grafana - 优化配置
  # ===========================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana-optimized
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/grafana-config-optimized.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD}
      - GF_DATABASE_MAX_OPEN_CONN=50
      - GF_DATABASE_MAX_IDLE_CONN=25
      - GF_SESSION_PROVIDER=redis
      - GF_SESSION_PROVIDER_CONFIG=addr=redis:6379,pool_size=50,db=1
      - GF_CACHE_ENABLED=true
      - GF_CACHE_TYPE=redis
      - GF_CACHE_REDIS_ADDR=redis:6379
      - GF_CACHE_REDIS_DB=2
      - GF_INSTALL_PLUGINS=redis-datasource
    networks:
      - monitoring-network
    # 健康检查优化
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # 资源限制优化
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "app=monitoring"
      - "component=grafana"
      - "version=v2.0.0-optimized"

  # ===========================================
  # Alertmanager - 优化配置
  # ===========================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager-optimized
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager-optimized.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alertmanager.ai-ready.local'
      - '--cluster.listen-address='
    networks:
      - monitoring-network
    # 健康检查优化
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 资源限制优化
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      - "app=monitoring"
      - "component=alertmanager"
      - "version=v2.0.0-optimized"

  # ===========================================
  # VictoriaMetrics - 远程存储优化
  # ===========================================
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoria-metrics-optimized
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--retentionPeriod=90d'  # 90天长期存储
      - '--maxConcurrentInserts=50'
      - '--memory.allowedPercent=80'
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    labels:
      - "app=monitoring"
      - "component=victoria-metrics"

  # ===========================================
  # Node Exporter - 节点指标采集
  # ===========================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-optimized
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth.*)$$'
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # ===========================================
  # Blackbox Exporter - 黑盒探测
  # ===========================================
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter-optimized
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ===========================================
  # Pushgateway - 批处理任务指标
  # ===========================================
  pushgateway:
    image: prom/pushgateway:latest
    container_name: pushgateway-optimized
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

# ===========================================
# 部署优化总结
# ===========================================
# 1. 健康检查：所有服务配置健康检查，启动周期60秒
# 2. 资源限制：CPU/内存限制，防止OOM和资源争抢
# 3. 重启策略：on-failure，最多5次重启
# 4. 日志限制：限制日志大小，防止磁盘满
# 5. 网络优化：独立网络，避免端口冲突
# 6. 存储优化：数据持久化，VictoriaMetrics长期存储