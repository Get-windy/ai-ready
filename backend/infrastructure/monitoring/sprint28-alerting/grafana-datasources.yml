# Grafana 数据源配置
# 版本: v1.0
# 最后更新: 2026-04-26

apiVersion: 1

datasources:
  # Prometheus 数据源
  - name: 'Sprint28-Prometheus'
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.45.0"
      cacheLevel: 'High'
      incrementalQuerying: true
      incrementalQueryOverlapWindow: 10m

  # AlertManager 数据源
  - name: 'Sprint28-AlertManager'
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      implementation: prometheus
