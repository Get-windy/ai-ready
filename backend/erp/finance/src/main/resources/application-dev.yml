# ERP Finance Module - Configuration for Development Environment
# 开发环境配置

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/devdb?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: devuser
    password: devuser123
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
  rabbitmq:
