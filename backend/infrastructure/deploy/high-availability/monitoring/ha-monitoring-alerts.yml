# AI-Ready 测试环境高可用架构监控告警规则
# Prometheus Alertmanager 配置

global:
  # Slack Webhook URL
  # slack_api_url: 'https://hooks.slack.com/services/...'

  # 邮件配置
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'monitoring@ai-ready.local'
  smtp_auth_username: 'monitoring@ai-ready.local'
  smtp_auth_password: 'password'

  # 全局配置
  smtp_require_tls: true
  resolve_timeout: 5m

# 路由配置
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'team-email'

  # 子路由 - 严重告警立即通知
  routes:
    - match:
        severity: critical
      receiver: 'team-pager'
      group_wait: 10s
      repeat_interval: 5m
    - match:
        severity: warning
      receiver: 'team-email'
      group_wait: 30s
      repeat_interval: 12h
    - match:
        service: 'database'
      receiver: 'dba-team'
    - match:
        service: 'loadbalancer'
      receiver: 'ops-team'

# 接收器配置
receivers:
  - name: 'team-pager'
    email_configs:
      - to: 'ops-team@ai-ready.local'
        headers:
          subject: '[CRITICAL] AI-Ready 测试环境告警'
    # slack_configs:
    #   - channel: '#alerts-critical'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ .CommonAnnotations.description }}'

  - name: 'team-email'
    email_configs:
      - to: 'team@ai-ready.local'
        headers:
          subject: '[WARNING] AI-Ready 测试环境告警'

  - name: 'dba-team'
    email_configs:
      - to: 'dba@ai-ready.local'
        headers:
          subject: '[DATABASE] AI-Ready 数据库告警'

  - name: 'ops-team'
    email_configs:
      - to: 'ops@ai-ready.local'
        headers:
          subject: '[OPS] AI-Ready 运维告警'

# 告警抑制规则
inhibit_rules:
  # 当整个节点宕机时，抑制该节点上的所有服务告警
  - source_match:
      severity: 'critical'
      alertname: 'NodeDown'
    target_match:
      severity: 'warning'
    equal: ['instance']

  # 当数据库宕机时，抑制依赖数据库的应用告警
  - source_match:
      severity: 'critical'
      service: 'database'
    target_match:
      severity: 'warning'
    equal: ['cluster']