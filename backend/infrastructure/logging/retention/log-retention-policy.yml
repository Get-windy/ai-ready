# 日志滚动和清理策略配置
# 版本: 1.0.0
# 环境: test
# Sprint: 27+1

apiVersion: v1
kind: ConfigMap
metadata:
  name: log-retention-policy
  namespace: logging-test
  labels:
    environment: test
    component: logging
    type: retention-policy
data:
  # 全局保留策略
  global-retention-policy.json: |
    {
      "policy": {
        "name": "global-log-retention",
        "description": "测试环境全局日志保留策略",
        "environment": "test",
        "default_retention_days": 30,
        "rules": [
          {
            "category": "error_logs",
            "description": "错误级别日志保留更长时间",
            "retention_days": 90,
            "compression_enabled": true,
            "archival_enabled": false,
            "priority": "high"
          },
          {
            "category": "security_logs",
            "description": "安全相关日志保留更长时间",
            "retention_days": 180,
            "compression_enabled": true,
            "archival_enabled": true,
            "priority": "critical"
          },
          {
            "category": "audit_logs",
            "description": "审计日志保留最长时间",
            "retention_days": 365,
            "compression_enabled": true,
            "archival_enabled": true,
            "priority": "critical"
          },
          {
            "category": "debug_logs",
            "description": "调试级别日志保留最短时间",
            "retention_days": 7,
            "compression_enabled": false,
            "archival_enabled": false,
            "priority": "low"
          },
          {
            "category": "access_logs",
            "description": "访问日志保留中等时间",
            "retention_days": 30,
            "compression_enabled": true,
            "archival_enabled": false,
            "priority": "medium"
          }
        ]
      }
    }
  
  # 基于应用的保留策略
  application-retention-policy.yml: |
    application_policies:
      # AI模块日志策略
      ai_module:
        application_name: "ai-module"
        retention_days: 60
        compression: true
        archival: false
        index_pattern: "logs-ai-*"
        special_rules:
          - pattern: ".*model.*training.*"
            retention_days: 180
            description: "模型训练日志需要长期保留"
          - pattern: ".*inference.*error.*"
            retention_days: 90
            description: "推理错误日志需要中期保留"
      
      # 后端服务日志策略
      backend_service:
        application_name: "ai-ready-backend"
        retention_days: 30
        compression: true
        archival: false
        index_pattern: "logs-backend-*"
        special_rules:
          - pattern: ".*transaction.*failed.*"
            retention_days: 90
            description: "交易失败日志需要中期保留"
          - pattern: ".*authentication.*"
            retention_days: 180
            description: "认证日志需要长期保留"
      
      # 前端服务日志策略
      frontend_service:
        application_name: "ai-ready-frontend"
        retention_days: 14
        compression: false
        archival: false
        index_pattern: "logs-frontend-*"
        special_rules:
          - pattern: ".*security.*violation.*"
            retention_days: 90
            description: "安全违规日志需要中期保留"
          - pattern: ".*performance.*issue.*"
            retention_days: 30
            description: "性能问题日志需要中期保留"
      
      # 数据库日志策略
      database:
        application_name: "postgresql"
        retention_days: 30
        compression: true
        archival: true
        index_pattern: "logs-db-*"
        special_rules:
          - pattern: ".*slow.*query.*"
            retention_days: 60
            description: "慢查询日志需要中期保留"
          - pattern: ".*deadlock.*"
            retention_days: 90
            description: "死锁日志需要长期保留"
      
      # 监控日志策略
      monitoring:
        application_name: "prometheus|grafana|alertmanager"
        retention_days: 30
        compression: true
        archival: false
        index_pattern: "logs-monitoring-*"
        special_rules:
          - pattern: ".*alert.*triggered.*"
            retention_days: 90
            description: "告警触发日志需要中期保留"
          - pattern: ".*metric.*anomaly.*"
            retention_days: 60
            description: "指标异常日志需要中期保留"
  
  # 滚动策略配置
  rolling-policy.yml: |
    rolling_policies:
      # 基于大小的滚动
      size_based_rolling:
        enabled: true
        max_file_size: "100MB"
        max_total_size: "1GB"
        file_count: 10
        compression: true
        compression_format: "gz"
        apply_to:
          - "application_logs"
          - "access_logs"
          - "system_logs"
      
      # 基于时间的滚动
      time_based_rolling:
        enabled: true
        interval: "daily"
        max_history: 30
        compression: true
        date_pattern: "yyyy-MM-dd"
        apply_to:
          - "audit_logs"
          - "security_logs"
          - "error_logs"
      
      # 基于大小的归档
      size_based_archival:
        enabled: true
        threshold_size: "10GB"
        archive_path: "/var/log/archives"
        archive_format: "tar.gz"
        retention_days: 365
        apply_to:
          - "debug_logs"
          - "trace_logs"
      
      # 基于模式的清理
      pattern_based_cleanup:
        enabled: true
        patterns:
          - pattern: "*.log.*.gz"
            max_age_days: 90
            recursive: true
          - pattern: "*.log.*.tar.gz"
            max_age_days: 365
            recursive: true
          - pattern: "*.tmp"
            max_age_days: 1
            recursive: true
  
  # 清理脚本配置
  cleanup-script.sh: |
    #!/bin/bash
    # 日志清理脚本
    # 版本: 1.0.0
    # 环境: test
    
    set -e
    
    # 配置变量
    LOG_DIR="/var/log"
    ARCHIVE_DIR="/var/log/archives"
    RETENTION_DAYS=30
    ARCHIVE_RETENTION_DAYS=365
    COMPRESSION_FORMAT="gz"
    
    # 颜色定义
    RED='\033[0;31m'
    GREEN='\033[0;32m'
    YELLOW='\033[1;33m'
    BLUE='\033[0;34m'
    NC='\033[0m' # No Color
    
    # 日志函数
    log_info() {
        echo -e "${BLUE}[INFO]${NC} $1"
    }
    
    log_success() {
        echo -e "${GREEN}[SUCCESS]${NC} $1"
    }
    
    log_warning() {
        echo -e "${YELLOW}[WARNING]${NC} $1"
    }
    
    log_error() {
        echo -e "${RED}[ERROR]${NC} $1"
    }
    
    # 检查目录
    check_directories() {
        log_info "检查目录..."
        
        if [ ! -d "$LOG_DIR" ]; then
            log_error "日志目录不存在: $LOG_DIR"
            exit 1
        fi
        
        if [ ! -d "$ARCHIVE_DIR" ]; then
            log_warning "归档目录不存在，创建: $ARCHIVE_DIR"
            mkdir -p "$ARCHIVE_DIR"
        fi
        
        log_success "目录检查完成"
    }
    
    # 清理旧日志文件
    cleanup_old_logs() {
        log_info "清理过期日志文件..."
        
        local deleted_count=0
        local skipped_count=0
        
        # 查找并删除过期日志文件
        find "$LOG_DIR" -name "*.log" -type f -mtime +$RETENTION_DAYS | while read -r file; do
            if [ -f "$file" ]; then
                log_info "删除过期日志: $file"
                rm -f "$file"
                deleted_count=$((deleted_count + 1))
            fi
        done
        
        # 查找并删除过期压缩日志
        find "$LOG_DIR" -name "*.log.$COMPRESSION_FORMAT" -type f -mtime +$RETENTION_DAYS | while read -r file; do
            if [ -f "$file" ]; then
                log_info "删除过期压缩日志: $file"
                rm -f "$file"
                deleted_count=$((deleted_count + 1))
            fi
        done
        
        log_success "清理完成: 删除 $deleted_count 个文件, 跳过 $skipped_count 个文件"
    }
    
    # 压缩旧日志
    compress_old_logs() {
        log_info "压缩旧日志文件..."
        
        local compressed_count=0
        
        # 查找需要压缩的日志文件（超过7天未修改）
        find "$LOG_DIR" -name "*.log" -type f -mtime +7 -size +1M | while read -r file; do
            if [ -f "$file" ]; then
                local compressed_file="${file}.${COMPRESSION_FORMAT}"
                if [ ! -f "$compressed_file" ]; then
                    log_info "压缩日志: $file"
                    gzip -c "$file" > "$compressed_file" && rm -f "$file"
                    compressed_count=$((compressed_count + 1))
                fi
            fi
        done
        
        log_success "压缩完成: 处理 $compressed_count 个文件"
    }
    
    # 归档旧压缩日志
    archive_old_compressed_logs() {
        log_info "归档旧压缩日志..."
        
        local archived_count=0
        
        # 查找需要归档的压缩日志（超过30天）
        find "$LOG_DIR" -name "*.log.$COMPRESSION_FORMAT" -type f -mtime +30 | while read -r file; do
            if [ -f "$file" ]; then
                local filename=$(basename "$file")
                local archive_date=$(date +%Y%m%d)
                local archive_file="$ARCHIVE_DIR/logs-${archive_date}.tar"
                
                log_info "归档文件: $file"
                tar -rf "$archive_file" -C "$(dirname "$file")" "$filename" && rm -f "$file"
                archived_count=$((archived_count + 1))
            fi
        done
        
        # 压缩归档文件
        if [ -f "$ARCHIVE_DIR/logs-$(date +%Y%m%d).tar" ]; then
            log_info "压缩归档文件..."
            gzip "$ARCHIVE_DIR/logs-$(date +%Y%m%d).tar"
        fi
        
        log_success "归档完成: 处理 $archived_count 个文件"
    }
    
    # 清理旧归档文件
    cleanup_old_archives() {
        log_info "清理旧归档文件..."
        
        local deleted_archives=0
        
        # 删除过期的归档文件
        find "$ARCHIVE_DIR" -name "*.tar.gz" -type f -mtime +$ARCHIVE_RETENTION_DAYS | while read -r file; do
            if [ -f "$file" ]; then
                log_info "删除旧归档: $file"
                rm -f "$file"
                deleted_archives=$((deleted_archives + 1))
            fi
        done
        
        log_success "归档清理完成: 删除 $deleted_archives 个文件"
    }
    
    # 生成报告
    generate_report() {
        log_info "生成清理报告..."
        
        local report_file="/var/log/cleanup-report-$(date +%Y%m%d-%H%M%S).txt"
        
        cat > "$report_file" << EOF
# 日志清理报告
## 清理时间: $(date)
## 环境: test
## 脚本: $(basename "$0")

## 目录信息
- 日志目录: $LOG_DIR
- 归档目录: $ARCHIVE_DIR
- 保留天数: $RETENTION_DAYS 天
- 归档保留天数: $ARCHIVE_RETENTION_DAYS 天

## 磁盘使用情况
\`\`\`bash
# 清理前磁盘使用
df -h $LOG_DIR

# 日志目录大小
du -sh $LOG_DIR
du -sh $LOG_DIR/* 2>/dev/null | sort -hr

# 归档目录大小
du -sh $ARCHIVE_DIR
\`\`\`

## 文件统计
\`\`\`bash
# 日志文件数量
find $LOG_DIR -name "*.log" -type f | wc -l
find $LOG_DIR -name "*.log.$COMPRESSION_FORMAT" -type f | wc -l

# 归档文件数量
find $ARCHIVE_DIR -name "*.tar.gz" -type f | wc -l
\`\`\`

## 清理建议
1. 定期运行此脚本（建议每天一次）
2. 监控磁盘使用情况
3. 根据业务需求调整保留策略
4. 定期检查归档文件的完整性

## 维护说明
此脚本是自动化日志清理系统的一部分，用于管理测试环境的日志存储。
EOF
        
        log_success "报告已生成: $report_file"
    }
    
    # 主函数
    main() {
        echo "=========================================="
        echo "  日志清理脚本"
        echo "  环境: test | Sprint: 27+1"
        echo "=========================================="
        echo ""
        
        # 检查目录
        check_directories
        
        # 执行清理步骤
        cleanup_old_logs
        compress_old_logs
        archive_old_compressed_logs
        cleanup_old_archives
        
        # 生成报告
        generate_report
        
        log_success "日志清理完成"
    }
    
    # 执行主函数
    main "$@"
  
  # CronJob配置
  cleanup-cronjob.yml: |
    apiVersion: batch/v1beta1
    kind: CronJob
    metadata:
      name: log-cleanup
      namespace: logging-test
      labels:
        environment: test
        component: logging
        app: cleanup
    spec:
      schedule: "0 3 * * *"  # 每天凌晨3点运行
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 300
      jobTemplate:
        spec:
          template:
            spec:
              containers:
              - name: cleanup
                image: alpine:3.18
                command:
                - /bin/sh
                - -c
                - |
                  # 安装必要工具
                  apk add --no-cache bash findutils gzip tar
                  
                  # 复制清理脚本
                  cp /config/cleanup-script.sh /tmp/cleanup-script.sh
                  chmod +x /tmp/cleanup-script.sh
                  
                  # 执行清理
                  /tmp/cleanup-script.sh
                  
                  # 记录执行结果
                  echo "Cleanup completed at $(date)"
                volumeMounts:
                - name: log-dir
                  mountPath: /var/log
                - name: archive-dir
                  mountPath: /var/log/archives
                - name: config
                  mountPath: /config
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi
              restartPolicy: OnFailure
              volumes:
              - name: log-dir
                hostPath:
                  path: /var/log
                  type: Directory
              - name: archive-dir
                hostPath:
                  path: /var/log/archives
                  type: DirectoryOrCreate
              - name: config
                configMap:
                  name: log-retention-policy
                  items:
                  - key: cleanup-script.sh
                    path: cleanup-script.sh
  
  # 监控配置
  retention-monitoring.yml: |
    monitoring:
      enabled: true
      metrics:
        - name: log_files_total
          type: gauge
          description: "日志文件总数"
          query: |
            count(files{path=~"/var/log/.*\\.log.*"})
        
        - name: log_disk_usage_bytes
          type: gauge
          description: "日志磁盘使用量"
          query: |
            filesystem_size{path="/var/log"} - filesystem_free{path="/var/log"}
        
        - name: log_retention_days
          type: gauge
          description: "日志保留天数"
          query: |
            30  # 默认保留天数
        
        - name: cleanup_job_success
          type: counter
          description: "清理作业成功次数"
        
        - name: cleanup_job_failure
          type: counter
          description: "清理作业失败次数"
      
      alerts:
        - alert: HighLogDiskUsage
          expr: log_disk_usage_bytes / filesystem_size{path="/var/log"} * 100 > 80
          for: 5m
          labels:
            severity: warning
            environment: test
          annotations:
            summary: "日志磁盘使用率过高"
            description: "日志目录磁盘使用率超过80%，当前为 {{ $value }}%"
            runbook_url: "https://wiki.ai-ready.local/logging/disk-cleanup"
        
        - alert: CleanupJobFailed
          expr: rate(cleanup_job_failure[1h]) > 0
          for: 10m
          labels:
            severity: critical
            environment: test
          annotations:
            summary: "日志清理作业失败"
            description: "日志清理作业连续失败，可能导致磁盘空间不足"
            runbook_url: "https://wiki.ai-ready.local/logging/cleanup-failure"
        
        - alert: TooManyLogFiles
          expr: log_files_total > 10000
          for: 5m
          labels:
            severity: warning
            environment: test
          annotations:
            summary: "日志文件数量过多"
            description: "日志文件数量超过10000个，当前为 {{ $value }} 个"
            runbook_url: "https://wiki.ai-ready.local/logging/file-management"