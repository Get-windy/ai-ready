# PostgreSQL 主从复制配置
# 扩展 AI-Ready 测试环境的 PostgreSQL 数据库集群，提供主从复制功能
# 创建日期: 2026-04-24
# 版本: v1.0.0

version: '3.8'

# ==================== 数据卷配置 ====================
volumes:
  # PostgreSQL 从节点数据卷
  postgres-main-replica1-data:
    driver: local
  postgres-main-replica2-data:
    driver: local
  postgres-finance-replica1-data:
    driver: local
  postgres-finance-replica2-data:
    driver: local
  postgres-inventory-replica1-data:
    driver: local
  postgres-inventory-replica2-data:
    driver: local
  postgres-ai-replica1-data:
    driver: local
  postgres-ai-replica2-data:
    driver: local
  postgres-data-replica1-data:
    driver: local
  postgres-data-replica2-data:
    driver: local

# ==================== 服务配置 ====================
services:
  # ============ PostgreSQL 主从复制 - Main 数据库 ============
  postgres-main-replica1:
    image: postgres:14-alpine
    container_name: ai-ready-postgres-main-replica1-test
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_pass_2026
      POSTGRES_DB: gateway_db
      PGDATA: /var/lib/postgresql/data/pgdata
      REPLICATION_USER: repuser_gateway
      REPLICATION_PASSWORD: rep_pass_2026
      PRIMARY_HOST: postgres-main
      PRIMARY_PORT: 5432
      REPLICATION_MODE: async
    volumes:
      - postgres-main-replica1-data:/var/lib/postgresql/data
      - ./scripts/postgresql-replication/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
      - ./scripts/postgresql-replication/promote-replica.sh:/docker-entrypoint-initdb.d/promote-replica.sh:ro
    networks:
      - ai-ready-test-net
    depends_on:
      postgres-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c hot_standby_feedback=on

  postgres-main-replica2:
    image: postgres:14-alpine
    container_name: ai-ready-postgres-main-replica2-test
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_pass_2026
      POSTGRES_DB: gateway_db
      PGDATA: /var/lib/postgresql/data/pgdata
      REPLICATION_USER: repuser_gateway
      REPLICATION_PASSWORD: rep_pass_2026
      PRIMARY_HOST: postgres-main
      PRIMARY_PORT: 5432
      REPLICATION_MODE: async
    volumes:
      - postgres-main-replica2-data:/var/lib/postgresql/data
      - ./scripts/postgresql-replication/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
      - ./scripts/postgresql-replication/promote-replica.sh:/docker-entrypoint-initdb.d/promote-replica.sh:ro
    networks:
      - ai-ready-test-net
