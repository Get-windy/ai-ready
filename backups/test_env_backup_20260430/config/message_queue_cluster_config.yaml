# Sprint 27+1 测试环境消息队列集群配置
# Kafka/RabbitMQ集群配置，支持消息Topic、分区、消费者组

# 消息队列类型选择
message_queue:
  type: "kafka"  # 可选: kafka, rabbitmq, pulsar
  version: "3.5.0"
  mode: "cluster"  # 集群模式
  
  # Kafka集群配置
  kafka_cluster:
    brokers:
      - id: "broker-1"
        host: "localhost"
        port: 9092
        rack: "rack-1"
        role: "controller"  # 控制器节点
        
      - id: "broker-2"
        host: "localhost"
        port: 9093
        rack: "rack-1"
        role: "broker"
        
      - id: "broker-3"
        host: "localhost"
        port: 9094
        rack: "rack-2"
        role: "broker"
    
    zookeeper:
      enabled: true
      nodes:
        - host: "localhost"
          port: 2181
        - host: "localhost"
          port: 2182
        - host: "localhost"
          port: 2183
      connection_timeout: 6000
      session_timeout: 6000
    
    controller:
      quorum_voters: "1@localhost:9092,2@localhost:9093,3@localhost:9094"
      listener_names: "CONTROLLER"
      election_timeout_ms: 10000
    
    security:
      ssl_enabled: false
      sasl_enabled: false
      authentication_type: "none"
    
    performance:
      num_io_threads: 8
      num_network_threads: 3
      num_replica_fetchers: 2
      socket_send_buffer_bytes: 102400
      socket_receive_buffer_bytes: 102400
      socket_request_max_bytes: 104857600

# Topic配置
topics:
  # 用户事件Topic
  - name: "user-events"
    partitions: 3
    replication_factor: 2
    retention_hours: 168  # 7天
    cleanup_policy: "delete"
    
    config:
      min.insync.replicas: 2
      compression.type: "snappy"
      max.message.bytes: 1048576  # 1MB
      retention.bytes: 1073741824  # 1GB
      
    partitions_assignment:
      - partition: 0
        leader: "broker-1"
        replicas: ["broker-1", "broker-2"]
      - partition: 1
        leader: "broker-2"
        replicas: ["broker-2", "broker-3"]
      - partition: 2
        leader: "broker-3"
        replicas: ["broker-3", "broker-1"]
  
  # 订单事件Topic
  - name: "order-events"
    partitions: 6
    replication_factor: 2
    retention_hours: 720  # 30天
    cleanup_policy: "delete"
    
    config:
      min.insync.replicas: 2
      compression.type: "lz4"
      max.message.bytes: 5242880  # 5MB
      retention.bytes: 5368709120  # 5GB
      
    partitions_assignment:
      - partition: 0
        leader: "broker-1"
        replicas: ["broker-1", "broker-2"]
      - partition: 1
        leader: "broker-2"
        replicas: ["broker-2", "broker-3"]
      - partition: 2
        leader: "broker-3"
        replicas: ["broker-3", "broker-1"]
      - partition: 3
        leader: "broker-1"
        replicas: ["broker-1", "broker-3"]
      - partition: 4
        leader: "broker-2"
        replicas: ["broker-2", "broker-1"]
      - partition: 5
        leader: "broker-3"
        replicas: ["broker-3", "broker-2"]
  
  # 库存事件Topic
  - name: "inventory-events"
    partitions: 4
    replication_factor: 2
    retention_hours: 336  # 14天
    cleanup_policy: "compact,delete"  # 压缩+删除
    
    config:
      min.insync.replicas: 2
      compression.type: "zstd"
      max.message.bytes: 2097152  # 2MB
      retention.bytes: 2147483648  # 2GB
      cleanup.policy: "compact,delete"
      delete.retention.ms: 86400000  # 1天
  
  # 监控指标Topic
  - name: "monitoring-metrics"
    partitions: 1
    replication_factor: 3
    retention_hours: 24  # 1天
    cleanup_policy: "delete"
    
    config:
      min.insync.replicas: 2
      compression.type: "none"
      max.message.bytes: 10485760  # 10MB
      retention.bytes: 10737418240  # 10GB
  
  # 死信队列Topic
  - name: "dlq"
    partitions: 3
    replication_factor: 2
    retention_hours: 720  # 30天
    cleanup_policy: "delete"
    
    config:
      min.insync.replicas: 2
      compression.type: "none"
      max.message.bytes: 10485760

# 消费者组配置
consumer_groups:
  # 用户服务消费者组
  - name: "user-service-group"
    topics: ["user-events"]
    consumers: 3
    auto_offset_reset: "latest"
    enable_auto_commit: true
    auto_commit_interval_ms: 5000
    
    config:
      max.poll.records: 500
      max.poll.interval.ms: 300000  # 5分钟
      session.timeout.ms: 10000
      heartbeat.interval.ms: 3000
      fetch.min.bytes: 1
      fetch.max.bytes: 52428800  # 50MB
      fetch.max.wait.ms: 500
      isolation.level: "read_committed"
    
    partition_assignment_strategy: "roundrobin"
    rebalance_timeout_ms: 60000
    
  # 订单服务消费者组
  - name: "order-service-group"
    topics: ["order-events", "inventory-events"]
    consumers: 6
    auto_offset_reset: "earliest"
    enable_auto_commit: false  # 手动提交
    
    config:
      max.poll.records: 1000
      max.poll.interval.ms: 300000
      session.timeout.ms: 10000
      heartbeat.interval.ms: 3000
      fetch.min.bytes: 1024
      fetch.max.bytes: 104857600  # 100MB
      fetch.max.wait.ms: 500
    
    partition_assignment_strategy: "range"
    rebalance_timeout_ms: 120000
    
  # 监控服务消费者组
  - name: "monitoring-service-group"
    topics: ["monitoring-metrics", "user-events", "order-events", "inventory-events"]
    consumers: 2
    auto_offset_reset: "latest"
    enable_auto_commit: true
    auto_commit_interval_ms: 10000
    
    config:
      max.poll.records: 10000
      max.poll.interval.ms: 600000  # 10分钟
      session.timeout.ms: 30000
      heartbeat.interval.ms: 10000
      fetch.min.bytes: 10240
      fetch.max.bytes: 104857600
    
    partition_assignment_strategy: "sticky"
    rebalance_timeout_ms: 180000

# 生产者配置
producers:
  # 用户服务生产者
  - name: "user-service-producer"
    topics: ["user-events"]
    acks: "all"  # 确保消息持久化
    compression_type: "snappy"
    batch_size: 16384  # 16KB
    linger_ms: 5
    buffer_memory: 33554432  # 32MB
    
    config:
      max.request.size: 1048576  # 1MB
      request.timeout.ms: 30000
      delivery.timeout.ms: 120000
      enable.idempotence: true
      max.in.flight.requests.per.connection: 5
      retries: 2147483647  # Integer.MAX_VALUE
      retry.backoff.ms: 100
    
    transactional:
      enabled: true
      transaction_timeout_ms: 60000
      transactional_id: "user-service-tx"
  
  # 订单服务生产者
  - name: "order-service-producer"
    topics: ["order-events", "inventory-events"]
    acks: "all"
    compression_type: "lz4"
    batch_size: 32768  # 32KB
    linger_ms: 10
    buffer_memory: 67108864  # 64MB
    
    config:
      max.request.size: 5242880  # 5MB
      request.timeout.ms: 60000
      delivery.timeout.ms: 180000
      enable.idempotence: true
      max.in.flight.requests.per.connection: 1  # 保证顺序
      retries: 10
      retry.backoff.ms: 1000
    
    transactional:
      enabled: true
      transaction_timeout_ms: 120000
      transactional_id: "order-service-tx"
  
  # 监控服务生产者
  - name: "monitoring-service-producer"
    topics: ["monitoring-metrics"]
    acks: "1"  # 快速写入
    compression_type: "none"
    batch_size: 16384
    linger_ms: 0
    buffer_memory: 16777216  # 16MB
    
    config:
      max.request.size: 10485760  # 10MB
      request.timeout.ms: 5000
      delivery.timeout.ms: 30000
      enable.idempotence: false
      max.in.flight.requests.per.connection: 5
      retries: 3
      retry.backoff.ms: 100
    
    transactional:
      enabled: false

# 消息处理策略
message_processing:
  # 重试策略
  retry_policy:
    max_attempts: 3
    backoff_multiplier: 2.0
    initial_interval_ms: 1000
    max_interval_ms: 10000
    random_factor: 0.5
    
  # 死信队列策略
  dead_letter_queue:
    enabled: true
    max_retries: 3
    dlq_topic: "dlq"
    processing_strategy: "log_and_archive"  # 记录并归档
    
  # 消息去重
  deduplication:
    enabled: true
    window_ms: 300000  # 5分钟
    storage: "redis"
    key_prefix: "msg_dedup:"
    
  # 顺序保证
  ordering_guarantee:
    enabled: true
    strategy: "partition_key"  # 通过分区键保证顺序
    fallback_strategy: "timestamp"

# 监控与追踪配置
monitoring_tracing:
  enabled: true
  
  metrics:
    producer_metrics: true
    consumer_metrics: true
    broker_metrics: true
    topic_metrics: true
    consumer_group_metrics: true
    
    exporters:
      - type: "prometheus"
        port: 9091
        scrape_interval: 15
        
      - type: "jmx"
        port: 9999
        
  tracing:
    enabled: true
    type: "opentelemetry"
    sampling_rate: 0.1
    exporters:
      - type: "jaeger"
        endpoint: "http://localhost:14268/api/traces"
        
  logging:
    enabled: true
    level: "INFO"
    log_dirs: ["/tmp/kafka-logs"]
    log_retention_hours: 168  # 7天
    log_retention_bytes: 10737418240  # 10GB
    
  alerting:
    enabled: true
    thresholds:
      producer_latency_ms: 1000
      consumer_lag: 1000
      broker_cpu_usage: 80  # 百分比
      broker_memory_usage: 85
      disk_usage: 90
      under_replicated_partitions: 1
      offline_partitions: 0
    
    channels:
      - type: "email"
        recipients: ["kafka-admin@example.com"]
      - type: "slack"
        channel: "#kafka-alerts"

# 测试配置
testing:
  # 性能测试
  performance_testing:
    enabled: true
    producers: 3
    consumers: 3
    messages_per_second: 1000
    message_size_bytes: 1024
    duration_seconds: 300
    
  # 容错测试
  fault_tolerance_testing:
    enabled: true
    scenarios:
      - type: "broker_failure"
        broker: "broker-2"
        duration_seconds: 60
        
      - type: "network_partition"
        partitions: ["broker-1", "broker-2"]
        duration_seconds: 120
        
      - type: "zookeeper_failure"
        nodes: ["localhost:2181"]
        duration_seconds: 30
    
  # 数据一致性测试
  consistency_testing:
    enabled: true
    checks:
      - type: "end_to_end_latency"
        max_latency_ms: 5000
        
      - type: "message_loss"
        max_loss_percentage: 0.01  # 0.01%
        
      - type: "duplicate_messages"
        max_duplicate_percentage: 0.1  # 0.1%

# 安全配置
security:
  ssl:
    enabled: false
    keystore_location: "/path/to/keystore.jks"
    keystore_password: "changeit"
    truststore_location: "/path/to/truststore.jks"
    truststore_password: "changeit"
    key_password: "changeit"
    
  sasl:
    enabled: false
    mechanism: "SCRAM-SHA-512"
    username: "kafka-user"
    password: "kafka-password"
    
  acl:
    enabled: false
    authorizer_class: "kafka.security.authorizer.AclAuthorizer"
    
  encryption:
    enabled: false
    algorithm: "AES-256-GCM"

# 环境变量配置
environment_variables:
  KAFKA_BROKERS: "localhost:9092,localhost:9093,localhost:9094"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  KAFKA_ACKS: "all"
  KAFKA_RETRIES: "10"
  KAFKA_BATCH_SIZE: "16384"
  KAFKA_LINGER_MS: "5"
  KAFKA_BUFFER_MEMORY: "33554432"
  
  KAFKA_CONSUMER_GROUP_ID: "test-consumer-group"
  KAFKA_CONSUMER_AUTO_OFFSET_RESET: "latest"
  KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: "true"
  KAFKA_CONSUMER_AUTO_COMMIT_INTERVAL_MS: "5000"
  KAFKA_CONSUMER_MAX_POLL_RECORDS: "500"
  KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS: "300000"
  
  KAFKA_PRODUCER_COMPRESSION_TYPE: "snappy"
  KAFKA_PRODUCER_MAX_REQUEST_SIZE: "1048576"
  KAFKA_PRODUCER_REQUEST_TIMEOUT_MS: "30000"
  KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS: "120000"