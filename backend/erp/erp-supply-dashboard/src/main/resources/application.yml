# Spring Boot Application Configuration
spring:
  application:
    name: erp-supply-dashboard
    description: ERP供应链数据可视化仪表板

  # Server Configuration
  server:
    port: 8085
    servlet:
      context-path: /supply-dashboard
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
      min-response-size: 1024

  # Database Configuration (example - to be customized per environment)
  datasource:
    url: jdbc:mysql://localhost:3306/erp_supply_dashboard?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA Configuration
  jpa:
    database: MYSQL
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: update
    open-in-view: false

  # Redis Configuration
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: -1ms

  # Jackson Configuration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Actuator Configuration
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true

# Application Configuration
app:
  # Dashboard Configuration
  dashboard:
    refresh-interval: 300 # seconds
    data-retention-days: 365
    max-concurrent-calculations: 10
    cache-ttl: 300 # seconds
    batch-size: 1000

  # Metric Calculation Configuration
  metric:
    calculation:
      enabled: true
      schedule: "0 0/5 * * * ?" # Every 5 minutes
      history-recalculation-days: 30
      data-quality-threshold: 80.0
      retry-count: 3
      retry-delay: 5000 # milliseconds

  # Alert Configuration
  alert:
    enabled: true
    notification:
      email:
        enabled: false
      webhook:
        enabled: true
        url: http://localhost:8080/api/alerts
      sms:
        enabled: false
    thresholds:
      warning: 80.0
      critical: 60.0

  # Security Configuration
  security:
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:8080"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true

# Logging Configuration
logging:
  level:
    cn.aiedge.erp.supply.dashboard: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/erp-supply-dashboard.log
    max-size: 10MB
    max-history: 30

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: cn.aiedge.erp.supply.dashboard.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Scheduled Tasks
scheduling:
  enabled: true
  pool:
    size: 5

# Cache Configuration
cache:
  type: redis
  redis:
    time-to-live: 3600000 # 1 hour in milliseconds
    cache-null-values: false
    use-key-prefix: true
    key-prefix: "supply-dashboard:"

# External Service Configuration
external:
  services:
    purchase-service:
      url: http://localhost:8081/purchase
      timeout: 5000
    inventory-service:
      url: http://localhost:8082/inventory
      timeout: 5000
    logistics-service:
      url: http://localhost:8083/logistics
      timeout: 5000
    finance-service:
      url: http://localhost:8084/finance
      timeout: 5000