# 安全配置
security:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-here}
    expiration: 86400000  # 24小时
    
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://example.com
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      
  rate-limiting:
    enabled: true
    requests-per-minute: 100
    burst-capacity: 150
