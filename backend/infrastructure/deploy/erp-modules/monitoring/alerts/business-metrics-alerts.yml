# ERP Business Metrics Alerts
# 业务指标监控告警规则

groups:
  - name: batch_sn_business_alerts
    interval: 30s
    rules:
      # 批次追溯失败告警
      - alert: BatchTraceabilityFailure
        expr: increase(batch_trace_failures_total[1h]) > 10
        for: 5m
        labels:
          severity: critical
          module: batch-sn
          business: traceability
        annotations:
          summary: "批次追溯失败率过高"
          description: "批次追溯在过去1小时内失败{{ $value }}次，影响合规要求"

      # 序列号生成异常告警
      - alert: SerialNumberGenerationError
        expr: rate(serial_number_generation_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          module: batch-sn
          business: generation
        annotations:
          summary: "序列号生成异常"
          description: "序列号生成错误率{{ $value }}，请检查生成逻辑"

  - name: invoice_business_alerts
    interval: 30s
    rules:
      # 发票申请处理延迟告警
      - alert: InvoiceApplicationDelay
        expr: invoice_application_processing_time_seconds_mean > 300
        for: 10m
        labels:
          severity: warning
          module: invoice
          business: processing
        annotations:
          summary: "发票申请处理时间过长"
          description: "发票申请平均处理时间{{ $value }}秒，影响客户满意度"

      # 发票审批超时告警
      - alert: InvoiceApprovalTimeout
        expr: increase(invoice_approval_timeout_total[1h]) > 5
        for: 5m
        labels:
          severity: critical
          module: invoice
          business: approval
        annotations:
          summary: "发票审批超时"
          description: "过去1小时内有{{ $value }}张发票审批超时，请检查审批流程"

      # 发票生成失败告警
      - alert: InvoiceGenerationFailure
        expr: rate(invoice_generation_failures_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          module: invoice
          business: generation
        annotations:
          summary: "发票生成失败率过高"
          description: "发票生成失败率{{ $value | humanizePercentage }}，影响业务流程"

  - name: purchase_exchange_business_alerts
    interval: 30s
    rules:
      # 询价响应延迟告警
      - alert: InquiryResponseDelay
        expr: purchase_inquiry_response_time_seconds_mean > 3600  # 1小时
        for: 15m
        labels:
          severity: warning
          module: purchase-exchange
          business: inquiry
        annotations:
          summary: "采购询价响应时间过长"
          description: "询价平均响应时间{{ $value | humanizeDuration }}，影响采购效率"

      # 报价转化率低告警
      - alert: LowQuoteConversionRate
        expr: purchase_quote_conversion_rate < 0.3
        for: 1h
        labels:
          severity: warning
          module: purchase-exchange
          business: conversion
        annotations:
          summary: "报价转化率过低"
          description: "报价转化率{{ $value | humanizePercentage }}，请分析供应商报价质量"

  - name: sales_exchange_business_alerts
    interval: 30s
    rules:
      # 价格策略冲突告警
      - alert: PriceStrategyConflict
        expr: increase(price_strategy_conflicts_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
          module: sales-exchange
          business: pricing
        annotations:
          summary: "价格策略冲突频繁"
          description: "过去1小时内发生{{ $value }}次价格策略冲突，请优化策略规则"

      # 价格计算错误告警
      - alert: PriceCalculationError
        expr: rate(price_calculation_errors_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
          module: sales-exchange
          business: calculation
        annotations:
          summary: "价格计算错误"
          description: "价格计算错误率{{ $value }}，影响销售订单准确性"

      # 价格生效延迟告警
      - alert: PriceActivationDelay
        expr: price_strategy_activation_time_seconds_mean > 600  # 10分钟
        for: 10m
        labels:
          severity: warning
          module: sales-exchange
          business: activation
        annotations:
          summary: "价格策略生效延迟"
          description: "价格策略平均生效时间{{ $value }}秒，影响销售效率"

  - name: supplier_portal_business_alerts
    interval: 30s
    rules:
      # 供应商登录失败告警
      - alert: SupplierLoginFailure
        expr: rate(supplier_login_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          module: supplier-portal
          business: authentication
        annotations:
          summary: "供应商登录失败率过高"
          description: "供应商登录失败率{{ $value }}，请检查认证服务"

      # 供应商订单确认延迟告警
      - alert: SupplierOrderConfirmationDelay
        expr: supplier_order_confirmation_time_seconds_mean > 7200  # 2小时
        for: 30m
        labels:
          severity: warning
          module: supplier-portal
          business: confirmation
        annotations:
          summary: "供应商订单确认延迟"
          description: "供应商订单确认平均时间{{ $value | humanizeDuration }}，影响供应链效率"

      # 供应商协同失败告警
      - alert: SupplierCollaborationFailure
        expr: increase(supplier_collaboration_errors_total[1h]) > 10
        for: 15m
        labels:
          severity: critical
          module: supplier-portal
          business: collaboration
        annotations:
          summary: "供应商协同失败频繁"
          description: "过去1小时内供应商协同失败{{ $value }}次，影响供应链管理"