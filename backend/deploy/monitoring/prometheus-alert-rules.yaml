# ERP系统 Prometheus 告警规则配置
# 包含应用层、业务层、基础设施层告警规则

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: erp-alert-rules
  namespace: monitoring
  labels:
    app: prometheus
    release: prometheus
spec:
  groups:
  - name: erp-application-alerts
    interval: 30s
    rules:
    - alert: ERPAppHighErrorRate
      expr: rate(http_server_requests_seconds_count{status!~"2..",namespace=~"erp-.*"}[5m]) / rate(http_server_requests_seconds_count{namespace=~"erp-.*"}[5m]) > 0.01
      for: 2m
      labels:
        severity: warning
        team: erp-ops
        component: application
      annotations:
        summary: "ERP应用高错误率 - {{ $labels.instance }}"
        description: "应用错误率超过1% (当前值: {{ $value | humanizePercentage }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-app-high-error-rate"
    
    - alert: ERPAppHighResponseTime
      expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket{namespace=~"erp-.*"}[5m])) > 2
      for: 2m
      labels:
        severity: warning
        team: erp-ops
        component: application
      annotations:
        summary: "ERP应用高响应时间 - {{ $labels.instance }}"
        description: "95%分位响应时间超过2秒 (当前值: {{ $value }}s)"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-app-high-response-time"
    
    - alert: ERPAppJVMHeapUsageHigh
      expr: jvm_memory_used_bytes{area="heap",namespace=~"erp-.*"} / jvm_memory_max_bytes{area="heap",namespace=~"erp-.*"} > 0.8
      for: 2m
      labels:
        severity: warning
        team: erp-ops
        component: application
      annotations:
        summary: "ERP应用JVM堆内存使用率高 - {{ $labels.instance }}"
        description: "JVM堆内存使用率超过80% (当前值: {{ $value | humanizePercentage }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-app-jvm-high-memory"

  - name: erp-business-alerts
    interval: 1m
    rules:
    - alert: ERPBatchCreationFailure
      expr: increase(erp_batch_creation_failed_total{namespace=~"erp-.*"}[5m]) > 0
      for: 1m
      labels:
        severity: critical
        team: erp-business
        component: batch-management
      annotations:
        summary: "ERP批次创建失败 - {{ $labels.instance }}"
        description: "批次创建出现失败 (失败次数: {{ $value }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-batch-creation-failure"
    
    - alert: ERPPurchaseOrderSlow
      expr: histogram_quantile(0.95, rate(erp_purchase_order_process_duration_seconds_bucket{namespace=~"erp-.*"}[5m])) > 30
      for: 2m
      labels:
        severity: warning
        team: erp-business
        component: purchase-management
      annotations:
        summary: "ERP采购订单处理慢 - {{ $labels.instance }}"
        description: "95%分位采购订单处理时间超过30秒 (当前值: {{ $value }}s)"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-purchase-order-slow"
    
    - alert: ERPSalesOrderVolumeDrop
      expr: rate(erp_sales_order_created_total{namespace=~"erp-.*"}[15m]) / rate(erp_sales_order_created_total{namespace=~"erp-.*"}[15m] offset 1h) < 0.5
      for: 5m
      labels:
        severity: warning
        team: erp-business
        component: sales-management
      annotations:
        summary: "ERP销售订单量异常下降 - {{ $labels.instance }}"
        description: "销售订单量相比1小时前下降超过50% (当前比率: {{ $value }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-sales-order-drop"

  - name: erp-infrastructure-alerts
    interval: 30s
    rules:
    - alert: ERPNodeCPUUsageHigh
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      for: 5m
      labels:
        severity: warning
        team: infra-ops
        component: node
      annotations:
        summary: "ERP节点CPU使用率高 - {{ $labels.instance }}"
        description: "节点CPU使用率超过80% (当前值: {{ $value }}%)"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-node-high-cpu"
    
    - alert: ERPNodeMemoryUsageHigh
      expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
      for: 5m
      labels:
        severity: warning
        team: infra-ops
        component: node
      annotations:
        summary: "ERP节点内存使用率高 - {{ $labels.instance }}"
        description: "节点内存使用率超过85% (当前值: {{ $value | humanizePercentage }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-node-high-memory"
    
    - alert: ERPPodRestartFrequently
      expr: rate(kube_pod_container_status_restarts_total{namespace=~"erp-.*"}[15m]) > 0
      for: 2m
      labels:
        severity: warning
        team: infra-ops
        component: pod
      annotations:
        summary: "ERP Pod频繁重启 - {{ $labels.pod }}"
        description: "Pod在15分钟内发生重启 (重启次数: {{ $value }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-pod-frequent-restart"

  - name: erp-database-alerts
    interval: 1m
    rules:
    - alert: ERPDatabaseConnectionError
      expr: mysql_up{namespace="erp-infra"} == 0
      for: 1m
      labels:
        severity: critical
        team: dba-ops
        component: database
      annotations:
        summary: "ERP数据库连接失败"
        description: "MySQL数据库无法连接"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-database-connection-error"
    
    - alert: ERPDatabaseSlowQueries
      expr: rate(mysql_global_status_slow_queries{namespace="erp-infra"}[5m]) > 10
      for: 2m
      labels:
        severity: warning
        team: dba-ops
        component: database
      annotations:
        summary: "ERP数据库慢查询增多 - {{ $labels.instance }}"
        description: "数据库慢查询超过10次/分钟 (当前值: {{ $value }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-database-slow-queries"
    
    - alert: ERPDatabaseHighConnections
      expr: mysql_global_status_threads_connected{namespace="erp-infra"} / mysql_global_variables_max_connections{namespace="erp-infra"} > 0.8
      for: 2m
      labels:
        severity: warning
        team: dba-ops
        component: database
      annotations:
        summary: "ERP数据库连接数过高 - {{ $labels.instance }}"
        description: "数据库连接数超过最大连接数80% (当前值: {{ $value | humanizePercentage }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-database-high-connections"

  - name: erp-ingress-alerts
    interval: 30s
    rules:
    - alert: ERPIngressHighErrorRate
      expr: rate(nginx_ingress_controller_requests{status!~"2..",namespace="ingress-nginx"}[5m]) / rate(nginx_ingress_controller_requests{namespace="ingress-nginx"}[5m]) > 0.05
      for: 2m
      labels:
        severity: warning
        team: infra-ops
        component: ingress
      annotations:
        summary: "ERP Ingress高错误率 - {{ $labels.host }}"
        description: "Ingress错误率超过5% (当前值: {{ $value | humanizePercentage }})"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-ingress-high-error-rate"
    
    - alert: ERPIngressHighLatency
      expr: histogram_quantile(0.95, rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace="ingress-nginx"}[5m])) > 1
      for: 2m
      labels:
        severity: warning
        team: infra-ops
        component: ingress
      annotations:
        summary: "ERP Ingress高延迟 - {{ $labels.host }}"
        description: "95%分位Ingress响应时间超过1秒 (当前值: {{ $value }}s)"
        runbook_url: "http://wiki.aiedge.cn/runbooks/erp-ingress-high-latency"