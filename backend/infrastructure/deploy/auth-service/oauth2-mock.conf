# OAuth2 Mock Service Configuration
# Provides mock OAuth2 endpoints for testing

server {
    listen 80;
    server_name localhost;
    
    # Root endpoint
    location / {
        return 200 '{
            "service": "oauth2-mock",
            "version": "1.0.0",
            "endpoints": {
                "discovery": "/.well-known/openid-configuration",
                "token": "/oauth2/token",
                "authorize": "/oauth2/authorize",
                "userinfo": "/oauth2/userinfo",
                "jwks": "/oauth2/jwks",
                "introspect": "/oauth2/introspect",
                "revoke": "/oauth2/revoke"
            },
            "notes": "This is a mock OAuth2 service for testing. In production, use Keycloak or another OAuth2 provider."
        }';
        add_header Content-Type application/json;
    }
    
    # OpenID Connect Discovery
    location /.well-known/openid-configuration {
        return 200 '{
            "issuer": "http://localhost:8097",
            "authorization_endpoint": "http://localhost:8097/oauth2/authorize",
            "token_endpoint": "http://localhost:8097/oauth2/token",
            "userinfo_endpoint": "http://localhost:8097/oauth2/userinfo",
            "jwks_uri": "http://localhost:8097/oauth2/jwks",
            "scopes_supported": ["openid", "profile", "email", "offline_access"],
            "response_types_supported": ["code", "token", "id_token"],
            "grant_types_supported": ["authorization_code", "client_credentials", "refresh_token"],
            "token_endpoint_auth_methods_supported": ["client_secret_basic", "client_secret_post"],
            "id_token_signing_alg_values_supported": ["RS256"],
            "subject_types_supported": ["public"]
        }';
        add_header Content-Type application/json;
    }
    
    # Token endpoint
    location /oauth2/token {
        if ($request_method != POST) {
            return 405 '{"error":"invalid_request","error_description":"HTTP method not allowed"}';
        }
        
        # Simulate token generation
        set $mock_token "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LXVzZXIiLCJuYW1lIjoiVGVzdCBVc2VyIiwiZW1haWwiOiJ0ZXN0QGV4YW1wbGUuY29tIiwicm9sZXMiOlsiVVNFUiJdLCJleHAiOjE4NzkyNjQ4MDB9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c";
        set $mock_refresh_token "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0LXVzZXIiLCJ0b2tlbl90eXBlIjoicmVmcmVzaCIsImV4cCI6MTg3OTI2NDgwMH0.XYZ123abcdef";
        
        return 200 '{
            "access_token": "$mock_token",
            "token_type": "Bearer",
            "expires_in": 3600,
            "refresh_token": "$mock_refresh_token",
            "scope": "openid profile email",
            "id_token": "$mock_token"
        }';
        add_header Content-Type application/json;
    }
    
    # Userinfo endpoint
    location /oauth2/userinfo {
        if ($http_authorization = "") {
            return 401 '{"error":"unauthorized","error_description":"Missing Authorization header"}';
        }
        
        return 200 '{
            "sub": "test-user",
            "name": "Test User",
            "given_name": "Test",
            "family_name": "User",
            "email": "test@example.com",
            "email_verified": true,
            "preferred_username": "testuser",
            "roles": ["USER"],
            "created_at": 1777482000,
            "updated_at": 1777482000
        }';
        add_header Content-Type application/json;
    }
    
    # JWKS endpoint
    location /oauth2/jwks {
        return 200 '{
            "keys": [
                {
                    "kty": "RSA",
                    "kid": "test-key-1",
                    "use": "sig",
                    "alg": "RS256",
                    "n": "test-modulus",
                    "e": "AQAB"
                }
            ]
        }';
        add_header Content-Type application/json;
    }
    
    # Token introspection
    location /oauth2/introspect {
        if ($request_method != POST) {
            return 405 '{"error":"invalid_request","error_description":"HTTP method not allowed"}';
        }
        
        return 200 '{
            "active": true,
            "scope": "openid profile email",
            "client_id": "test-client",
            "username": "test-user",
            "token_type": "Bearer",
            "exp": 1879264800,
            "iat": 1879261200,
            "sub": "test-user",
            "aud": ["test-client"],
            "iss": "http://localhost:8097"
        }';
        add_header Content-Type application/json;
    }
    
    # Token revocation
    location /oauth2/revoke {
        if ($request_method != POST) {
            return 405 '{"error":"invalid_request","error_description":"HTTP method not allowed"}';
        }
        
        return 200 '{"status":"success","message":"Token revoked successfully"}';
        add_header Content-Type application/json;
    }
    
    # Authorization endpoint (simplified)
    location /oauth2/authorize {
        # For authorization code flow, redirect to callback
        if ($arg_response_type = "code") {
            return 302 $arg_redirect_uri?code=test_auth_code_123&state=$arg_state;
        }
        
        # For implicit flow, return HTML form
        default_type text/html;
        return 200 '<!DOCTYPE html>
        <html>
        <head>
            <title>OAuth2 Authorization</title>
            <style>
                body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
                .container { border: 1px solid #ddd; border-radius: 5px; padding: 20px; }
                h2 { color: #333; }
                .scopes { background: #f5f5f5; padding: 10px; border-radius: 3px; margin: 10px 0; }
                .buttons { margin-top: 20px; }
                button { padding: 10px 20px; margin-right: 10px; cursor: pointer; }
                .approve { background: #4CAF50; color: white; border: none; }
                .deny { background: #f44336; color: white; border: none; }
            </style>
        </head>
        <body>
            <div class="container">
                <h2>Authorize Application</h2>
                <p><strong>Application:</strong> Test Client</p>
                <p><strong>Requested Scopes:</strong></p>
                <div class="scopes">
                    openid - OpenID Connect<br>
                    profile - User profile information<br>
                    email - Email address
                </div>
                <div class="buttons">
                    <button class="approve" onclick="window.location.href=\'$arg_redirect_uri?access_token=test_token_123&token_type=Bearer&expires_in=3600&state=$arg_state\'">Approve</button>
                    <button class="deny" onclick="window.location.href=\'$arg_redirect_uri?error=access_denied&state=$arg_state\'">Deny</button>
                </div>
            </div>
        </body>
        </html>';
    }
    
    # Health check
    location /health {
        return 200 '{"status":"healthy","service":"oauth2-mock","timestamp":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")"}';
        add_header Content-Type application/json;
    }
}