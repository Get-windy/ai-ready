# Spring Boot 配置
server:
  port: 8080

spring:
  application:
    name: ai-ready-gateway
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-header: true
  is-read-cookie: false

# 日志配置
logging:
  level:
    root: INFO
    cn.aiedge: INFO
    org.springframework.cloud.gateway: INFO