global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ai-ready-test-monitor'
    environment: 'test'

# 告警规则文件
rule_files:
  - 'rules/*.yml'

# AlertManager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# 抓取配置
scrape_configs:
  # ========== Prometheus 自身监控 ==========
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ========== 系统资源监控 ==========
  # Node Exporter - 系统资源
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'system'
          monitor_type: 'host'
    scrape_interval: 10s
    scrape_timeout: 5s

  # cAdvisor - 容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'containers'
          monitor_type: 'docker'
    scrape_interval: 15s

  # ========== 应用服务监控 ==========
  # API Gateway 监控
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'
          component: 'application'
    scrape_interval: 5s

  # 库存管理服务监控
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-service:8082']
        labels:
          service: 'inventory'
          component: 'application'
    scrape_interval: 5s

  # 财务管理服务监控
  - job_name: 'finance-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['finance-service:8081']
        labels:
          service: 'finance'
          component: 'application'
    scrape_interval: 5s

  # AI智能服务监控
  - job_name: 'ai-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['ai-service:8083']
        labels:
          service: 'ai'
          component: 'application'
    scrape_interval: 5s

  # 数据管理服务监控
  - job_name: 'data-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['data-service:8084']
        labels:
          service: 'data'
          component: 'application'
    scrape_interval: 5s

  # ========== 数据库监控 ==========
  # PostgreSQL Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          database: 'postgresql'
          component: 'database'
    scrape_interval: 30s

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          database: 'redis'
          component: 'cache'
    scrape_interval: 30s

  # Kafka Exporter
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          messaging: 'kafka'
          component: 'messaging'
    scrape_interval: 30s

  # ========== 日志系统监控 ==========
  # Elasticsearch 监控
  - job_name: 'elasticsearch'
    metrics_path: '/_prometheus/metrics'
    static_configs:
      - targets: ['elasticsearch:9200']
        labels:
          component: 'logging'
    scrape_interval: 30s

  # Logstash 监控
  - job_name: 'logstash'
    metrics_path: '/_node/stats'
    static_configs:
      - targets: ['logstash:9600']
        labels:
          component: 'logging'
    scrape_interval: 30s

  # ========== 原有监控目标 (保留兼容性) ==========
  # PostgreSQL 基础监控 (保留原有配置)
  - job_name: 'postgres-main'
    static_configs:
      - targets: ['postgres-main:5432']
    metrics_path: /metrics

  # Redis 基础监控 (保留原有配置)
  - job_name: 'redis-main'
    static_configs:
      - targets: ['redis-main:6379']
    metrics_path: /scrape

  - job_name: 'redis-inventory'
    static_configs:
      - targets: ['redis-inventory:6379']

  - job_name: 'redis-finance'
    static_configs:
      - targets: ['redis-finance:6379']

  - job_name: 'redis-ai'
    static_configs:
      - targets: ['redis-ai:6379']

  - job_name: 'redis-data'
    static_configs:
      - targets: ['redis-data:6379']

  # Kafka 基础监控 (保留原有配置)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    metrics_path: /metrics

  # Zookeeper 监控 (保留原有配置)
  - job_name: 'zookeeper'
    static_configs:
      - targets: ['zookeeper:2181']