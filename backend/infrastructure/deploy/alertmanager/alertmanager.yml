# AlertManager配置 - 监控告警模块
# 文件名: alertmanager.yml
# 版本: v1.0.0
# 创建日期: 2026-04-27

global:
  # SMTP配置 - 邮件通知
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'monitoring@ai-ready.local'
  smtp_auth_username: 'monitoring@ai-ready.local'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_require_tls: true
  
  # Slack配置
  slack_api_url: '${SLACK_API_URL}'
  
  # 企业微信配置
  wechat_api_url: 'https://qyapi.weixin.qq.com/cgi-bin/gettoken'
  wechat_api_secret: '${WECHAT_SECRET}'
  wechat_api_corp_id: '${WECHAT_CORP_ID}'

# 路由配置 - 告警路由规则
route:
  # 默认路由
  receiver: 'default-receiver'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  
  # 子路由
  routes:
    # 严重告警 - 立即通知
    - receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      matchers:
        - severity = critical
        - severity = emergency
    
    # 警告告警 - 延迟通知
    - receiver: 'warning-alerts'
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 2h
      matchers:
        - severity = warning
    
    # 数据库相关告警
    - receiver: 'database-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      matchers:
        - service =~ "postgres|mysql|redis|mongodb"
      continue: true
    
    # 应用服务告警
    - receiver: 'application-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      matchers:
        - service =~ "api|backend|frontend|monitoring"
      continue: true
    
    # 基础设施告警
    - receiver: 'infrastructure-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      matchers:
        - service =~ "node|docker|kubernetes|network"
      continue: true
    
    # AI模块告警
    - receiver: 'ai-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      matchers:
        - service = "ai-module"
      continue: true
    
    # 移动端告警
    - receiver: 'mobile-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      matchers:
        - service = "mobile-api"
      continue: true

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@ai-ready.local'
        send_resolved: true
        headers:
          subject: '[AI-Ready Monitoring] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.default.html" . }}'
    
    slack_configs:
      - channel: '#monitoring-alerts'
        send_resolved: true
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        icon_emoji: '⚠️'
    
    webhook_configs:
      - url: 'http://monitoring-api-service:8080/api/v1/alerts/webhook'
        send_resolved: true

  # 严重告警接收器
  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall-engineer@ai-ready.local'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.critical.html" . }}'
    
    slack_configs:
      - channel: '#critical-alerts'
      - channel: '@oncall-engineer'
      send_resolved: true
      title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
      text: '{{ range .Alerts }}{{ .Annotations.description }}\nImpact: {{ .Annotations.impact }}\nAction Required: {{ .Annotations.action }}\n{{ end }}'
      icon_emoji: '🚨'
    
    webhook_configs:
      - url: 'http://monitoring-api-service:8080/api/v1/alerts/critical'
        send_resolved: true
    
    wechat_configs:
      - agent_id: '1000002'
        to_user: '@all'
        to_party: '2'
        message: '{{ template "wechat.critical.message" . }}'
        send_resolved: true

  # 警告告警接收器
  - name: 'warning-alerts'
    email_configs:
      - to: 'dev-team@ai-ready.local'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.warning.html" . }}'
    
    slack_configs:
      - channel: '#dev-alerts'
      send_resolved: true
      title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
      text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
      icon_emoji: '⚠️'

  # 数据库团队接收器
  - name: 'database-team'
    email_configs:
      - to: 'dba-team@ai-ready.local'
        send_resolved: true
    
    slack_configs:
      - channel: '#database-alerts'
      send_resolved: true

  # 应用团队接收器
  - name: 'application-team'
    email_configs:
      - to: 'app-dev@ai-ready.local'
        send_resolved: true
    
    slack_configs:
      - channel: '#application-alerts'
      send_resolved: true

  # 基础设施团队接收器
  - name: 'infrastructure-team'
    email_configs:
      - to: 'infra-team@ai-ready.local'
        send_resolved: true
    
    slack_configs:
      - channel: '#infrastructure-alerts'
      send_resolved: true

  # AI团队接收器
  - name: 'ai-team'
    email_configs:
      - to: 'ai-team@ai-ready.local'
        send_resolved: true
    
    slack_configs:
      - channel: '#ai-alerts'
      send_resolved: true

  # 移动端团队接收器
  - name: 'mobile-team'
    email_configs:
      - to: 'mobile-team@ai-ready.local'
        send_resolved: true
    
    slack_configs:
      - channel: '#mobile-alerts'
      send_resolved: true

# 抑制规则 - 减少重复告警
inhibit_rules:
  # 当节点宕机时，抑制该节点上运行的所有服务的告警
  - source_matchers:
      - severity = critical
      - alertname = NodeDown
    target_matchers:
      - severity =~ warning|critical
    equal: ['instance', 'cluster']
  
  # 当数据库宕机时，抑制依赖该数据库的服务告警
  - source_matchers:
      - severity = critical
      - alertname = DatabaseDown
    target_matchers:
      - severity =~ warning|critical
    equal: ['database']
  
  # 当网络故障时，抑制所有网络相关的告警
  - source_matchers:
      - severity = critical
      - alertname = NetworkDown
    target_matchers:
      - severity =~ warning|critical
    equal: ['cluster']

# 模板文件
templates:
  - '/etc/alertmanager/templates/*.tmpl'