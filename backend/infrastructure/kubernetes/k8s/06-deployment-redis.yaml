# Redis 缓存服务 Deployment 配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ai-ready
  labels:
    app: ai-ready
    component: cache
    db: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-ready
      component: cache
      db: redis
  template:
    metadata:
      labels:
        app: ai-ready
        component: cache
        db: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          command:
            - redis-server
            - /usr/local/etc/redis/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-ready-redis-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis
              readOnly: true
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
        - name: redis-data
          emptyDir: {}
---
# Redis 配置文件
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: ai-ready
  labels:
    app: ai-ready
    component: cache
data:
  redis.conf: |
    # 基础配置
    bind 0.0.0.0
    port 6379
    protected-mode yes
    requirepass ${REDIS_PASSWORD}
    
    # 持久化配置
    save 900 1
    save 300 10
    save 60 10000
    dbfilename dump.rdb
    dir /data
    
    # 内存管理
    maxmemory 400mb
    maxmemory-policy allkeys-lru
    
    # 日志配置
    loglevel notice
    
    # 性能优化
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511
    
    # 安全配置
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
