# Kustomization 配置
# 用于管理 K8s 资源配置的变体和叠加

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 命名空间
namespace: ai-ready

# 通用标签
commonLabels:
  app: ai-ready
  managed-by: kustomize

# 通用注解
commonAnnotations:
  version: "1.0.0"
  maintainer: "devops-team"

# 资源列表（按顺序应用）
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 03-deployment-backend.yaml
  - 04-deployment-frontend.yaml
  - 05-deployment-postgres.yaml
  - 06-deployment-redis.yaml
  - 07-service.yaml
  - 08-ingress.yaml
  - 09-hpa.yaml
  - 10-monitoring.yaml

# 镜像替换（生产环境使用）
# images:
#   - name: your-registry.com/ai-ready/backend
#     newTag: v1.0.0
#   - name: your-registry.com/ai-ready/frontend
#     newTag: v1.0.0

# 配置映射（可选）
# configMapGenerator:
#   - name: additional-config
#     literals:
#       - ENV=production

# 密钥生成器（可选）
# secretGenerator:
#   - name: additional-secrets
#     literals:
#       - API_KEY=secret-value

# 补丁（用于环境特定配置）
# patchesStrategicMerge:
#   - overlays/production/deployment-patch.yaml

# 副本数覆盖
# replicas:
#   - name: ai-ready-backend
#     count: 5
#   - name: ai-ready-frontend
#     count: 3
