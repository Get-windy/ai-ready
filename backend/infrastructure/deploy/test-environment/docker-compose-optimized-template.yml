# AI-Ready 测试环境Docker编排优化配置模板
# 版本: 1.0.0
# 日期: 2026-04-30
# 负责人: devops-engineer

version: '3.8'

# 全局配置
x-common-config: &common-config
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      tag: "ai-ready-test-{{.Name}}"
  networks:
    - backend
  healthcheck: &default-healthcheck
    interval: 30s
    timeout: 15s
    retries: 5
    start_period: 45s
    start_interval: 10s

# 数据库通用配置
x-common-postgres: &common-postgres
  <<: *common-config
  image: postgres:14-alpine
  user: postgres
  volumes:
    - postgres-data-${SERVICE_NAME}:/var/lib/postgresql/data
    - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
  environment:
    POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    PGDATA: /var/lib/postgresql/data/pgdata
  healthcheck:
    <<: *default-healthcheck
    test: >
      bash -c '
        pg_isready -U postgres || exit 1;
        psql -U postgres -c "SELECT 1" 2>/dev/null || exit 1;
        exit 0
      '

# Redis通用配置
x-common-redis: &common-redis
  <<: *common-config
  image: redis:7-alpine
  command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
  volumes:
    - redis-data-${SERVICE_NAME}:/data
  healthcheck:
    <<: *default-healthcheck
    test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
    start_period: 30s

# 监控服务配置
x-common-monitoring: &common-monitoring
  <<: *common-config
  networks:
    - backend
    - monitoring

# 服务定义
services:
  # ============ 数据库服务 ============
  postgresql-main:
    <<: *common-postgres
    container_name: ai-ready-test-pg-main
    hostname: postgresql-main
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    ports:
      - "5432:5432"
    environment:
      <<: *common-postgres
      SERVICE_NAME: main
      POSTGRES_DB: ai_ready_main
      POSTGRES_USER: ai_ready_main
      POSTGRES_PASSWORD: ${DB_PASSWORD_MAIN}
      PGPORT: 5432

  postgresql-inventory:
    <<: *common-postgres
    container_name: ai-ready-test-pg-inventory
    hostname: postgresql-inventory
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.4'
          memory: 384M
    ports:
      - "5433:5432"
    environment:
      <<: *common-postgres
      SERVICE_NAME: inventory
      POSTGRES_DB: ai_ready_inventory
      POSTGRES_USER: ai_ready_inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD_INVENTORY}
      PGPORT: 5432

  postgresql-finance:
    <<: *common-postgres
    container_name: ai-ready-test-pg-finance
    hostname: postgresql-finance
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.4'
          memory: 384M
    ports:
      - "5434:5432"
    environment:
      <<: *common-postgres
      SERVICE_NAME: finance
      POSTGRES_DB: ai_ready_finance
      POSTGRES_USER: ai_ready_finance
      POSTGRES_PASSWORD: ${DB_PASSWORD_FINANCE}
      PGPORT: 5432

  postgresql-ai:
    <<: *common-postgres
    container_name: ai-ready-test-pg-ai
    hostname: postgresql-ai
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.4'
          memory: 384M
    ports:
      - "5435:5432"
    environment:
      <<: *common-postgres
      SERVICE_NAME: ai
      POSTGRES_DB: ai_ready_ai
      POSTGRES_USER: ai_ready_ai
      POSTGRES_PASSWORD: ${DB_PASSWORD_AI}
      PGPORT: 5432

  # ============ Redis缓存服务 ============
  redis-main:
    <<: *common-redis
    container_name: ai-ready-test-redis-main
    hostname: redis-main
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "6379:6379"
    environment:
      SERVICE_NAME: main
      REDIS_PASSWORD: ${REDIS_PASSWORD_MAIN}

  redis-session:
    <<: *common-redis
    container_name: ai-ready-test-redis-session
    hostname: redis-session
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "6380:6379"
    environment:
      SERVICE_NAME: session
      REDIS_PASSWORD: ${REDIS_PASSWORD_SESSION}

  redis-cache:
    <<: *common-redis
    container_name: ai-ready-test-redis-cache
    hostname: redis-cache
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "6381:6379"
    environment:
      SERVICE_NAME: cache
      REDIS_PASSWORD: ${REDIS_PASSWORD_CACHE}

  redis-queue:
    <<: *common-redis
    container_name: ai-ready-test-redis-queue
    hostname: redis-queue
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "6382:6379"
    environment:
      SERVICE_NAME: queue
      REDIS_PASSWORD: ${REDIS_PASSWORD_QUEUE}

  # ============ 监控服务 ============
  prometheus:
    <<: *common-monitoring
    image: prom/prometheus:v2.45.0
    container_name: ai-ready-test-prometheus
    hostname: prometheus
    user: "65534:65534"  # nobody user for security
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    environment:
      - SERVICE_NAME=prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    <<: *common-monitoring
    image: grafana/grafana:10.1.0
    container_name: ai-ready-test-grafana
    hostname: grafana
    user: "472:472"  # grafana user
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - SERVICE_NAME=grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    <<: *common-monitoring
    image: prom/alertmanager:v0.25.0
    container_name: ai-ready-test-alertmanager
    hostname: alertmanager
    user: "65534:65534"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 128M
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--data.retention=120h'
    environment:
      - SERVICE_NAME=alertmanager
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ 日志服务 ============
  loki:
    <<: *common-config
    image: grafana/loki:2.9.0
    container_name: ai-ready-test-loki
    hostname: loki
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    environment:
      - SERVICE_NAME=loki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    <<: *common-config
    image: grafana/promtail:2.9.0
    container_name: ai-ready-test-promtail
    hostname: promtail
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.15'
          memory: 128M
    volumes:
      - ./config/promtail:/etc/promtail:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    environment:
      - SERVICE_NAME=promtail
    depends_on:
      - loki

# 服务依赖关系定义
# 注意：这些依赖关系定义了服务的启动顺序
# depends_on优先级：healthcheck > condition > service_started
# 服务依赖关系会在优化后的编排配置中详细定义

# 网络定义
networks:
  backend:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
  monitoring:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

# 数据卷定义
volumes:
  # PostgreSQL数据卷
  postgres-data-main:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres/main
  postgres-data-inventory:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres/inventory
  postgres-data-finance:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres/finance
  postgres-data-ai:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/postgres/ai

  # Redis数据卷
  redis-data-main:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/redis/main
  redis-data-session:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/redis/session
  redis-data-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/redis/cache
  redis-data-queue:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/redis/queue

  # 监控数据卷
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/prometheus
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/grafana
  alertmanager-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/alertmanager
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/loki