# 消息队列性能测试配置 - Sprint 27+1
# 包含RabbitMQ和Kafka的性能测试脚本和配置

apiVersion: v1
kind: ConfigMap
metadata:
  name: mq-performance-test-config
  namespace: ai-ready-test
data:
  # RabbitMQ性能测试脚本
  rabbitmq-perf-test.sh: |
    #!/bin/bash
    set -e
    
    echo "=== RabbitMQ Performance Test ==="
    echo "Test Date: $(date)"
    echo "Target: rabbitmq.ai-ready-test.svc.cluster.local:5672"
    echo ""
    
    # 等待RabbitMQ就绪
    echo "Waiting for RabbitMQ to be ready..."
    until rabbitmq-diagnostics -q ping 2>/dev/null; do
      sleep 5
    done
    echo "RabbitMQ is ready!"
    echo ""
    
    # 测试1: 基础吞吐量测试 (1000 msg/s 目标)
    echo "Test 1: Basic Throughput Test (1000 msg/s target)"
    echo "-----------------------------------------------"
    rabbitmq-perf-test \
      -h rabbitmq.ai-ready-test.svc.cluster.local \
      -u admin \
      -p password123 \
      -x 10 \
      -y 10 \
      -r 1000 \
      -s 1024 \
      -C 10000 \
      -f persistent \
      --confirm 100 \
      --auto-delete false \
      --queue-args x-queue-type=classic \
      --confirm-timeout 30 \
      -uc test-throughput
    
    echo ""
    echo "Test 1 completed. Target: 1000 msg/s"
    echo ""
    
    # 测试2: 高并发测试
    echo "Test 2: High Concurrency Test"
    echo "-----------------------------"
    rabbitmq-perf-test \
      -h rabbitmq.ai-ready-test.svc.cluster.local \
      -u admin \
      -p password123 \
      -x 50 \
      -y 50 \
      -r 5000 \
      -s 512 \
      -C 50000 \
      -f persistent \
      --confirm 500 \
      --auto-delete false \
      -uc test-concurrency
    
    echo ""
    echo "Test 2 completed."
    echo ""
    
    # 测试3: 大消息测试
    echo "Test 3: Large Message Test (64KB messages)"
    echo "------------------------------------------"
    rabbitmq-perf-test \
      -h rabbitmq.ai-ready-test.svc.cluster.local \
      -u admin \
      -p password123 \
      -x 5 \
      -y 5 \
      -r 100 \
      -s 65536 \
      -C 1000 \
      -f persistent \
      --confirm 50 \
      --auto-delete false \
      -uc test-large-messages
    
    echo ""
    echo "Test 3 completed."
    echo ""
    
    # 测试4: 持久化性能测试
    echo "Test 4: Persistence Performance Test"
    echo "------------------------------------"
    rabbitmq-perf-test \
      -h rabbitmq.ai-ready-test.svc.cluster.local \
      -u admin \
      -p password123 \
      -x 10 \
      -y 10 \
      -r 1000 \
      -s 1024 \
      -C 10000 \
      -f persistent \
      --confirm 100 \
      --auto-delete false \
      --queue-args x-queue-type=quorum \
      -uc test-persistence
    
    echo ""
    echo "Test 4 completed."
    echo ""
    
    echo "=== All RabbitMQ Performance Tests Completed ==="

  # Kafka性能测试脚本
  kafka-perf-test.sh: |
    #!/bin/bash
    set -e
    
    echo "=== Kafka Performance Test ==="
    echo "Test Date: $(date)"
    echo "Bootstrap Servers: kafka-0.kafka-headless.ai-ready-test.svc.cluster.local:9092,kafka-1.kafka-headless.ai-ready-test.svc.cluster.local:9092,kafka-2.kafka-headless.ai-ready-test.svc.cluster.local:9092"
    echo ""
    
    BOOTSTRAP_SERVERS="kafka-0.kafka-headless.ai-ready-test.svc.cluster.local:9092,kafka-1.kafka-headless.ai-ready-test.svc.cluster.local:9092,kafka-2.kafka-headless.ai-ready-test.svc.cluster.local:9092"
    
    # 等待Kafka就绪
    echo "Waiting for Kafka to be ready..."
    until kafka-broker-api-versions.sh --bootstrap-server $BOOTSTRAP_SERVERS 2>/dev/null; do
      sleep 5
    done
    echo "Kafka is ready!"
    echo ""
    
    # 创建测试topic
    echo "Creating test topic..."
    kafka-topics.sh \
      --bootstrap-server $BOOTSTRAP_SERVERS \
      --create \
      --topic perf-test-topic \
      --partitions 6 \
      --replication-factor 3 \
      --config min.insync.replicas=2 \
      --if-not-exists
    
    echo ""
    
    # 测试1: 生产者吞吐量测试 (1000 msg/s 目标)
    echo "Test 1: Producer Throughput Test (1000 msg/s target)"
    echo "---------------------------------------------------"
    kafka-producer-perf-test.sh \
      --topic perf-test-topic \
      --num-records 100000 \
      --record-size 1024 \
      --throughput 1000 \
      --producer-props \
        bootstrap.servers=$BOOTSTRAP_SERVERS \
        acks=all \
        retries=3 \
        batch.size=16384 \
        linger.ms=5 \
        compression.type=lz4
    
    echo ""
    echo "Test 1 completed. Target: 1000 msg/s"
    echo ""
    
    # 测试2: 消费者吞吐量测试
    echo "Test 2: Consumer Throughput Test"
    echo "--------------------------------"
    kafka-consumer-perf-test.sh \
      --topic perf-test-topic \
      --messages 100000 \
      --threads 10 \
      --bootstrap-server $BOOTSTRAP_SERVERS \
      --group perf-test-consumer-group
    
    echo ""
    echo "Test 2 completed."
    echo ""
    
    # 测试3: 高吞吐量测试
    echo "Test 3: High Throughput Test (5000 msg/s)"
    echo "-----------------------------------------"
    kafka-producer-perf-test.sh \
      --topic perf-test-topic \
      --num-records 500000 \
      --record-size 512 \
      --throughput 5000 \
      --producer-props \
        bootstrap.servers=$BOOTSTRAP_SERVERS \
        acks=all \
        retries=3 \
        batch.size=32768 \
        linger.ms=10 \
        compression.type=lz4
    
    echo ""
    echo "Test 3 completed."
    echo ""
    
    # 测试4: 大消息测试
    echo "Test 4: Large Message Test (64KB messages)"
    echo "------------------------------------------"
    kafka-producer-perf-test.sh \
      --topic perf-test-topic \
      --num-records 10000 \
      --record-size 65536 \
      --throughput 100 \
      --producer-props \
        bootstrap.servers=$BOOTSTRAP_SERVERS \
        acks=all \
        max.request.size=10485760 \
        compression.type=lz4
    
    echo ""
    echo "Test 4 completed."
    echo ""
    
    # 清理测试topic
    echo "Cleaning up test topic..."
    kafka-topics.sh \
      --bootstrap-server $BOOTSTRAP_SERVERS \
      --delete \
      --topic perf-test-topic \
      --if-exists
    
    echo ""
    echo "=== All Kafka Performance Tests Completed ==="

  # 死信队列测试脚本
  dead-letter-test.sh: |
    #!/bin/bash
    set -e
    
    echo "=== Dead Letter Queue Test ==="
    echo "Test Date: $(date)"
    echo ""
    
    RABBITMQ_HOST="rabbitmq.ai-ready-test.svc.cluster.local"
    RABBITMQ_USER="admin"
    RABBITMQ_PASS="password123"
    
    # 等待RabbitMQ就绪
    echo "Waiting for RabbitMQ to be ready..."
    until rabbitmq-diagnostics -q ping 2>/dev/null; do
      sleep 5
    done
    echo "RabbitMQ is ready!"
    echo ""
    
    # 创建测试队列（带死信配置）
    echo "Creating test queue with DLX configuration..."
    rabbitmqadmin \
      -H $RABBITMQ_HOST \
      -u $RABBITMQ_USER \
      -p $RABBITMQ_PASS \
      declare queue \
      name=test-dlx-queue \
      durable=true \
      arguments='{"x-dead-letter-exchange":"dlx.exchange","x-dead-letter-routing-key":"dlx.routing.key","x-message-ttl":10000}'
    
    # 创建死信交换机和队列
    rabbitmqadmin \
      -H $RABBITMQ_HOST \
      -u $RABBITMQ_USER \
      -p $RABBITMQ_PASS \
      declare exchange \
      name=dlx.exchange \
      type=direct \
      durable=true
    
    rabbitmqadmin \
      -H $RABBITMQ_HOST \
      -u $RABBITMQ_USER \
      -p $RABBITMQ_PASS \
      declare queue \
      name=dlx-queue \
      durable=true
    
    rabbitmqadmin \
      -H $RABBITMQ_HOST \
      -u $RABBITMQ_USER \
      -p $RABBITMQ_PASS \
      declare binding \
      source=dlx.exchange \
      destination=dlx-queue \
      routing_key=