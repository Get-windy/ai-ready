# 开发环境配置
spring:
  datasource:
    url: jdbc:h2:mem:erp_invoice;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

# 禁用安全验证（开发环境）
security:
  jwt:
    enabled: false

# 启用详细日志
logging:
  level:
    cn.aiedge.erp.invoice: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG