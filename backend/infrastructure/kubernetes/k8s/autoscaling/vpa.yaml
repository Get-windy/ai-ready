# AI-Ready VPA - Vertical Pod Autoscaler
# 版本: v1.0.0
# 更新: 2026-04-09

---
# API服务VPA
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ai-ready-api-vpa
  namespace: ai-ready
  labels:
    app: ai-ready-api
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-ready-api
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: ai-ready-api
      minAllowed:
        cpu: 250m
        memory: 512Mi
      maxAllowed:
        cpu: 4000m
        memory: 8Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
# NLP服务VPA (AI计算需要更多资源)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ai-ready-nlp-vpa
  namespace: ai-ready
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-ready-nlp
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: ai-ready-nlp
      minAllowed:
        cpu: 1000m
        memory: 2Gi
      maxAllowed:
        cpu: 8000m
        memory: 16Gi
      controlledResources: ["cpu", "memory"]

---
# Agent服务VPA
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ai-ready-agent-vpa
  namespace: ai-ready
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-ready-agent
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: ai-ready-agent
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 1000m
        memory: 2Gi
      controlledResources: ["cpu", "memory"]
