spring:
  application:
    name: erp-printing
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_ready
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  
  redis:
    host: localhost
    port: 6379
    database: 0
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.aiedge.erp.printing.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8095

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    cn.aiedge: debug
    org.springframework: info