# AI-Ready Sprint 27+1 测试环境Docker容器化配置优化版
# Version: v2.0.0
# 创建日期: 2026-04-27
# 用途: Sprint 27+1测试环境专用配置，支持数据库性能测试和压力测试

version: '3.8'

# ==================== 全局配置 ====================
x-common-env: &common-env
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: test
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "50"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "10"
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "30000"
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT: "600000"
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: "1800000"

x-healthcheck-config: &healthcheck-config
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-java-options: &java-options
  JAVA_OPTS: >-
    -Xms256m -Xmx512m
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/app/heapdump.hprof

# ==================== 网络配置 ====================
networks:
  sprint-27-1-test-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/16
    name: sprint-27-1-test-network

# ==================== 数据卷配置 ====================
volumes:
  # PostgreSQL 数据卷
  sprint-postgres-main-data:
    driver: local
  sprint-postgres-inventory-data:
    driver: local
  sprint-postgres-finance-data:
    driver: local
  sprint-postgres-ai-data:
    driver: local
  
  # Redis 数据卷
  sprint-redis-main-data:
    driver: local
  sprint-redis-inventory-data:
    driver: local
  sprint-redis-finance-data:
    driver: local
  sprint-redis-ai-data:
    driver: local
  
  # 监控数据卷
  sprint-prometheus-data:
    driver: local
  sprint-grafana-data:
    driver: local
  
  # 性能测试数据
  sprint-performance-data:
    driver: local
  
  # 应用日志
  sprint-api-gateway-logs:
    driver: local
  sprint-inventory-logs:
    driver: local
  sprint-finance-logs:
    driver: local
  sprint-ai-logs:
    driver: local

# ==================== 服务配置 ====================
services:
  # ============ API Gateway ============
  sprint-api-gateway:
    build:
      context: ../../../
      dockerfile: backend/api-gateway/Dockerfile
      args:
        BUILD_ENV: test
    image: ai-ready/sprint-api-gateway:27-1
    container_name: sprint-api-gateway-27-1
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://sprint-postgres-main:5432/sprint_gateway_db
      SPRING_DATASOURCE_USERNAME: sprint_gateway_user
      SPRING_DATASOURCE_PASSWORD: sprint_gateway_pass_2026
      SPRING_REDIS_HOST: sprint-redis-main
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 0
      INVENTORY_SERVICE_URL: http://sprint-inventory-service:8082
      FINANCE_SERVICE_URL: http://sprint-finance-service:8081
      AI_SERVICE_URL: http://sprint-ai-service:8083
    volumes:
      - sprint-api-gateway-logs:/app/logs
    networks:
      - sprint-27-1-test-net
    depends_on:
      sprint-postgres-main:
        condition: service_healthy
      sprint-redis-main:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ 库存管理服务 ============
  sprint-inventory-service:
    build:
      context: ../../../
      dockerfile: backend/inventory/Dockerfile
      args:
        BUILD_ENV: test
    image: ai-ready/sprint-inventory:27-1
    container_name: sprint-inventory-service-27-1
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "9092:9092"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://sprint-postgres-inventory:5432/sprint_inventory_db
      SPRING_DATASOURCE_USERNAME: sprint_inventory_user
      SPRING_DATASOURCE_PASSWORD: sprint_inventory_pass_2026
      SPRING_REDIS_HOST: sprint-redis-inventory
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 1
    volumes:
      - sprint-inventory-logs:/app/logs
    networks:
      - sprint-27-1-test-net
    depends_on:
      sprint-postgres-inventory:
        condition: service_healthy
      sprint-redis-inventory:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ 财务管理服务 ============
  sprint-finance-service:
    build:
      context: ../../../
      dockerfile: backend/finance/Dockerfile
      args:
        BUILD_ENV: test
    image: ai-ready/sprint-finance:27-1
    container_name: sprint-finance-service-27-1
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://sprint-postgres-finance:5432/sprint_finance_db
      SPRING_DATASOURCE_USERNAME: sprint_finance_user
      SPRING_DATASOURCE_PASSWORD: sprint_finance_pass_2026
      SPRING_REDIS_HOST: sprint-redis-finance
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 2
    volumes:
      - sprint-finance-logs:/app/logs
    networks:
      - sprint-27-1-test-net
    depends_on:
      sprint-postgres-finance:
        condition: service_healthy
      sprint-redis-finance:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ AI智能服务 ============
  sprint-ai-service:
    build:
      context: ../../../
      dockerfile: backend/ai-service/Dockerfile
      args:
        BUILD_ENV: test
    image: ai-ready/sprint-ai:27-1
    container_name: sprint-ai-service-27-1
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://sprint-postgres-ai:5432/sprint_ai_db
      SPRING_DATASOURCE_USERNAME: sprint_ai_user
      SPRING_DATASOURCE_PASSWORD: sprint_ai_pass_2026
      SPRING_REDIS_HOST: sprint-redis-ai
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 3
    volumes:
      - sprint-ai-logs:/app/logs
    networks:
      - sprint-27-1-test-net
    depends_on:
      sprint-postgres-ai:
        condition: service_healthy
      sprint-redis-ai:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ 数据库性能测试服务 ============
  # ============ 数据库性能测试服务 ============
  sprint-db-performance-test:
    build:
      context: ../../../qa/performance/database
      dockerfile: Dockerfile.performance
    image: ai-ready/db-performance-test:27-1
    container_name: sprint-db-performance-test-27-1
    restart: unless-stopped
    ports:
      - "8000:8000"  # 性能测试监控端口
    environment:
      <<: *common-env
      POSTGRES_MAIN_HOST: sprint-postgres-main
      POSTGRES_MAIN_PORT: "5432"
      POSTGRES_MAIN_DB: sprint_gateway_db
      POSTGRES_MAIN_USER: sprint_gateway_user
      POSTGRES_MAIN_PASSWORD: sprint_gateway_pass_2026
      POSTGRES_INVENTORY_HOST: sprint-postgres-inventory
      POSTGRES_INVENTORY_PORT: "5432"
      POSTGRES_INVENTORY_DB: sprint_inventory_db
      POSTGRES_INVENTORY_USER: sprint_inventory_user
      POSTGRES_INVENTORY_PASSWORD: sprint_inventory_pass_2026
      POSTGRES_FINANCE_HOST: sprint-postgres-finance
      POSTGRES_FINANCE_PORT: "5432"
      POSTGRES_FINANCE_DB: sprint_finance_db
      POSTGRES_FINANCE_USER: sprint_finance_user
      POSTGRES_FINANCE_PASSWORD: sprint_finance_pass_2026
      POSTGRES_AI_HOST: sprint-postgres-ai
      POSTGRES_AI_PORT: "5432"
      POSTGRES_AI_DB: sprint_ai_db
      POSTGRES_AI_USER: sprint_ai_user
      POSTGRES_AI_PASSWORD: sprint_ai_pass_2026
      TEST_USER: performance_tester
      TEST_PASSWORD: perf_test_2026
    volumes:
      - sprint-performance-data:/app/results
      - ./performance-test-config:/app/config:ro
    networks:
      - sprint-27-1-test-net
    depends_on:
      sprint-postgres-main:
        condition: service_healthy
      sprint-postgres-inventory:
        condition: service_healthy
      sprint-postgres-finance:
        condition: service_healthy
      sprint-postgres-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    command: ["python", "performance_monitor.py", "--port", "8000"]

  # ============ PostgreSQL监控导出器 ============
  postgres-exporter-main:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: sprint-postgres-exporter-main-27-1
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://sprint_gateway_user:sprint_gateway_pass_2026@sprint-postgres-main:5432/sprint_gateway_db?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-postgres-main
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  postgres-exporter-inventory:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: sprint-postgres-exporter-inventory-27-1
    restart: unless-stopped
    ports:
      - "9188:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://sprint_inventory_user:sprint_inventory_pass_2026@sprint-postgres-inventory:5432/sprint_inventory_db?sslmode=disable"
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-postgres-inventory
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  postgres-exporter-finance:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: sprint-postgres-exporter-finance-27-1
    restart: unless-stopped
    ports:
      - "9189:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://sprint_finance_user:sprint_finance_pass_2026@sprint-postgres-finance:5432/sprint_finance_db?sslmode=disable"
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-postgres-finance
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  postgres-exporter-ai:
    image: prometheuscommunity/postgres-exporter:v0.14.0
    container_name: sprint-postgres-exporter-ai-27-1
    restart: unless-stopped
    ports:
      - "9190:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://sprint_ai_user:sprint_ai_pass_2026@sprint-postgres-ai:5432/sprint_ai_db?sslmode=disable"
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-postgres-ai
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ============ Redis监控导出器 ============
  redis-exporter-main:
    image: oliver006/redis_exporter:v1.57.0
    container_name: sprint-redis-exporter-main-27-1
    restart: unless-stopped
    ports:
      - "9121:9121"
    command:
      - "--redis.addr=redis://sprint-redis-main:6379"
      - "--redis.password=sprint_redis_pass_2026"
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-redis-main
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  redis-exporter-inventory:
    image: oliver006/redis_exporter:v1.57.0
    container_name: sprint-redis-exporter-inventory-27-1
    restart: unless-stopped
    ports:
      - "9122:9121"
    command:
      - "--redis.addr=redis://sprint-redis-inventory:6379"
      - "--redis.password=sprint_redis_inventory_pass_2026"
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-redis-inventory
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  redis-exporter-finance:
    image: oliver006/redis_exporter:v1.57.0
    container_name: sprint-redis-exporter-finance-27-1
    restart: unless-stopped
    ports:
      - "9123:9121"
    command:
      - "--redis.addr=redis://sprint-redis-finance:6379"
      - "--redis.password=sprint_redis_finance_pass_2026"
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-redis-finance
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  redis-exporter-ai:
    image: oliver006/redis_exporter:v1.57.0
    container_name: sprint-redis-exporter-ai-27-1
    restart: unless-stopped
    ports:
      - "9124:9121"
    command:
      - "--redis.addr=redis://sprint-redis-ai:6379"
      - "--redis.password=sprint_redis_ai_pass_2026"
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-redis-ai
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # ============ 系统监控 ============
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: sprint-node-exporter-27-1
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude='^/(sys|proc|dev|host|etc)($$|/)'"
    networks:
      - sprint-27-1-test-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.48.1
    container_name: sprint-cadvisor-27-1
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - sprint-27-1-test-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============ PostgreSQL 数据库 ============
  # 主数据库
  sprint-postgres-main:
    image: postgres:14-alpine
    container_name: sprint-postgres-main-27-1
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sprint_gateway_user
      POSTGRES_PASSWORD: sprint_gateway_pass_2026
      POSTGRES_DB: sprint_gateway_db
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      # 性能优化参数
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "768MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "64MB"
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: "0.9"
      POSTGRES_WAL_BUFFERS: "16MB"
      POSTGRES_DEFAULT_STATISTICS_TARGET: "100"
      POSTGRES_RANDOM_PAGE_COST: "1.1"
      POSTGRES_EFFECTIVE_IO_CONCURRENCY: "200"
      POSTGRES_WORK_MEM: "4MB"
      POSTGRES_MIN_WAL_SIZE: "1GB"
      POSTGRES_MAX_WAL_SIZE: "4GB"
    volumes:
      - sprint-postgres-main-data:/var/lib/postgresql/data
      - ./init-scripts/sprint/main:/docker-entrypoint-initdb.d:ro
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint_gateway_user -d sprint_gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # 库存模块数据库
  sprint-postgres-inventory:
    image: postgres:14-alpine
    container_name: sprint-postgres-inventory-27-1
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: sprint_inventory_user
      POSTGRES_PASSWORD: sprint_inventory_pass_2026
      POSTGRES_DB: sprint_inventory_db
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_MAX_CONNECTIONS: "100"
      POSTGRES_SHARED_BUFFERS: "128MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "384MB"
    volumes:
      - sprint-postgres-inventory-data:/var/lib/postgresql/data
      - ./init-scripts/sprint/inventory:/docker-entrypoint-initdb.d:ro
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint_inventory_user -d sprint_inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # 财务模块数据库
  sprint-postgres-finance:
    image: postgres:14-alpine
    container_name: sprint-postgres-finance-27-1
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sprint_finance_user
      POSTGRES_PASSWORD: sprint_finance_pass_2026
      POSTGRES_DB: sprint_finance_db
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_MAX_CONNECTIONS: "100"
      POSTGRES_SHARED_BUFFERS: "128MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "384MB"
    volumes:
      - sprint-postgres-finance-data:/var/lib/postgresql/data
      - ./init-scripts/sprint/finance:/docker-entrypoint-initdb.d:ro
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint_finance_user -d sprint_finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # AI模块数据库
  sprint-postgres-ai:
    image: postgres:14-alpine
    container_name: sprint-postgres-ai-27-1
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: sprint_ai_user
      POSTGRES_PASSWORD: sprint_ai_pass_2026
      POSTGRES_DB: sprint_ai_db
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_MAX_CONNECTIONS: "150"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "768MB"
    volumes:
      - sprint-postgres-ai-data:/var/lib/postgresql/data
      - ./init-scripts/sprint/ai:/docker-entrypoint-initdb.d:ro
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprint_ai_user -d sprint_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ============ Redis 缓存 ============
  # 主缓存
  sprint-redis-main:
    image: redis:7-alpine
    container_name: sprint-redis-main-27-1
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --databases 16
      --save 900 1
      --save 300 10
      --save 60 10000
      --requirepass sprint_redis_pass_2026
    volumes:
      - sprint-redis-main-data:/data
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # 库存模块缓存
  sprint-redis-inventory:
    image: redis:7-alpine
    container_name: sprint-redis-inventory-27-1
    restart: unless-stopped
    ports:
      - "6374:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --databases 4
      --requirepass sprint_redis_inventory_pass_2026
    volumes:
      - sprint-redis-inventory-data:/data
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # 财务模块缓存
  sprint-redis-finance:
    image: redis:7-alpine
    container_name: sprint-redis-finance-27-1
    restart: unless-stopped
    ports:
      - "6373:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --databases 4
      --requirepass sprint_redis_finance_pass_2026
