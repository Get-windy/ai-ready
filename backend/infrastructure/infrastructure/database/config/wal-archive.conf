# PostgreSQL WAL 归档配置
# 项目: AI-Ready
# 版本: v1.0
# 创建时间: 2026-04-26
# 作者: devops-engineer

# 启用WAL归档模式
archive_mode = on

# WAL归档命令
# 使用cp命令将WAL文件复制到归档目录
archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'

# 归档超时设置 (秒)
archive_timeout = 300

# WAL段大小 (默认16MB)
wal_segment_size = 16MB

# 最大WAL发送者数量
max_wal_senders = 10

# WAL保持器数量
wal_keep_size = 1GB

# WAL日志级别
wal_level = replica

# 检查点相关配置
checkpoint_completion_target = 0.9
checkpoint_timeout = 300

# 归档存储路径配置说明:
# 1. 确保 /wal_archive 目录存在且PostgreSQL用户有写权限
# 2. 建议在docker-compose.yml中挂载持久化卷到/wal_archive
# 3. 定期清理旧的WAL文件以避免磁盘空间耗尽

# 示例docker-compose.yml挂载配置:
# volumes:
#   - wal_archive_data:/wal_archive
#
# volumes:
#   wal_archive_data:

# 注意: 修改此配置后需要重启PostgreSQL服务