# AI-Ready Istio Observability Configuration
# Istio可观测性配置

# ============================================
# 1. Prometheus配置
# ============================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-istio
  namespace: istio-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'istio-mesh'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: istio-system
      - job_name: 'envoy-stats'
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_istio]
            action: keep
            regex: injection

---
# ============================================
# 2. Grafana Dashboard配置
# ============================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-istio-dashboards
  namespace: istio-system
data:
  istio-dashboard.json: |
    {
      "dashboard": {
        "title": "AI-Ready Istio Dashboard",
        "panels": [
          {
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service=~\"ai-ready.*\"}[5m]))"
              }
            ]
          },
          {
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(istio_requests_total{destination_service=~\"ai-ready.*\",response_code=~\"5.*\"}[5m]))"
              }
            ]
          },
          {
            "title": "P99 Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_seconds_bucket{destination_service=~\"ai-ready.*\"}[5m])) by (le))"
              }
            ]
          }
        ]
      }
    }

---
# ============================================
# 3. Zipkin追踪配置
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: istio-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest
          ports:
            - containerPort: 9411
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: istio-system
spec:
  ports:
    - port: 9411
      targetPort: 9411
  selector:
    app: zipkin

---
# ============================================
# 4. Kiali可视化配置
# ============================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiali
  namespace: istio-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kiali
  template:
    metadata:
      labels:
        app: kiali
    spec:
      containers:
        - name: kiali
          image: quay.io/kiali/kiali:latest
          env:
            - name: SERVER_PORT
              value: "20001"
            - name: ISTIO_NAMESPACE
              value: "istio-system"
          ports:
            - containerPort: 20001
---
apiVersion: v1
kind: Service
metadata:
  name: kiali
  namespace: istio-system
spec:
  ports:
    - port: 20001
      targetPort: 20001
  selector:
    app: kiali