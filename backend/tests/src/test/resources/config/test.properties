# ==========================================
# 企智连自动化测试框架配置
# ==========================================

# 环境配置
env=dev
base.url=http://localhost:8080
api.base.path=/api/v1
ui.base.url=http://localhost:3000

# 超时配置 (秒)
timeout.seconds=30
retry.count=3

# 数据库配置
database.url=jdbc:mysql://localhost:3306/qizhilian
database.username=test
database.password=test123

# ==========================================
# UI测试配置
# ==========================================
browser.type=chrome
headless.mode=false
window.width=1920
window.height=1080
implicit.wait.seconds=10
page.load.timeout.seconds=30
script.timeout.seconds=30

# ChromeDriver路径 (如未配置则使用系统PATH)
# chromedriver.path=/path/to/chromedriver

# ==========================================
# 移动端测试配置
# ==========================================
mobile.platform=android
appium.server.url=http://localhost:4723

# Android配置
android.device.name=Pixel_4
android.platform.version=13
android.app.path=/path/to/app.apk
android.app.package=com.qizhilian.app
android.app.activity=.MainActivity

# iOS配置
ios.device.name=iPhone 14
ios.platform.version=17.0
ios.app.path=/path/to/app.ipa
ios.bundle.id=com.qizhilian.app

# ==========================================
# API测试配置
# ==========================================
api.content.type=application/json
api.charset=UTF-8

# 认证配置
auth.type=jwt
auth.token.header=Authorization
auth.token.prefix=Bearer

# 测试账号
# test.username=admin
# test.password=admin123

# ==========================================
# 报告配置
# ==========================================
report.allure.enabled=true
report.allure.results.dir=target/allure-results

# ==========================================
# 日志配置
# ==========================================
log.level=INFO
log.console.enabled=true
log.file.enabled=true
log.file.path=logs/test.log
