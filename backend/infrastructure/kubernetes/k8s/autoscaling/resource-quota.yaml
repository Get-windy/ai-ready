# AI-Ready 资源配额和限制配置
# 版本: v1.0.0
# 更新: 2026-04-09

---
# 命名空间资源配额
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-ready-quota
  namespace: ai-ready
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "100"
    services: "30"
    secrets: "50"
    configmaps: "50"
    persistentvolumeclaims: "30"

---
# 生产环境资源配额
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-ready-quota-prod
  namespace: ai-ready-prod
spec:
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    pods: "200"
    services: "50"
    secrets: "100"
    configmaps: "100"
    persistentvolumeclaims: "50"

---
# 容器默认资源限制
apiVersion: v1
kind: LimitRange
metadata:
  name: ai-ready-limits
  namespace: ai-ready
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: 8000m
      memory: 16Gi
    min:
      cpu: 50m
      memory: 64Mi
  - type: PersistentVolumeClaim
    max:
      storage: 500Gi
    min:
      storage: 1Gi

---
# PodDisruptionBudget - API服务
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-ready-api-pdb
  namespace: ai-ready
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ai-ready-api

---
# PodDisruptionBudget - NLP服务
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-ready-nlp-pdb
  namespace: ai-ready
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-ready-nlp
