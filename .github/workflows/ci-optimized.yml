# AI-Ready CI/CD Pipeline - Optimized Version
# Project: 企智连·AI-Ready
# Version: v2.0 (Optimized)
# Last Updated: 2026-04-03
# 
# 优化内容：
# 1. Maven依赖缓存优化（增量构建）
# 2. 测试并行化（JUnit5并行执行）
# 3. Docker构建缓存分层
# 4. 构建矩阵并行
# 5. 条件触发优化

name: AI-Ready CI/CD Pipeline (Optimized)

on:
  push:
    branches:
      - master
      - localization
      - feature/*
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile*'
      - '.github/workflows/ci-optimized.yml'
  pull_request:
    branches:
      - master
      - localization
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip tests (emergency only)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  MAVEN_OPTS: '-Dmaven.repo.local=$HOME/.m2/repository -Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1'

# 并发控制：同一分支只允许一个运行实例
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 阶段0: 仓库卫生（运行产物 / 超大文件不得入库）
  # ------------------------------------------------------------
  # 独立于变更检测、只读 git 索引，秒级完成，任何 push/PR 都跑。
  # 由来：backend_new.log 7.2GB、299MB 的 *.log、pnpm 安装包 3.8MB、
  #      34 个 .pyc、Playwright 报告、*.bak 备份都曾进入版本库——删掉也仍在历史里。
  # 规则与处理方式见 tools/check-repo-hygiene.sh。
  # ============================================
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 运行产物与超大文件检查
        run: bash tools/check-repo-hygiene.sh

  # ============================================
  # 阶段1: 变更检测（快速跳过不必要的构建）
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile*'
            frontend:
              - 'frontend/**'
            infra:
              - '.github/workflows/**'

  # ============================================
  # 阶段2: 并行代码检查（矩阵并行）
  # ============================================
  lint:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        analyzer: [checkstyle, spotbugs, pmd]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17 with Cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
            maven-

      - name: Run ${{ matrix.analyzer }}
        working-directory: backend
        run: |
          case "${{ matrix.analyzer }}" in
            checkstyle) ./mvnw checkstyle:check -B ;;
            spotbugs) ./mvnw spotbugs:check -B ;;
            pmd) ./mvnw pmd:check -B ;;
          esac
        continue-on-error: true

  # ============================================
  # 阶段3: 并行单元测试（分片执行）
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.backend == 'true' && github.event.inputs.skip_tests != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17 with Cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run Unit Tests (Shard ${{ matrix.shard }}/4)
        working-directory: backend
        run: |
          ./mvnw test -B \
            -Dsurefire.rerunFailingTestsCount=2 \
            -Dsurefire.parallel=classes \
            -Dsurefire.threadCount=4 \
            -Dsurefire.useSystemClassLoader=false
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: 4

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 7

  # ============================================
  # 阶段3.5: 调用可复用测试套件 (automated-tests.yml)
  # ============================================
  automated-tests:
    name: Automated Tests (Unit/Integration/E2E)
    uses: ./.github/workflows/automated-tests.yml
    with:
      test-type: all
    secrets: inherit

  # ============================================
  # 阶段4: 构建应用（后端+前端并行）
  # ============================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.backend == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      cache-hit: ${{ steps.cache-maven.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17 with Cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven Repository (Incremental)
        id: cache-maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}
          restore-keys: |
            maven-build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            maven-${{ runner.os }}-

      - name: Build with Maven (Offline if cached)
        working-directory: backend
        run: |
          if [ "${{ steps.cache-maven.outputs.cache-hit }}" == "true" ]; then
            ./mvnw clean package -B -o -DskipTests
          else
            ./mvnw clean package -B -DskipTests
          fi

      - name: Extract Version
        id: version
        working-directory: backend
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/core/api/core-api/target/*.jar
          retention-days: 7

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/apps/pc-admin/package-lock.json'

      - name: Cache npm Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/apps/pc-admin/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install Dependencies
        working-directory: frontend/apps/pc-admin
        run: npm ci --prefer-offline --no-audit

      - name: Build Frontend
        working-directory: frontend/apps/pc-admin
        run: npm run build
        env:
          CI: false
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/apps/pc-admin/dist/
          retention-days: 7

  # ============================================
  # 阶段5: Docker构建（分层缓存优化）
  # ============================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/core/api/core-api/target

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/apps/pc-admin/dist
        continue-on-error: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Layer Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.build-backend.outputs.version || 'latest' }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
            type=ref,event=branch

      - name: Build and Push (Layered Cache)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ needs.build-backend.outputs.version || 'dev' }}
            REVISION=${{ github.sha }}

      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ============================================
  # 阶段6: 安全扫描
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'
    steps:
      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker-build.outputs.image-tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================
  # 阶段7: 冒烟测试
  # 说明: 无 k8s/ 目录和 Kubernetes 集群，部署改为
  #       直接启动后端 JAR + 执行 smoke-test.sh 验证
  # ============================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [build-backend]
    if: needs.build-backend.result == 'success'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devdb
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devuser123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17 with Cache
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/core/api/core-api/target

      - name: Start Backend
        env:
          SPRING_PROFILES_ACTIVE: dev
        run: |
          JAR_FILE="$(ls backend/core/api/core-api/target/*-exec.jar | head -1)"
          echo "启动后端: ${JAR_FILE}"
          nohup java -jar "${JAR_FILE}" --spring.profiles.active=dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "后端 PID: $(cat /tmp/backend.pid)"

      - name: Wait for Backend to Start
        run: |
          # 与 smoke-test.sh 一致: 只要 HTTP 有响应(非 000)即视为启动成功
          # (未认证接口返回 401 也属于正常启动)
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5655/api/system/health 2>/dev/null || echo "000")
            if [[ "$CODE" != "000" ]]; then
              echo "后端已启动 (HTTP $CODE)"
              exit 0
            fi
            sleep 5
          done
          echo "后端启动失败，最近日志："
          tail -100 /tmp/backend.log
          exit 1

      - name: Run Smoke Test
        run: bash backend/scripts/smoke-test.sh http://localhost:5655

  # ============================================
  # 阶段8: 通知
  # ============================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always()
    steps:
      - name: Send Success Notification
        if: success()
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"✅ AI-Ready Deployment Success - Branch: ${{ github.ref_name }}, Env: ${{ github.event.inputs.environment || 'dev' }}"}'
        
      - name: Send Failure Notification
        if: failure()
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"❌ AI-Ready Deployment Failed - Branch: ${{ github.ref_name }}, Job: ${{ github.job }}"}'
