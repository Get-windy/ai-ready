# 批次管理模块缓存配置

batch:
  cache:
    # 批次详情缓存配置
    detail:
      redis-ttl: 1800  # 30分钟
      local-ttl: 300   # 5分钟
      max-size: 10000
    # 批次列表缓存配置
    list:
      redis-ttl: 600   # 10分钟
      max-size: 1000
    # 库存汇总缓存配置
    stock:
      redis-ttl: 300   # 5分钟
      max-size: 100
    # 临期预警缓存配置
    expiring:
      redis-ttl: 300   # 5分钟
      max-size: 100
    # 缓存穿透防护
    null-value:
      redis-ttl: 60    # 1分钟
    # 分布式锁配置
    lock:
      ttl: 10          # 10秒
    # 缓存前缀配置
    prefix:
      detail: "batch:detail:"
      list: "batch:list:"
      stock: "batch:stock:"
      expiring: "batch:expiring:"
      lock: "batch:lock:"

# Redis配置
spring:
  redis:
    # Redis集群配置（根据实际环境调整）
    # cluster:
    #   nodes:
    #     - redis-node-1:6379
    #     - redis-node-2:6379
    #     - redis-node-3:6379
    host: localhost
    port: 6379
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

# Caffeine本地缓存配置
caffeine:
  cache:
    batch-detail:
      spec: maximumSize=10000,expireAfterWrite=300s
    batch-list:
      spec: maximumSize=1000,expireAfterWrite=300s
    stock-summary:
      spec: maximumSize=100,expireAfterWrite=300s