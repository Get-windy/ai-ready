[pytest]
# 统一测试配置文件
# 适用于所有类型的测试

# 测试路径配置
testpaths = 
    tests/unit
    tests/api
    tests/integration
    tests/e2e
    tests/performance
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 执行选项
addopts = 
    -v                   # 详细输出
    --tb=short          # 简洁的错误回溯
    --strict-markers    # 严格的标记验证
    --durations=10      # 显示最慢的10个测试
    --maxfail=5         # 最多失败5个测试后停止
    --junitxml=reports/junit.xml  # JUnit XML报告
    --html=reports/report.html    # HTML报告
    --self-contained-html         # 独立的HTML报告
    -n auto             # 自动并行执行（根据CPU核心数）

# 测试标记系统
markers =
    # 测试类型标记
    unit: 单元测试
    integration: 集成测试
    api: API接口测试
    e2e: 端到端测试
    performance: 性能测试
    security: 安全测试
    
    # 执行速度标记
    fast: 快速测试（< 100ms）
    medium: 中等速度测试（100ms - 1s）
    slow: 慢速测试（> 1s）
    
    # 测试状态标记
    smoke: 冒烟测试
    regression: 回归测试
    flaky: 不稳定的测试（需要修复）
    
    # 业务模块标记
    erp: ERP模块测试
    crm: CRM模块测试
    ai: AI模块测试
    monitoring: 监控模块测试

# 测试配置
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 超时设置
timeout = 300           # 单个测试最长运行时间（秒）
timeout_method = thread # 超时处理方式

# 覆盖率配置（如果安装了pytest-cov）
[tool:pytest]
cov_report = 
    term-missing: skip-covered
    xml: reports/coverage.xml
    html: reports/coverage-html
cov_fail_under = 80     # 覆盖率低于80%时测试失败

# 测试数据配置
test_data_dir = test-data
test_env = test
test_log_level = INFO

# 数据库测试配置
test_database =
    host = localhost
    port = 5432
    name = ai_ready_test
    user = test_user
    password = test_password