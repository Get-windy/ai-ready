# ERP Modules Docker Compose Configuration
# 用于本地开发环境部署所有P0 ERP模块

version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: ai-ready-erp-postgres
    environment:
      POSTGRES_DB: ai_ready_erp
      POSTGRES_USER: ${DB_USER:-erpadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erpadmin123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erpadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: ai-ready-erp-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - erp-network

  # 批次/序列号管理模块
  erp-batch-sn:
    build:
      context: ../../backend/erp/erp-batch-sn
      dockerfile: ./Dockerfile
    container_name: ai-ready-erp-batch-sn
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_ready_erp
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-erpadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-erpadmin123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - batch-sn-logs:/app/logs
    networks:
      - erp-network

  # 发票管理模块
  erp-invoice:
    build:
      context: ../../backend/erp/erp-invoice
      dockerfile: ./Dockerfile
    container_name: ai-ready-erp-invoice
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_ready_erp
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-erpadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-erpadmin123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - invoice-logs:/app/logs
    networks:
      - erp-network

  # 采购询价/报价管理模块
  erp-purchase-exchange:
    build:
      context: ../../backend/erp/erp-purchase
      dockerfile: ./Dockerfile
    container_name: ai-ready-erp-purchase-exchange
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_ready_erp
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-erpadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-erpadmin123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - purchase-exchange-logs:/app/logs
    networks:
      - erp-network

  # 销售价格策略管理模块
  erp-sales-exchange:
    build:
      context: ../../backend/erp/erp-sale
      dockerfile: ./Dockerfile
    container_name: ai-ready-erp-sales-exchange
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_ready_erp
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-erpadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-erpadmin123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - sales-exchange-logs:/app/logs
    networks:
      - erp-network

  # 供应商协同门户模块（预留）
  supplier-portal:
    build:
      context: ../../backend/erp/erp-supplier-portal
      dockerfile: ./Dockerfile
    container_name: ai-ready-supplier-portal
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ai_ready_erp
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-erpadmin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-erpadmin123}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC"
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - supplier-portal-logs:/app/logs
    networks:
      - erp-network
    profiles:
      - development

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ai-ready-erp-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts:/etc/prometheus/alerts
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - erp-network

  # Grafana 监控面板
  grafana:
    image: grafana/grafana:10.0.0
    container_name: ai-ready-erp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: postgres-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - postgres
    networks:
      - erp-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  batch-sn-logs:
    driver: local
  invoice-logs:
    driver: local
  purchase-exchange-logs:
    driver: local
  sales-exchange-logs:
    driver: local
  supplier-portal-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  erp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16