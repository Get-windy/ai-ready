# AI-Ready Alertmanager Configuration
# Log Alert Notification Management
# Version: v1.0

global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@ai-ready.com'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASS}'
  smtp_require_tls: true
  
  # 告警抑制
  resolve_timeout: 5m

# 模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 路由树
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # Critical级别路由
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
      
    # Warning级别路由
    - match:
        severity: warning
      receiver: 'warning-alerts'
      continue: false
      
    # 数据库相关告警
    - match:
        component: database
      receiver: 'dba-alerts'
      continue: true
      
    # 安全相关告警
    - match:
        security: "true"
      receiver: 'security-alerts'
      continue: true

# 抑制规则
inhibit_rules:
  # Critical抑制Warning
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
    
  # 相同服务抑制
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service']

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default'
    email_configs:
      - to: 'devops@ai-ready.com'
        subject: 'AI-Ready Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Time: {{ .StartsAt }}
          {{ end }}

  # Critical告警接收器
  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@ai-ready.com'
        subject: '[CRITICAL] AI-Ready Alert: {{ .GroupLabels.alertname }}'
        body: |
          CRITICAL ALERT
          ==============
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Time: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: '${DINGTALK_WEBHOOK_URL}'
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json

  # Warning告警接收器
  - name: 'warning-alerts'
    email_configs:
      - to: 'devops@ai-ready.com'
        subject: '[WARNING] AI-Ready Alert: {{ .GroupLabels.alertname }}'

  # DBA告警接收器
  - name: 'dba-alerts'
    email_configs:
      - to: 'dba@ai-ready.com'
        subject: '[DBA] AI-Ready Database Alert: {{ .GroupLabels.alertname }}'

  # 安全告警接收器
  - name: 'security-alerts'
    email_configs:
      - to: 'security@ai-ready.com'
        subject: '[SECURITY] AI-Ready Security Alert: {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: '${DINGTALK_WEBHOOK_URL}'
        send_resolved: true
