server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://prod-db-host:5432/ai_ready?currentSchema=dms
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 15000

logging:
  level:
    cn.aiedge.dms: INFO
    com.baomidou.mybatisplus: WARN
  file:
    path: /var/log/dms
    max-size: 100MB
    max-history: 30

dms:
  erp:
    base-url: http://erp-service:8080/api/erp
  wms:
    base-url: http://wms-service:8081/api/wms
  callback:
    base-url: http://dms-service:8082/api/dms/callback
    secret: ${DMS_CALLBACK_SECRET}
  event:
    retry-intervals: 10000,30000,60000
    max-retries: 3
    scan-interval: 10000
