# AI-Ready HikariCP Optimized Configuration
# 数据库连接池优化配置

spring:
  datasource:
    hikari:
      # 基础配置
      jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_ready}
      username: ${DB_USER:ai_ready}
      password: ${DB_PASS:ai_ready2026}
      driver-class-name: org.postgresql.Driver
      
      # 连接池大小配置
      minimum-idle: 10              # 最小空闲连接
      maximum-pool-size: 50         # 最大连接数
      connection-timeout: 30000     # 获取连接超时(30s)
      idle-timeout: 600000          # 空闲连接超时(10min)
      max-lifetime: 1800000         # 连接最大生命周期(30min)
      keepalive-time: 300000        # 连接保活时间(5min)
      
      # 性能优化配置
      prep-statement-cache-size: 500
      prep-statement-cache-sql-limit: 2048
      use-server-prep-statements: true
      cache-prep-statements: true
      cache-result-set-metadata: true
      cache-server-configuration: true
      
      # 连接测试配置
      connection-test-query: SELECT 1
      validation-timeout: 5000
      leak-detection-threshold: 60000
      
      # 事务配置
      auto-commit: false
      transaction-isolation: TRANSACTION_READ_COMMITTED

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: production
  datasource:
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
