# 测试监控告警规则配置
groups:
  - name: test_execution_alerts
    interval: 30s
    rules:
      # 测试执行失败率告警
      - alert: TestFailureRateHigh
        expr: rate(test_execution_total{status="failed"}[10m]) / rate(test_execution_total[10m]) > 0.2
        for: 5m
        labels:
          severity: critical
          category: test_quality
          environment: testing
        annotations:
          summary: "测试失败率过高"
          description: "测试失败率已达到 {{ $value | humanizePercentage }}，超过20%阈值"
          impact: "测试质量下降，可能影响发布质量"
          action: "立即检查失败测试，分析失败原因"
          documentation: "查看测试报告: /test-report"
      
      - alert: TestFailureRateWarning
        expr: rate(test_execution_total{status="failed"}[10m]) / rate(test_execution_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: test_quality
          environment: testing
        annotations:
          summary: "测试失败率偏高"
          description: "测试失败率已达到 {{ $value | humanizePercentage }}，超过10%阈值"
          action: "检查失败测试，准备修复"
          documentation: "查看失败测试详情: /test-failures"
      
      # 测试执行时间告警
      - alert: TestExecutionTimeLong
        expr: test_execution_duration_seconds > 30
        for: 2m
        labels:
          severity: warning
          category: test_performance
          environment: testing
        annotations:
          summary: "测试执行时间过长"
          description: "测试 {{ $labels.test_name }} 执行时间 {{ $value }}秒，超过30秒阈值"
          action: "优化测试逻辑，减少执行时间"
          optimization: "考虑拆分长测试或增加超时设置"
      
      - alert: TestExecutionTimeCritical
        expr: test_execution_duration_seconds > 60
        for: 1m
        labels:
          severity: critical
          category: test_performance
          environment: testing
        annotations:
          summary: "测试执行时间严重超时"
          description: "测试 {{ $labels.test_name }} 执行时间 {{ $value }}秒，超过60秒阈值"
          action: "立即检查测试，可能存在死锁或资源泄漏"
          emergency: "考虑终止长时间运行的测试"
      
      # 测试成功率告警
      - alert: TestSuccessRateLow
        expr: test_success_rate < 80
        for: 5m
        labels:
          severity: critical
          category: test_quality
          environment: testing
        annotations:
          summary: "测试成功率过低"
          description: "测试成功率已降至 {{ $value | humanizePercentage }}，低于80%阈值"
          impact: "测试质量不可接受，不能发布"
          action: "暂停测试执行，修复所有失败测试"
          blocking: "阻塞CI/CD流水线直到修复"
      
      - alert: TestSuccessRateDeclining
        expr: delta(test_success_rate[30m]) < -5
        for: 10m
        labels:
          severity: warning
          category: test_quality
          environment: testing
        annotations:
          summary: "测试成功率下降趋势"
          description: "测试成功率在30分钟内下降 {{ $value | abs }}个百分点"
          action: "监控趋势，准备质量改进"
          trend: "可能需要更新测试用例或修复环境问题"
      
      # 测试覆盖率告警
      - alert: TestCoverageLow
        expr: test_coverage_percent{coverage_type="line"} < 70
        for: 15m
        labels:
          severity: warning
          category: test_coverage
          environment: testing
        annotations:
          summary: "测试覆盖率过低"
          description: "行覆盖率已降至 {{ $value | humanizePercentage }}，低于70%阈值"
          action: "增加测试用例，提高覆盖率"
          requirement: "要求行覆盖率 >= 80%，分支覆盖率 >= 70%"
      
      - alert: TestCoverageCritical
        expr: test_coverage_percent{coverage_type="line"} < 50
        for: 10m
        labels:
          severity: critical
          category: test_coverage
          environment: testing
        annotations:
          summary: "测试覆盖率严重不足"
          description: "行覆盖率已降至 {{ $value | humanizePercentage }}，低于50%阈值"
          action: "立即停止开发，优先增加测试"
          blocking: "阻塞功能开发直到覆盖率达标"

  - name: test_performance_alerts
    interval: 30s
    rules:
      # 测试执行吞吐量告警
      - alert: TestThroughputLow
        expr: tests_per_second < 1
        for: 5m
        labels:
          severity: warning
          category: test_performance
          environment: testing
        annotations:
          summary: "测试执行吞吐量过低"
          description: "测试执行速度仅为 {{ $value }} TPS，低于1 TPS阈值"
          action: "检查测试执行环境，优化测试并发"
          optimization: "考虑并行执行测试，优化测试数据准备"
      
      # 测试执行队列告警
      - alert: TestQueueGrowing
        expr: increase(test_execution_queue_length[5m]) > 10
        for: 3m
        labels:
          severity: warning
          category: test_performance
          environment: testing
        annotations:
          summary: "测试执行队列增长"
          description: "测试队列在5分钟内增长 {{ $value }}个任务"
          action: "增加测试执行资源，优化队列处理"
          capacity: "检查测试执行器容量，考虑扩容"
      
      # 测试资源使用告警
      - alert: TestCPUUsageHigh
        expr: test_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          category: test_resources
          environment: testing
        annotations:
          summary: "测试执行CPU使用率过高"
          description: "测试执行CPU使用率 {{ $value | humanizePercentage }}，超过80%阈值"
          action: "优化测试资源使用，考虑增加CPU资源"
          impact: "高CPU使用率可能影响测试执行稳定性"
      
      - alert: TestMemoryUsageHigh
        expr: test_memory_usage_mb > 4096
        for: 5m
        labels:
          severity: critical
          category: test_resources
          environment: testing
        annotations:
          summary: "测试执行内存使用过高"
          description: "测试执行内存使用 {{ $value | humanize1024 }}MB，超过4GB阈值"
          action: "检查内存泄漏，优化测试内存使用"
          emergency: "可能发生内存泄漏，需要立即处理"

  - name: test_environment_alerts
    interval: 30s
    rules:
      # 测试环境健康告警
      - alert: TestEnvironmentUnhealthy
        expr: up{job=~"test.*"} == 0
        for: 1m
        labels:
          severity: critical
          category: environment
          environment: testing
        annotations:
          summary: "测试环境服务不可用"
          description: "测试环境服务 {{ $labels.job }} 已宕机"
          action: "立即检查服务状态，重启服务"
          emergency: "测试执行可能完全停止"
      
      # 测试环境资源告警
      - alert: EnvironmentCPUCritical
        expr: node_cpu_usage_percent > 90
        for: 3m
        labels:
          severity: critical
          category: environment
          environment: testing
        annotations:
          summary: "测试环境CPU使用率严重过高"
          description: "测试环境CPU使用率 {{ $value | humanizePercentage }}，超过90%阈值"
          action: "立即检查环境负载，考虑扩容或迁移负载"
      
      - alert: EnvironmentDiskFull
        expr: node_filesystem_avail_percent < 10
        for: 2m
        labels:
          severity: critical
          category: environment
          environment: testing
        annotations:
          summary: "测试环境磁盘空间不足"
          description: "测试环境磁盘可用空间仅剩 {{ $value | humanizePercentage }}"
          action: "立即清理磁盘空间，避免测试数据丢失"
      
      # 网络连通性告警
      - alert: NetworkConnectivityLost
        expr: node_network_up == 0
        for: 2m
        labels:
          severity: critical
          category: environment
          environment: testing
        annotations:
          summary: "测试环境网络连接丢失"
          description: "测试环境网络连接已中断"
          action: "检查网络配置和防火墙规则"
          impact: "所有网络依赖的测试将失败"

  - name: test_defect_alerts
    interval: 60s
    rules:
      # 缺陷发现率告警
      - alert: HighDefectDiscoveryRate
        expr: rate(defects_found_total[1h]) > 5
        for: 10m
        labels:
          severity: warning
          category: defects
          environment: testing
        annotations:
          summary: "缺陷发现率过高"
          description: "过去1小时内发现 {{ $value }} 个缺陷，超过阈值"
          action: "检查代码质量，加强代码审查"
          quality: "可能代码质量下降，需要加强质量控制"
      
      # 严重缺陷告警
      - alert: CriticalDefectFound
        expr: defects_found_total{severity="critical"} > 0
        for: 0m
        labels:
          severity: emergency
          category: defects
          environment: testing
        annotations:
          summary: "发现严重级别缺陷"
          description: "发现 {{ $value }} 个严重级别缺陷"
          action: "立即停止所有相关功能开发，优先修复缺陷"
          emergency: "最高优先级，阻塞所有开发工作"
      
      # 缺陷解决率告警
      - alert: LowDefectResolutionRate
        expr: defects_resolved_total / defects_found_total < 0.5
        for: 1h
        labels:
          severity: warning
          category: defects
          environment: testing
        annotations:
          summary: "缺陷解决率过低"
          description: "缺陷解决率仅为 {{ $value | humanizePercentage }}，低于50%阈值"
          action: "加强缺陷管理，提高解决效率"
          management: "可能需要分配更多资源处理缺陷"

  - name: test_integration_alerts
    interval: 60s
    rules:
      # 集成测试告警
      - alert: IntegrationTestFailure
        expr: test_execution_total{test_type="integration", status="failed"} > 0
        for: 0m
        labels:
          severity: critical
          category: integration
          environment: testing
        annotations:
          summary: "集成测试失败"
          description: "集成测试发现失败，数量: {{ $value }}"
          action: "检查组件间集成，修复接口问题"
          impact: "系统组件集成可能存在问题"
      
      # E2E测试告警
      - alert: E2ETestFailure
        expr: test_execution_total{test_type="e2e", status="failed"} > 0
        for: 0m
        labels:
          severity: critical
          category: e2e
          environment: testing
        annotations:
          summary: "端到端测试失败"
          description: "E2E测试发现失败，数量: {{ $value }}"
          action: "检查完整业务流程，修复端到端问题"
          business: "影响最终用户业务流程"
      
      # API测试告警
      - alert: APITestFailure
        expr: test_execution_total{test_type="api", status="failed"} > 0
        for: 0m
        labels:
          severity: critical
          category: api
          environment: testing
        annotations:
          summary: "API测试失败"
          description: "API测试发现失败，数量: {{ $value }}"
          action: "检查API接口，修复接口问题"
          api: "影响外部系统集成"

  - name: test_security_alerts
    interval: 60s
    rules:
      # 安全测试告警
      - alert: SecurityTestFailure
        expr: test_execution_total{test_type="security", status="failed"} > 0
        for: 0m
        labels:
          severity: emergency
          category: security
          environment: testing
        annotations:
          summary: "安全测试失败"
          description: "安全测试发现漏洞，数量: {{ $value }}"
          action: "立即修复安全漏洞，优先级最高"
          security: "安全漏洞可能被利用，需要立即处理"
      
      # 安全扫描告警
      - alert: SecurityScanFailure
        expr: security_scan_vulnerabilities > 0
        for: 0m
        labels:
          severity: critical
          category: security
          environment: testing
        annotations:
          summary: "安全扫描发现漏洞"
          description: "安全扫描发现 {{ $value }} 个漏洞"
          action: "立即修复所有安全漏洞"
          compliance: "可能违反安全合规要求"

# 告警分组配置
alert_grouping:
  by_label: ['severity', 'category', 'environment']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

# 告警抑制规则
inhibit_rules:
  # 紧急告警抑制所有低级别告警
  - source_match:
      severity: 'emergency'
    target_match:
      severity: 'critical|warning|info'
    equal: ['environment', 'category']
  
  # 严重告警抑制警告和信息告警
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning|info'
    equal: ['environment', 'category']
  
  # 相同服务的多个告警抑制
  - source_match:
      job: '.*'
    target_match:
      job: '.*'
    equal: ['instance', 'alertname']