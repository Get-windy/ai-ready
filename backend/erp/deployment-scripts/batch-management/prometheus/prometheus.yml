# Prometheus监控配置 - ERP批次管理模块
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: '${ENVIRONMENT}'
    service: 'erp-batch-management'

# 告警规则配置
rule_files:
  - "alerts/batch-management-alerts.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# 抓取目标配置
scrape_configs:
  # 批次管理服务指标
  - job_name: 'batch-management'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['batch-management:8080']
        labels:
          application: 'batch-management'
          instance: 'batch-management-${ENVIRONMENT}'
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __metrics_path__
        regex: (.*)
        replacement: '/actuator/prometheus'

  # Spring Boot Actuator健康检查
  - job_name: 'spring-actuator'
    metrics_path: '/actuator/health'
    static_configs:
      - targets: ['batch-management:8080']
    params:
      format: ['prometheus']
    scrape_interval: 30s

  # JVM性能指标
  - job_name: 'jvm-metrics'
    static_configs:
      - targets: ['batch-management:8080']
    metrics_path: '/actuator/metrics'
    params:
      tag: ['area:heap', 'area:nonheap']
    scrape_interval: 15s

  # 数据库连接池监控
  - job_name: 'datasource-metrics'
    static_configs:
      - targets: ['batch-management:8080']
    metrics_path: '/actuator/metrics'
    params:
      tag: ['name:hikaricp.connections']
    scrape_interval: 15s

  # HTTP请求指标
  - job_name: 'http-requests'
    static_configs:
      - targets: ['batch-management:8080']
    metrics_path: '/actuator/metrics'
    params:
      tag: ['name:http.server.requests']
    scrape_interval: 10s

  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # 节点监控 (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Docker容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 30s

  # 数据库监控 (PostgreSQL)
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis监控
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # 消息队列监控 (RabbitMQ)
  - job_name: 'rabbitmq-exporter'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']
    scrape_interval: 30s

# 远程写入配置 (可选)
remote_write:
  - url: 'http://remote-prometheus:9090/api/v1/write'
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'up|batch_.*|jvm_.*|http_.*'
        action: keep

# 远程读取配置 (可选)
remote_read:
  - url: 'http://remote-prometheus:9090/api/v1/read'
    read_recent: true