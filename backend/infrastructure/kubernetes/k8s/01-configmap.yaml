# 企智连项目 ConfigMap 配置
# 存储非敏感的配置数据

apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-ready-app-config
  namespace: ai-ready
  labels:
    app: ai-ready
    component: config
data:
  # 应用基础配置
  application.yml: |
    server:
      port: 8080
      servlet:
        context-path: /api
    
    spring:
      profiles:
        active: prod
      application:
        name: ai-ready
      jackson:
        date-format: yyyy-MM-dd HH:mm:ss
        time-zone: GMT+8
      servlet:
        multipart:
          max-file-size: 100MB
          max-request-size: 100MB
    
    # 日志配置
    logging:
      level:
        root: INFO
        com.qizhilian: DEBUG
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    
    # 业务配置
    app:
      name: "企智连"
      version: "1.0.0"
      max-upload-size: 104857600
      session-timeout: 3600
      cors:
        allowed-origins: "*"
        allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
        allowed-headers: "*"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-ready-db-config
  namespace: ai-ready
  labels:
    app: ai-ready
    component: database
data:
  # 数据库连接配置（不含密码）
  database.properties: |
    db.host=postgres-service
    db.port=5432
    db.name=aiready
    db.pool.max-size=20
    db.pool.min-idle=5
    db.pool.max-lifetime=1800000
    db.pool.connection-timeout=30000
    db.pool.idle-timeout=600000
  
  # Redis配置
  redis.properties: |
    redis.host=redis-service
    redis.port=6379
    redis.database=0
    redis.timeout=3000
    redis.pool.max-active=20
    redis.pool.max-idle=10
    redis.pool.min-idle=5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-ready-mq-config
  namespace: ai-ready
  labels:
    app: ai-ready
    component: messaging
data:
  # RocketMQ配置
  rocketmq.properties: |
    rocketmq.namesrv.addr=rocketmq-namesrv:9876
    rocketmq.producer.group=ai-ready-producer-group
    rocketmq.consumer.group=ai-ready-consumer-group
    rocketmq.producer.send-timeout=3000
    rocketmq.producer.retry-times=3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-ready-nginx-config
  namespace: ai-ready
  labels:
    app: ai-ready
    component: frontend
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        
        # Gzip压缩
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_min_length 1000;
        
        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # API代理
        location /api/ {
            proxy_pass http://backend-service:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # 前端路由支持
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # 健康检查
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
