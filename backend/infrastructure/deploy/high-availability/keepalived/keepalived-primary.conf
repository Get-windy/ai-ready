# AI-Ready Keepalived 配置 - 主节点
# 管理虚拟IP：172.31.0.100

vrrp_script chk_nginx {
    script "/usr/bin/curl -f http://localhost/health || exit 1"
    interval 2
    weight 10
    fall 3
    rise 2
    timeout 5
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 150
    advert_int 1
    
    # 主节点VIP
    virtual_ipaddress {
        172.31.0.100/24 dev eth0
    }
    
    # 认证配置
    authentication {
        auth_type PASS
        auth_pass ai-ready-vip-2026
    }
    
    # 健康检查
    track_script {
        chk_nginx
    }
    
    # 状态变更通知脚本
    notify_master "/usr/local/bin/keepalived-notify.sh master"
    notify_backup "/usr/local/bin/keepalived-notify.sh backup"
    notify_fault "/usr/local/bin/keepalived-notify.sh fault"
    
    # 故障切换配置
    preempt_delay 300  # 抢占延迟，避免状态抖动
    
    # 故障检测配置
    track_interface {
        eth0
    }
}