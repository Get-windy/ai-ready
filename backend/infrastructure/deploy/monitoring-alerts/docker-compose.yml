# 监控告警模块生产环境部署配置
# 文件名: docker-compose.yml
# 版本: v1.0.0
# 创建日期: 2026-04-29
# 描述: 监控告警模块生产环境完整部署配置

version: '3.8'

networks:
  monitoring-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local

services:
  # ===========================================
  # 数据库服务 - PostgreSQL
  # ===========================================
  postgres-monitoring:
    image: postgres:15-alpine
    container_name: ai-ready-postgres-monitoring
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-monitoring_db}
      POSTGRES_USER: ${DB_USER:-monitoring_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-monitoring_user} -d ${DB_NAME:-monitoring_db}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # ===========================================
  # 缓存服务 - Redis
  # ===========================================
  redis-monitoring:
    image: redis:7-alpine
    container_name: ai-ready-redis-monitoring
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME_STRONG_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================
  # 消息队列 - RabbitMQ
  # ===========================================
  rabbitmq-monitoring:
    image: rabbitmq:3.12-management-alpine
    container_name: ai-ready-rabbitmq-monitoring
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-monitoring_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-monitoring_vhost}
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"   # AMQP协议端口
      - "${RABBITMQ_MANAGEMENT_PORT:-15673}:15672" # 管理界面端口
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================
  # Prometheus - 监控数据收集
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ai-ready-prometheus
    restart: unless-stopped
    user: "65534:65534"  # 非root用户运行
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ./prometheus/file_sd:/etc/prometheus/file_sd:ro
    networks:
      - monitoring-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--storage.tsdb.retention.time=${RETENTION_TIME:-30d}'
      - '--storage.tsdb.retention.size=${RETENTION_SIZE:-10GB}'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - postgres-monitoring
      - redis-monitoring
      - rabbitmq-monitoring

  # ===========================================
  # AlertManager - 告警管理
  # ===========================================
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: ai-ready-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - alertmanager-data:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
    networks:
      - monitoring-network
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:${ALERTMANAGER_PORT:-9093}'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

  # ===========================================
  # Grafana - 监控可视化
  # ===========================================
  grafana:
    image: grafana/grafana:10.0.3
    container_name: ai-ready-grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: "http://localhost:${GRAFANA_PORT:-3000}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      prometheus:
        condition: service_healthy

  # ===========================================
  # 自定义监控导出器 - 业务指标
  # ===========================================
  custom-exporter:
    build:
      context: ../../backend/monitoring
      dockerfile: src/main/docker/custom-exporter/Dockerfile
    container_name: ai-ready-custom-exporter
    restart: unless-stopped
    ports:
      - "${CUSTOM_EXPORTER_PORT:-9101}:9101"
    environment:
      POSTGRES_CONNECTION_STRING: "postgresql://${DB_USER:-monitoring_user}:${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@postgres-monitoring:5432/${DB_NAME:-monitoring_db}"
      REDIS_CONNECTION_STRING: "redis://:${REDIS_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@redis-monitoring:6379"
      RABBITMQ_CONNECTION_STRING: "amqp://${RABBITMQ_USER:-monitoring_rabbit}:${RABBITMQ_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}@rabbitmq-monitoring:5672/${RABBITMQ_VHOST:-monitoring_vhost}"
      EXPORTER_PORT: ${CUSTOM_EXPORTER_PORT:-9101}
      METRICS_PATH: /metrics
      COLLECT_INTERVAL: ${COLLECT_INTERVAL:-30}
    volumes:
      - ./custom-exporter/config:/app/config:ro
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres-monitoring:
        condition: service_healthy
      redis-monitoring:
        condition: service_healthy
      rabbitmq-monitoring:
        condition: service_healthy

  # ===========================================
  # 监控告警API服务
  # ===========================================
  monitoring-api:
    build:
      context: ../../backend/monitoring
      dockerfile: src/main/docker/custom-exporter/Dockerfile
    container_name: ai-ready-monitoring-api
    restart: unless-stopped
    ports:
      - "${MONITORING_API_PORT:-8081}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-monitoring:5432/${DB_NAME:-monitoring_db}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-monitoring_user}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}"
      SPRING_REDIS_HOST: "redis-monitoring"
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: "${REDIS_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}"
      SPRING_RABBITMQ_HOST: "rabbitmq-monitoring"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "${RABBITMQ_USER:-monitoring_rabbit}"
      SPRING_RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-CHANGE_ME_STRONG_PASSWORD}"
      SPRING_RABBITMQ_VIRTUAL_HOST: "${RABBITMQ_VHOST:-monitoring_vhost}"
      PROMETHEUS_METRICS_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      JAVA_OPTS: "${JAVA_OPTS:- -Xms512m -Xmx1024m -XX:+UseG1GC}"
    volumes:
      - ./logs/monitoring-api:/app/logs
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    depends_on:
      postgres-monitoring:
        condition: service_healthy
      redis-monitoring:
        condition: service_healthy
      rabbitmq-monitoring:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  # ===========================================
  # Node Exporter - 主机指标监控
  # ===========================================
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: ai-ready-node-exporter
    restart: unless-stopped
    user: "65534:65534"
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring-network
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(tmpfs|cgroup|autofs|rpc_pipefs|devpts)($$|/)'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # Nginx - 负载均衡和反向代理
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: ai-ready-nginx-monitoring
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - grafana
      - monitoring-api
      - prometheus
      - alertmanager
      - node-exporter