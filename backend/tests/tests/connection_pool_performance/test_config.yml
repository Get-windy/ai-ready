# AI-Ready 连接池性能测试配置

# 测试数据库配置
database:
  postgresql:
    host: localhost
    port: 5432
    database: ai_ready_test
    username: ai_ready
    password: ai_ready2026
  
  mysql:
    host: localhost
    port: 3306
    database: ai_ready_test
    username: root
    password: ""

# 连接池测试配置
connection_pool:
  # 测试的连接池大小配置
  pool_sizes:
    - small: 10
    - medium: 50
    - large: 100
  
  # 最小空闲连接数
  min_idle_ratios:
    - small: 0.5    # 50% of max pool size
    - medium: 0.2   # 20% of max pool size
    - large: 0.2    # 20% of max pool size
  
  # 测试参数
  test_iterations: 100
  concurrent_threads: [1, 5, 10, 20, 50]
  timeout_seconds: 30

# 监控指标
metrics:
  response_time:
    p50: true
    p95: true
    p99: true
  throughput:
    qps: true
    tps: true
  resource_usage:
    cpu: false
    memory: false
    connections: true

# 验收标准
acceptance_criteria:
  max_response_time_p95: 10.0  # ms
  min_success_rate: 99.0       # %
  max_connection_wait_time: 50.0 # ms