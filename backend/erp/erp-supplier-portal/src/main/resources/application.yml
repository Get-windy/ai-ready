# Spring Boot Application Configuration
spring:
  application:
    name: erp-supplier-portal
  
  # 数据源配置 (默认PostgreSQL, 可选MySQL)
  datasource:
    driver-class-name: org.postgresql.Driver
    # 可选MySQL: jdbc:mysql://localhost:3306/erp_supplier?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    url: jdbc:postgresql://localhost:5432/erp_supplier
    username: root
    password: root123456
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
          fetch_size: 100
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms
  
  # RabbitMQ配置
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5000
  
  # 邮件配置
  mail:
    host: smtp.exmail.qq.com
    port: 465
    username: noreply@aiedge.cn
    password: your_password
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
      enabled: true
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    cache-enabled: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.aiedge.erp.supplier.model.entity

# 供应商门户模块配置
supplier:
  portal:
    # 绩效评分权重配置
    performance-weights:
      quality: 0.3      # 质量权重30%
      delivery: 0.25    # 交付权重25%
      price: 0.15       # 价格权重15%
      service: 0.2      # 服务权重20%
      response: 0.1     # 响应权重10%
    
    # 等级评定阈值
    level-thresholds:
      a-level: 90       # A级阈值>=90
      b-level: 80       # B级阈值>=80
      c-level: 70       # C级阈值>=70
      d-level: 0        # D级阈值<70
    
    # 通知配置
    notification:
      # 默认通知渠道优先级
      channel-priority:
        - WEBSITE        # 站内信
        - EMAIL          # 邮件
        - WECHAT         # 微信
        - DINGTALK       # 钉钉
        - SMS            # 短信
      
      # 重试配置
      retry:
        max-attempts: 3
        initial-interval: 5000    # 5秒
        multiplier: 2.0
        max-interval: 30000       # 30秒
    
    # 门户配置
    website:
      base-url: https://supplier.aiedge.cn
      login-url: /login
      dashboard-url: /dashboard
      timeout: 1800               # 会话超时时间（秒）

# 租户配置
tenant:
  # 租户数据隔离策略
  isolation:
    strategy: COLUMN              # DATABASE | SCHEMA | COLUMN
    column-name: tenant_id
  
  # 默认租户
  default-tenant: default
  
  # 租户白名单
  white-list:
    - default
    - demo
    - test

# 缓存配置
cache:
  # Redis缓存配置
  redis:
    # 供应商信息缓存
    supplier:
      key-prefix: "supplier:"
      ttl: 3600                   # 1小时
      max-size: 1000
    
    # 绩效数据缓存
    performance:
      key-prefix: "performance:"
      ttl: 1800                   # 30分钟
      max-size: 500
    
    # 通知缓存
    notification:
      key-prefix: "notification:"
      ttl: 300                    # 5分钟
      max-size: 1000
    
    # 配置缓存
    config:
      key-prefix: "config:"
      ttl: 86400                  # 24小时
      max-size: 100

# 日志配置
logging:
  level:
    cn.aiedge.erp.supplier: DEBUG
    com.baomidou.mybatisplus: WARN
    org.springframework: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/erp-supplier-portal.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /erp-supplier
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        max-age: 1800
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: always

# 安全配置
security:
  jwt:
    secret: your-jwt-secret-key-change-in-production
    expiration: 86400000          # 24小时
    header: Authorization
    token-prefix: "Bearer "
    ignore-urls:
      - /api/supplier/login
      - /api/supplier/register
      - /doc.html
      - /webjars/**
      - /swagger-resources/**
      - /v3/api-docs/**
      - /actuator/health

# API文档配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    swagger-model-name: 供应商协同门户API文档
  production: false
  basic:
    enable: false

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
      path-mapping:
        health: health-check
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# 应用信息
info:
  app:
    name: ${spring.application.name}
    version: 1.0.0-SNAPSHOT
    description: 供应商协同门户模块 - AI-Ready ERP系统
    company: AI-Edge科技有限公司
    website: https://www.aiedge.cn
  build:
    artifact: ${project.artifactId}
    name: ${project.name}
    version: ${project.version}
    time: ${build.time}

# 环境配置
profiles:
  active: dev

# 开发环境配置
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # 可选MySQL: jdbc:mysql://localhost:3306/erp_supplier_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    url: jdbc:postgresql://localhost:5432/erp_supplier_dev
  redis:
    host: localhost
    port: 6379
logging:
  level:
    cn.aiedge.erp.supplier: DEBUG
    org.springframework.web: DEBUG

# 测试环境配置
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # 可选MySQL: jdbc:mysql://test-db:3306/erp_supplier_test?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    url: jdbc:postgresql://test-postgres:5432/erp_supplier_test
    username: test_user
    password: test_password
  redis:
    host: test-redis
    port: 6379
logging:
  level:
    cn.aiedge.erp.supplier: INFO

# 生产环境配置
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # 可选MySQL: jdbc:mysql://prod-db-cluster:3306/erp_supplier?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    url: jdbc:postgresql://prod-postgres-cluster:5432/erp_supplier
    username: ${DB_USERNAME:prod_user}
    password: ${DB_PASSWORD:prod_password}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  redis:
    host: ${REDIS_HOST:prod-redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 50
        max-idle: 20
        min-idle: 10
logging:
  level:
    cn.aiedge.erp.supplier: WARN
    root: WARN
  file:
    name: /var/log/erp/supplier-portal.log
server:
  port: ${SERVER_PORT:8080}
knife4j:
  enable: false
management:
  endpoints:
    web:
      exposure:
        include: health,metrics