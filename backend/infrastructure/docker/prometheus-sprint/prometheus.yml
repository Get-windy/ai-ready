# Sprint 27+1 数据库性能监控配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# 告警规则
rule_files:
  - "rules/*.yml"

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Prometheus自身监控
scrape_configs:
  # Prometheus自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'

  # PostgreSQL数据库监控
  - job_name: 'postgresql-sprint'
    static_configs:
      - targets:
        - 'sprint-postgres-main-27-1:9187'
        - 'sprint-postgres-inventory-27-1:9187'
        - 'sprint-postgres-finance-27-1:9187'
        - 'sprint-postgres-ai-27-1:9187'
    metrics_path: '/metrics'
    params:
      collect[]:
        - standard
        - database
        - bgwriter
        - archiver

  # Redis监控
  - job_name: 'redis-sprint'
    static_configs:
      - targets:
        - 'sprint-redis-main-27-1:9121'
        - 'sprint-redis-inventory-27-1:9121'
        - 'sprint-redis-finance-27-1:9121'
        - 'sprint-redis-ai-27-1:9121'
    metrics_path: '/metrics'

  # 应用服务监控
  - job_name: 'spring-boot-sprint'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'sprint-api-gateway-27-1:9090'
        - 'sprint-inventory-service-27-1:9092'
        - 'sprint-finance-service-27-1:9091'
        - 'sprint-ai-service-27-1:9093'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '(.*):\d+'
        replacement: '${1}'

  # 数据库性能测试监控
  - job_name: 'db-performance-test'
    static_configs:
      - targets: ['sprint-db-performance-test-27-1:8000']
    metrics_path: '/metrics'

  # Node Exporter（系统指标）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor（容器指标）
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']