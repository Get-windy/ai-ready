# Development Environment Configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/erp_batch_dev?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  redis:
    host: 127.0.0.1
    port: 6379
  cloud:
    nacos:
      enabled: false

# Development Logging
logging:
  level:
    cn.aiedge.erp.batch: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server Configuration for Development
server:
  port: 8082
  servlet:
    context-path: /batch

# Swagger Configuration for Development
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    filter: true

# Development Security (Disabled for easier testing)
security:
  basic:
    enabled: false

# Development Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

# Development Feature Flags
feature:
  flags:
    enable-batch-trace: true
    enable-batch-warning: true
    enable-batch-flow: true
    mock-external-services: true

# Development Cache Configuration
cache:
  type: simple
  simple:
    time-to-live: 60s

# Development External Service Mock URLs
service:
  product:
    base-url: http://localhost:8081/product
  inventory:
    base-url: http://localhost:8083/inventory
  supplier:
    base-url: http://localhost:8084/supplier
  warehouse:
    base-url: http://localhost:8085/warehouse

# Development Performance Configuration
performance:
  enable-query-log: true
  enable-slow-query-log: true
  slow-query-threshold: 1000  # milliseconds
  enable-request-log: true
  request-log-pattern: "%t %m %U %s %Dms"

# Development Testing Configuration
testing:
  enable-test-data: true
  test-data:
    batch-count: 100
    product-count: 50
    supplier-count: 20
    warehouse-count: 5

# Development Monitoring
monitoring:
  enable-metrics: true
  metrics:
    export:
      console:
        enabled: true
        step: 30s
  tracing:
    enabled: true
    exporter:
      zipkin:
        enabled: false
      jaeger:
        enabled: false