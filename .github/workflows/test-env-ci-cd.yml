# AI-Ready Test Environment CI/CD Pipeline
# Optimized deployment workflow with health checks, rollback, and monitoring

name: Test Environment CI/CD

on:
  push:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-env-ci-cd.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/test-env-ci-cd.yml'
  schedule:
    - cron: '0 2 * * 0'  # Weekly full deployment
  workflow_dispatch:      # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/test-environment
  VERSION: ${{ github.sha }}

jobs:
  # ==================== Pre-Deployment ====================
  pre-deploy-checks:
    name: Pre-Deploy Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Verify configuration
      run: |
        echo "Verifying deployment configuration..."
        
        # Check if docker-compose file exists
        if [ ! -f "backend/infrastructure/docker/docker-compose-test.yml" ]; then
          echo "❌ docker-compose-test.yml not found"
          exit 1
        fi
        
        # Check if deployment scripts exist
        if [ ! -f "backend/infrastructure/docker/scripts/deploy-test-optimized.sh" ]; then
          echo "❌ deploy-test-optimized.sh not found"
          exit 1
        fi
        
        echo "✅ All configuration files present"
    
    - name: Run security scan
      uses: snyk/actions/docker@master
      with:
        image: test-environment
        args: --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    
    - name: Validate Docker Compose
      run: |
        echo "Validating Docker Compose configuration..."
        docker-compose -f backend/infrastructure/docker/docker-compose-test.yml config --quiet
        echo "✅ Docker Compose configuration is valid"

  # ==================== Build Phase ====================
  build:
    name: Build Services
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    timeout-minutes: 60
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Docker images
      run: |
        echo "Building all Docker images..."
        cd backend/infrastructure/docker
        
        # Enable BuildKit for faster builds
        export DOCKER_BUILDKIT=1
        
        # Build specific services
        docker build --target production -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-gateway-${{ env.VERSION }} -f docker/Dockerfile.api .
        docker build --target production -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:inventory-${{ env.VERSION }} -f docker/Dockerfile .
        docker build --target production -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:finance-${{ env.VERSION }} -f docker/Dockerfile .
        
        # Build optimized versions
        docker build --target production -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:api-gateway-optimized-${{ env.VERSION }} -f docker/Dockerfile.optimized .
        
        echo "✅ Docker images built successfully"
    
    - name: Verify builds
      run: |
        echo "Verifying Docker images..."
        docker images | grep ${{ env.IMAGE_NAME }}
        echo "✅ Docker images verified"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docker-images
        path: |
          backend/infrastructure/docker/dockers/*.tar
        retention-days: 7

  # ==================== Integration Tests ====================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: integration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      prometheus:
        image: prom/prometheus:v2.45.0
        options: >-
          --health-cmd "wget -q --spider http://localhost:9090/-/healthy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9090:9090
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        cd backend
        
        # Run API integration tests
        mvn -f core/api/pom.xml verify -Dit.test=*IntegrationTest
        
        # Run database integration tests
        mvn -f core/data/pom.xml verify -Dit.test=*IntegrationTest
        
        # Run message queue tests
        mvn -f core/messaging/pom.xml verify -Dit.test=*IntegrationTest
        
        echo "✅ Integration tests passed"
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          backend/target/surefire-reports/
          backend/target/failsafe-reports/
        retention-days: 7

  # ==================== Deploy to Test Environment ====================
  deploy-test:
    name: Deploy to Test Environment
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    timeout-minutes: 45
    environment: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup deployment environment
      run: |
        echo "Setting up deployment environment..."
        sudo apt-get update
        sudo apt-get install -y docker.io docker-compose
        docker --version
        docker-compose --version
    
    - name: Download Docker images
      uses: actions/download-artifact@v4
      with:
        name: docker-images
        path: backend/infrastructure/docker/dockers/
    
    - name: Configure Kubernetes
      run: |
        echo "Configuring test environment..."
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_TEST }}" | base64 -d > $HOME/.kube/config
        kubectl config use-context ${{ secrets.K8S_CONTEXT_TEST }}
        kubectl get nodes
    
    - name: Run optimized deployment
      run: |
        echo "Running optimized deployment script..."
        cd backend/infrastructure/docker
        
        # Make script executable
        chmod +x scripts/deploy-test-optimized.sh
        
        # Run deployment with health checks and rollback
        ./scripts/deploy-test-optimized.sh
        
        # Capture deployment result
        DEPLOY_RESULT=$?
        
        if [ $DEPLOY_RESULT -eq 0 ]; then
          echo "✅ Deployment succeeded"
          echo "DEPLOY_STATUS=success" >> $GITHUB_ENV
        else
          echo "❌ Deployment failed"
          echo "DEPLOY_STATUS=failed" >> $GITHUB_ENV
          exit 1
        fi
    
    - name: Verify deployment
      run: |
        echo "Verifying deployment..."
        
        # Check all services are running
        docker-compose -f backend/infrastructure/docker/docker-compose-test.yml ps
        
        # Verify key services
        echo "Checking API Gateway..."
        curl -f http://localhost:8080/actuator/health
        
        echo "Checking Prometheus..."
        curl -f http://localhost:9090/-/healthy
        
        echo "Checking Grafana..."
        curl -f http://localhost:3000/api/health
        
        echo "✅ All services verified"
    
    - name: Send deployment notification
      if: success()
      run: |
        echo "Sending deployment notification..."
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "✅ **测试环境部署成功**\n\n> 版本: ${{ env.VERSION }}\n> 环境: Test\n> 时间: ${{ github.event.head_commit.timestamp }}\n> 提交: ${{ github.event.head_commit.id }}\n\n**服务状态**:\n- API Gateway: ✅ 运行中\n- Inventory Service: ✅ 运行中\n- Finance Service: ✅ 运行中\n- Prometheus: ✅ 运行中\n- Grafana: ✅ 运行中\n\n[查看监控面板](http://test-monitoring.ai-ready.local:3000)"
            }
          }'
    
    - name: Send deployment failure notification
      if: failure()
      run: |
        echo "Sending deployment failure notification..."
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "❌ **测试环境部署失败**\n\n> 版本: ${{ env.VERSION }}\n> 环境: Test\n> 时间: ${{ github.event.head_commit.timestamp }}\n\n**需要立即处理**\n请查看部署日志了解详情\n\n[查看部署日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            }
          }'

  # ==================== Deployment Verification ====================
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy-test
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run smoke tests
      run: |
        echo "Running smoke tests..."
        
        # Test API Gateway
        curl -f http://localhost:8080/api/health
        
        # Test database connection
        psql -h localhost -U test -d test -c "SELECT 1"
        
        # Test Redis connection
        redis-cli -h localhost ping
        
        echo "✅ Smoke tests passed"
    
    - name: Monitor deployment
      run: |
        echo "Monitoring deployment for 5 minutes..."
        for i in {1..30}; do
          echo "Health check $i/30..."
          curl -f http://localhost:8080/actuator/health || true
          sleep 10
        done
        echo "✅ Deployment stable"

  # ==================== Post-Deployment Monitoring ====================
  post-deploy-monitoring:
    name: Post-Deploy Monitoring
    runs-on: ubuntu-latest
    needs: verify-deployment
    timeout-minutes: 60
    
    steps:
    - name: Collect deployment metrics
      run: |
        echo "Collecting deployment metrics..."
        
        # Get container stats
        docker stats --no-stream > /tmp/container-stats.txt
        
        # Get service status
        docker-compose -f backend/infrastructure/docker/docker-compose-test.yml ps > /tmp/service-status.txt
        
        # Get health check results
        curl -s http://localhost:9090/api/v1/query?query=up > /tmp/health-results.json
        
        echo "Metrics collected"
    
    - name: Upload deployment metrics
      uses: actions/upload-artifact@v4
      with:
        name: deployment-metrics
        path: |
          /tmp/container-stats.txt
          /tmp/service-status.txt
          /tmp/health-results.json
        retention-days: 7
    
    - name: Update deployment dashboard
      run: |
        echo "Updating deployment dashboard..."
        
        # Send metrics to Prometheus Pushgateway
        cat <<EOF | curl --data-binary @- http://localhost:9091/metrics/job/test-deployment/instance/${{ github.sha }}
        # TYPE test_deployment_duration_seconds gauge
        test_deployment_duration_seconds{version="${{ env.VERSION }}"} ${{ github.event.head_commit.timestamp }}
        
        # TYPE test_deployment_status gauge
        test_deployment_status{version="${{ env.VERSION }}", environment="test"} 1
        EOF
        
        echo "Dashboard updated"

  # ==================== Rolling Back on Failure ====================
  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-test, verify-deployment, post-deploy-monitoring]
    if: failure()
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup deployment environment
      run: |
        echo "Setting up rollback environment..."
        sudo apt-get update
        sudo apt-get install -y docker.io docker-compose
        docker --version
        docker-compose --version
    
    - name: Execute rollback
      run: |
        echo "Executing rollback..."
        cd backend/infrastructure/docker
        
        # Stop all services
        docker-compose -f backend/infrastructure/docker/docker-compose-test.yml down
        
        # Restore previous version if available
        if [ -f ".previous_tag" ]; then
          PREVIOUS_VERSION=$(cat .previous_tag)
          echo "Rolling back to version: $PREVIOUS_VERSION"
          # Implement rollback logic based on previous version
        fi
        
        # Restart critical services only
        docker-compose -f backend/infrastructure/docker/docker-compose-test.yml up -d \
          postgres-main redis-main prometheus
        
        echo "Rollback completed"
    
    - name: Send rollback notification
      run: |
        echo "Sending rollback notification..."
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "🔄 **测试环境部署回滚完成**\n\n> 原版本: ${{ env.VERSION }}\n> 时间: ${{ github.event.head_commit.timestamp }}\n\n**回滚状态**:\n- 关键服务: ✅ 已恢复\n- 数据库: ✅ 正常\n- 缓存: ✅ 正常\n- 监控: ✅ 运行中\n\n**下一步**:\n1. 检查部署失败原因\n2. 修复问题后重新部署\n3. 验证修复效果\n\n[查看部署日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            }
          }'

  # ==================== Cleanup ====================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-test, verify-deployment, post-deploy-monitoring, rollback-on-failure]
    if: always()
    timeout-minutes: 10
    
    steps:
    - name: Cleanup artifacts
      run: |
        echo "Cleaning up temporary artifacts..."
        # Implement cleanup logic
    
    - name: Send final notification
      if: always()
      run: |
        echo "Sending final notification..."
        
        DEPLOY_STATUS="${{ needs.deploy-test.result }}"
        VERIFY_STATUS="${{ needs.verify-deployment.result }}"
        MONITOR_STATUS="${{ needs.post-deploy-monitoring.result }}"
        
        if [ "$DEPLOY_STATUS" = "success" ] && [ "$VERIFY_STATUS" = "success" ] && [ "$MONITOR_STATUS" = "success" ]; then
          EMOJI="✅"
          MESSAGE="成功"
        else
          EMOJI="❌"
          MESSAGE="失败或部分失败"
        fi
        
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": " ${EMOJI} **测试环境CI/CD流水线完成**\n\n> 状态: ${MESSAGE}\n> 版本: ${{ env.VERSION }}\n> 环境: Test\n\n**各阶段状态**:\n- 部署: ${{ needs.deploy-test.result }}\n- 验证: ${{ needs.verify-deployment.result }}\n- 监控: ${{ needs.post-deploy-monitoring.result }}\n- 回滚: ${{ needs.rollback-on-failure.result }}\n\n[查看详细日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            }
          }'
