# Spring Boot 配置
server:
  port: 5655

spring:
  application:
    name: ai-ready-gateway
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true  # 允许循环引用以解决BeanPostProcessor警告
  profiles:
    active: dev
  # 文件上传上限：Spring 默认单文件仅 1MB，商品图片/Excel 导入等稍大文件会被
  # MaxUploadSizeExceededException 兜底成 500「系统异常」。此处与前端的
  # 10MB 图片校验对齐（单文件 10MB、单请求 50MB 以容纳多文件上传）。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 5
    table: flyway_schema_history
    # 确保 SQL 文件以 UTF-8 编码读取
    encoding: UTF-8

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  # 禁止同账号多地并发登录：新登录会踢掉旧会话
  is-concurrent: false
  # 同账号登录时是否共享 Token（is-concurrent=false 时此配置不生效）
  is-share: false
  # 被踢下线后，再次访问时提示
  is-login-kick: true
  token-style: random-uuid
  is-log: false
  is-read-header: true
  is-read-cookie: false
  token-prefix: "Bearer"

# 日志配置
logging:
  level:
    root: INFO
    cn.aiedge: INFO
    org.springframework.cloud.gateway: INFO

# 应用日志配置
app:
  # 错误日志服务（JSONL 文件输出）
  error-log:
    enabled: true
    cleanup-days: 30
  # 集中式结构化 JSON 日志
  log:
    structured:
      dir: ./logs/structured

  # ── 开发工具 → API测试（菜单 62404）· 受控出站请求的服务端安全边界 ──
  # 消费方：cn.aiedge.devtool（DevApiTestController / ApiTestTargetGuard / ApiTestOutboundService）
  # 口径：本页是「用户输入什么、服务端就往哪发请求」的唯一入口，因此三个事实来源
  #       （本系统自己的 origin / 外部白名单 / 能否自带 Authorization）**只认服务端配置**，
  #       绝不接受前端传入 —— 前端只能决定「打哪个路径、用什么方法、带什么 body」。
  # 依据说明：协议白名单 / allowlist / 禁跳转 / 屏蔽内网网段 有 OWASP 依据；
  #       「剥离平台凭据 + 响应大小/超时上限」OWASP 无对应章节，属**本系统自建安全设计**（不声称业界标准）。
  # ⚠️ 生产环境应设 app.api-test.enabled=false（本页是调试台，不应长期在线）。
  api-test:
    enabled: true
    # 「本系统自身」的 origin。相对路径（/api/...）拼在它之后；绝对 URL 只有同 origin 才算同源。
    # 不从请求头 Host / X-Forwarded-Host 推导：那两个头是调用方可控的输入，用它当 allowlist 等于没有 allowlist。
    self-base-url: http://127.0.0.1:${server.port}
    # 是否放行外部地址（默认 false）。开启后仍受 allowed-hosts 限制，且**仍要**过内网网段检查。
    allow-external: false
    allowed-hosts: []
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
    max-response-bytes: 262144   # 256KB，超出流式截断（不会先把整个响应读进内存）
    max-request-bytes: 65536     # 64KB
    max-url-length: 2048
    max-headers: 20
    rate-limit-per-minute: 30    # 单实例内存滑动窗口；防「把调试台当扫描器用」
    # 是否允许使用者自行填写 Authorization 并转发。默认 false = 平台不代持/不转发任何会话凭据（凭据剥离）。
    allow-user-authorization: false
    # 命中同源（self-base-url）时豁免内网网段检查：本系统自身的 API 在开发/内网部署时本就绑在
    # 127.0.0.1 / 10.x / 192.168.x 上，一律按内网拒绝会让本页完全不可用。豁免严格限定为
    # 「origin 与 self-base-url 完全相同」，使用者无法借它去打 127.0.0.1:其它端口 / 169.254.169.254。
    exempt-self-origin-from-private-ip-check: true

# 系统管理配置
system:
  super-admin:
    # 超级管理员角色编码列表（匹配任一即视为超管）
    role-codes:
      - SUPER_ADMIN
      - admin
      - super_admin

# 密码策略配置
password:
  policy:
    max-age-days: 90

# ── 地图服务配置（全平台单一入口）──
# 消费方：DMS《路线规划》（dms.map.*：路径规划/地理编码/逆编码/围栏）
#         配送路线单《优化/重新规划/导航》（amap.key，erp-delivery-route）
# 优先级：环境变量/启动参数 > 外部化配置文件 > 《配送参数》数据库配置 > 内置默认（直线降级模式）
# ⚠️ 必须声明在 core-api 的配置里：各业务模块自带的 application.yml 位于嵌套 jar 内、
#    **不会被 core-api 加载**，只在模块 yml 写 ${AMAP_API_KEY:} 是读不到的（表现为始终降级）。
# 配置落位与四种方式见《路线规划开发文档》§8「地图服务 Key 配置落位」。
dms:
  map:
    # 默认服务商：amap / tencent / baidu（未配置对应 Key 时自动降级为 local 直线模式）
    default-provider: ${DMS_MAP_DEFAULT_PROVIDER:amap}
    amap:
      api-key: ${AMAP_API_KEY:}
      # 前端底图用（JS SDK Key，公开+域名限制）；不配则前端用自研矢量画布
      js-key: ${AMAP_JS_KEY:}
    tencent:
      api-key: ${TENCENT_MAP_API_KEY:}
    baidu:
      api-key: ${BAIDU_MAP_API_KEY:}

  # ── 运力渠道适配器开关（《渠道管理》配送 → 配送配置 → 渠道管理）──
  # 默认仅装配「自有员工」内部运力适配器；外部平台适配器当前为**未对接占位**：
  # 即使开启也如实返回「未实现」，不返回模拟单号/模拟坐标（金标准红线：无桩、无模拟）。
  # 接入真实平台时覆写适配器的 check()/fetchRiders()/createOrder 即可，页面与接口无需改动。
  # 凭据加密密钥优先级：环境变量 DMS_CHANNEL_ENCRYPT_KEY > 配置中心 dms.channel.config.encrypt-key > 内置默认（仅开发）。
  channel:
    encrypt-key: ${DMS_CHANNEL_ENCRYPT_KEY:}
    own:
      enabled: ${DMS_CHANNEL_OWN_ENABLED:true}
    dada:
      enabled: ${DMS_CHANNEL_DADA_ENABLED:false}
    meituan:
      enabled: ${DMS_CHANNEL_MEITUAN_ENABLED:false}
    shunfeng:
      enabled: ${DMS_CHANNEL_SHUNFENG_ENABLED:false}
    taxi:
      enabled: ${DMS_CHANNEL_TAXI_ENABLED:false}

# 短信通道（core-base 消息底座 msgType=3）：配送 ETA 通知等短信统一走此处。
# 未配置（enabled=false 或 endpoint 为空）时，消息保持「待发送」并按底座策略重试 3 次后标记失败；
# 不会静默丢弃，业务侧可在《配送路线单 → 通知台账》查看发送结果。
sms:
  enabled: ${SMS_ENABLED:false}
  endpoint: ${SMS_ENDPOINT:}
  access-key: ${SMS_ACCESS_KEY:}
  sign-name: ${SMS_SIGN_NAME:}
  timeout-millis: ${SMS_TIMEOUT_MILLIS:5000}

# Actuator 可观测性端点（Prometheus 指标导出）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ai-ready