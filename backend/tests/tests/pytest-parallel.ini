[pytest]
# 并行测试配置

# 测试路径
testpaths = tests/api tests/e2e tests/integration tests/unit

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 并行测试选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -n auto
    --dist=loadfile
    --maxprocesses=8

# 标记定义
markers =
    serial: 串行测试（不支持并行）
    parallel: 并行测试
    ai: AI模块测试
    e2e: 端到端测试
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试
    api: API测试
    integration: 集成测试
    performance: 性能测试
    security: 安全测试
    unit: 单元测试

# 忽略目录
norecursedirs = .git .tox build dist *.egg venv __pycache__ .pytest_cache

# 环境变量
env = 
    TEST_ENV=test
    PYTHONPATH=.
    PYTEST_XDIST_AUTO_NUM_WORKERS=8
