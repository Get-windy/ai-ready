  # AI模块缓存
  sprint-redis-ai:
    image: redis:7-alpine
    container_name: sprint-redis-ai-27-1
    restart: unless-stopped
    ports:
      - "6375:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --databases 8
      --requirepass sprint_redis_ai_pass_2026
    volumes:
      - sprint-redis-ai-data:/data
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============ 监控服务 ============
  sprint-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: sprint-prometheus-27-1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-sprint/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-sprint/rules:/etc/prometheus/rules:ro
      - sprint-prometheus-data:/prometheus/data
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus/data'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - sprint-27-1-test-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  sprint-grafana:
    image: grafana/grafana:10.2.0
    container_name: sprint-grafana-27-1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: sprint_admin
      GF_SECURITY_ADMIN_PASSWORD: sprint_admin_2026
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: redis-datasource,postgres-datasource
    volumes:
      - sprint-grafana-data:/var/lib/grafana
      - ./grafana-sprint/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-sprint/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - sprint-27-1-test-net
    depends_on:
      - sprint-prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M