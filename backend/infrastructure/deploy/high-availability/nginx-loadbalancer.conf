# AI-Ready 测试环境高可用负载均衡器配置
# 支持：SSL终止、健康检查、会话保持、故障转移

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # 基础配置
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream_addr=$upstream_addr upstream_status=$upstream_status '
                    'request_time=$request_time upstream_response_time=$upstream_response_time';
    
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    
    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 100m;
    client_body_buffer_size 128k;
    
    # 连接限制
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_conn conn_limit_per_ip 100;
    
    # 请求频率限制
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # 上游服务定义（负载均衡后端）
    upstream frontend_servers {
        # 基于IP的会话保持
        ip_hash;
        
        # 健康检查配置
        server frontend-1:80 max_fails=3 fail_timeout=30s;
        server frontend-2:80 max_fails=3 fail_timeout=30s;
        server frontend-3:80 max_fails=3 fail_timeout=30s backup;
        
        # 健康检查
        health_check interval=10s fails=3 passes=2 uri=/health;
        keepalive 32;
    }
    
    upstream api_gateway_servers {
        # 加权轮询
        server api-gateway-1:8080 weight=3 max_fails=3 fail_timeout=30s;
        server api-gateway-2:8080 weight=2 max_fails=3 fail_timeout=30s;
        server api-gateway-3:8080 weight=1 max_fails=3 fail_timeout=30s backup;
        
        # 健康检查
        health_check interval=10s fails=3 passes=2 uri=/actuator/health;
        keepalive 32;
    }
    
    upstream inventory_service_servers {
        # 最小连接数
        least_conn;
        
        server inventory-service-1:8082 max_fails=3 fail_timeout=30s;
        server inventory-service-2:8082 max_fails=3 fail_timeout=30s;
        
        # 健康检查
        health_check interval=10s fails=3 passes=2 uri=/actuator/health;
        keepalive 32;
    }
    
    upstream finance_service_servers {
        # 最小连接数
        least_conn;
        
        server finance-service-1:8081 max_fails=3 fail_timeout=30s;
        server finance-service-2:8081 max_fails=3 fail_timeout=30s;
        
        # 健康检查
        health_check interval=10s fails=3 passes=2 uri=/actuator/health;
        keepalive 32;
    }
    
    # SSL/TLS配置
    ssl_certificate /etc/nginx/ssl/ai-ready-test.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-ready-test.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 服务器配置
    server {
        listen 80 default_server;
        server_name ai-ready-test.local;
        
        # HTTP重定向到HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name ai-ready-test.local;
        
        # SSL配置
        ssl_certificate /etc/nginx/ssl/ai-ready-test.crt;
        ssl_certificate_key /etc/nginx/ssl/ai-ready-test.key;
        
        # 安全头部
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
        
        # 前端服务路由
        location / {
            # 限流
            limit_req zone=req_limit_per_ip burst=20 nodelay;
            
            # 反向代理配置
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            
            # 超时配置
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # 缓冲区配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # 缓存配置
            proxy_cache off;
        }
        
        # API Gateway路由
        location /api/ {
            # 限流
            limit_req zone=req_limit_per_ip burst=30 nodelay;
            
            # 反向代理配置
            proxy_pass http://api_gateway_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS配置
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }
        
        # 监控系统路由
        location /monitoring/ {
            # 反向代理到Prometheus
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # 基础认证
            auth_basic "Monitoring Area";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        
        # Grafana路由
        location /grafana/ {
            # 反向代理到Grafana
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Websocket支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            
            # 基础认证
            auth_basic "Grafana Dashboard";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }
        
        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # 状态页面
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 172.30.0.0/16;  # 内部网络
            deny all;
        }
        
        # 静态文件缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # 尝试从本地文件系统获取
            root /usr/share/nginx/html;
            try_files $uri @proxy;
        }
        
        location @proxy {
            proxy_pass http://frontend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
    
    # 后端API服务器（不暴露给外网）
    server {
        listen 8081;
        server_name internal-api.local;
        
        # 仅允许内部网络访问
        allow 172.30.0.0/16;
        deny all;
        
        location / {
            proxy_pass http://api_gateway_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}