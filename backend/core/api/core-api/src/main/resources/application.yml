# Spring Boot 配置
server:
  port: 5655

spring:
  application:
    name: ai-ready-gateway
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 7200
  active-timeout: 1800
  # 禁止同账号多地并发登录：新登录会踢掉旧会话
  is-concurrent: false
  # 同账号登录时是否共享 Token（is-concurrent=false 时此配置不生效）
  is-share: false
  # 被踢下线后，再次访问时提示
  is-login-kick: true
  token-style: jwt
  jwt-secret: ${SA_TOKEN_JWT_SECRET:ai-ready-production-jwt-secret-key-2024}
  is-log: false
  is-read-header: true
  is-read-cookie: false
  token-prefix: "Bearer"

# 日志配置
logging:
  level:
    root: INFO
    cn.aiedge: INFO
    org.springframework.cloud.gateway: INFO

# 密码策略配置
password:
  policy:
    max-age-days: 90