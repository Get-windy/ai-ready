[pytest]
# 测试路径
testpaths = tests/api tests/e2e

# 测试文件匹配规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 标记定义
markers =
    ai: AI模块测试
    e2e: 端到端测试
    mock: Mock模式测试
    real: 真实服务测试
    core: 核心模块测试
    approval: 智能审批模块
    recommendation: 智能推荐模块
    report: 智能报表模块
    search: 智能搜索模块
    dialog: 智能对话模块
    smoke: 冒烟测试
    regression: 回归测试
    slow: 慢速测试
    api: API测试
    integration: 集成测试

# 忽略目录
norecursedirs = .git .tox build dist *.egg venv

# 环境变量
env = 
    TEST_ENV=test
    PYTHONPATH=.
