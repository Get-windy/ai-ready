global:
  # SMTP邮件配置 (保留原有的邮件通知)
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alert@ai-ready.com'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: false

  # 默认_resolve消息配置
  resolve_timeout: 5m

# 告警模板配置
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 路由配置
route:
  # 默认路由配置
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s      # 等待30秒收集同组告警
  group_interval: 5m   # 每5分钟发送一次同组新告警
  repeat_interval: 4h  # 每4小时重复发送未解决的告警
  receiver: 'default'

  # 子路由配置
  routes:
    # 🔴 严重告警 - 企业微信 + 邮件 + Webhook
    - match:
        severity: critical
      receiver: 'wecom-critical'
      continue: true
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 1h

    - match:
        severity: critical
      receiver: 'email-critical'
      continue: true

    - match:
        severity: critical
      receiver: 'webhook-critical'

    # ⚠️ 警告告警 - 企业微信 + Webhook
    - match:
        severity: warning
      receiver: 'wecom-warning'
      continue: true
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

    - match:
        severity: warning
      receiver: 'webhook-warning'

    # 📊 数据库告警 - 专门的接收器
    - match:
      category: database
      receiver: 'database-team'

    # 📝 日志告警 - 专门的接收器
    - match:
      category: logs
      receiver: 'logs-monitor'

    # 💼 业务告警 - 专门的接收器
    - match:
      category: business
      receiver: 'business-team'

    # 📱 系统告警 - 专门的接收器
    - match:
      category: system
      receiver: 'system-team'

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default'
    webhook_configs:
      - url: 'http://api-gateway:8080/api/alerts/webhook'
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json

  # 🔴 严重告警企业微信接收器
  - name: 'wecom-critical'
    webhook_configs:
      # 企业微信机器人 Webhook URL (需要配置)
      - url: '${WECOM_WEBHOOK_URL}'
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json
        # 消息模板 (使用企业微信卡片消息格式)
        max_alerts: 10

  # 📧 严重告警邮件接收器
  - name: 'email-critical'
    email_configs:
      - to: 'admin@ai-ready.com,devops@ai-ready.com,oncall@ai-ready.com'
        subject: '[🔴 CRITICAL] AI-Ready 告警: {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: red;">🔴 严重告警通知</h2>
          <table border="1" cellpadding="5">
            <tr><td><b>告警名称</b></td><td>{{ .GroupLabels.alertname }}</td></tr>
            <tr><td><b>严重程度</b></td><td style="color: red;">{{ .GroupLabels.severity }}</td></tr>
            <tr><td><b>服务</b></td><td>{{ .GroupLabels.service }}</td></tr>
            <tr><td><b>实例</b></td><td>{{ .CommonLabels.instance }}</td></tr>
            <tr><td><b>触发时间</b></td><td>{{ .StartsAt.Format "2006-01-02 15:04:05" }}</td></tr>
          </table>
          <h3>详细信息:</h3>
          {{ range .Alerts }}
          <p><b>{{ .Annotations.summary }}</b><br/>
          {{ .Annotations.description }}</p>
          {{ end }}

  # 🔴 严重告警Webhook接收器
  - name: 'webhook-critical'
    webhook_configs:
      - url: 'http://api-gateway:8080/api/alerts/webhook/critical'
        send_resolved: true
        http_config:
          headers:
            Authorization: 'Bearer ${ALERT_TOKEN}'
            Content-Type: application/json

  # ⚠️ 警告告警企业微信接收器
  - name: 'wecom-warning'
    webhook_configs:
      - url: '${WECOM_WEBHOOK_URL}'
        send_resolved: true
        max_alerts: 20

  # ⚠️ 警告告警Webhook接收器
  - name: 'webhook-warning'
    webhook_configs:
      - url: 'http://api-gateway:8080/api/alerts/webhook/warning'
        send_resolved: true

  # 📊 数据库团队接收器
  - name: 'database-team'
    webhook_configs:
      - url: 'http://api-gateway:8080/api/alerts/webhook/database'
        send_resolved: true
    email_configs:
      - to: 'database@ai-ready.com'
        subject: '[📊 DB] AI-Ready 数据库告警: {{ .GroupLabels.alertname }}'

  # 📝 日志监控接收器
  - name: 'logs-monitor'
    webhook_configs:
      - url: 'http://elasticsearch:9200/_bulk'
        send_resolved: true

  # 💼 业务团队接收器
  - name: 'business-team'
    webhook_configs:
      - url: 'http://api-gateway:8080/api/alerts/webhook/business'
        send_resolved: true
    email_configs:
      - to: 'business@ai-ready.com'
        subject: '[💼 BIZ] AI-Ready 业务告警: {{ .GroupLabels.alertname }}'

  # 📱 系统团队接收器
  - name: 'system-team'
    webhook_configs:
      - url: 'http://api-gateway:8080/api/alerts/webhook/system'
        send_resolved: true
    email_configs:
      - to: 'system@ai-ready.com'
        subject: '[📱 SYS] AI-Ready 系统告警: {{ .GroupLabels.alertname }}'

# 告警抑制规则 (防止告警风暴)
inhibit_rules:
  # 如果节点宕机，抑制该节点上的所有服务告警
  - source_match:
      alertname: 'NodeDown'
    target_match_re:
      alertname: '.*ServiceDown|.*Container.*'
    equal: ['instance']

  # 如果API Gateway宕机，抑制所有业务服务告警
  - source_match:
      alertname: 'APIGatewayDown'
    target_match_re:
      alertname: '.*Service.*'
    equal: ['service']

  # 如果系统CPU严重过高，抑制CPU警告告警
  - source_match:
      alertname: 'CriticalCPUUsage'
    target_match:
      alertname: 'HighCPUUsage'
    equal: ['instance']

  # 如果系统内存严重过高，抑制内存警告告警
  - source_match:
      alertname: 'CriticalMemoryUsage'
    target_match:
      alertname: 'HighMemoryUsage'
    equal: ['instance']

  # 如果磁盘空间即将耗尽，抑制磁盘使用率警告告警
  - source_match:
      alertname: 'CriticalDiskUsage'
    target_match:
      alertname: 'HighDiskUsage'
    equal: ['mountpoint']