# 财务管理模块测试环境配置
server:
  port: 0  # 随机端口，避免冲突

spring:
  application:
    name: finance-management-service-test
  
  # 测试数据库配置（使用H2内存数据库）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ai_ready_finance_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  # Redis配置（使用测试Redis）
  redis:
    host: localhost
    port: 6379
    database: 15
  
  # RabbitMQ配置（禁用）
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# 测试环境财务管理配置
finance:
  accounting:
    fiscal-year-start-month: 1
    auto-close-period: false
    close-warning-days: 1
  
  budget:
    approval-required: false
    approval-threshold: 1000
    variance-alert-percentage: 20
  
  payment:
    gateway:
      default: test
      supported: [test]
    retry:
      max-attempts: 1
      delay-ms: 100
  
  report:
    export-formats: [csv]
    max-rows: 100
    cache-duration-minutes: 1

# 测试安全配置
security:
  jwt:
    secret: test_secret_key_for_finance_management
    expiration: 3600000
  cors:
    allowed-origins: 
      - http://localhost:8080
    allowed-methods: 
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS

# 测试监控配置
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 测试日志配置
logging:
  level:
    cn.aiedge.finance: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN