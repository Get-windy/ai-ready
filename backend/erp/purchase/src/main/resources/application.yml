# 采购管理模块配置
server:
  port: 8081
  servlet:
    context-path: /purchase
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: erp-purchase-service
  
  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    # 默认PostgreSQL, 可选MySQL: jdbc:mysql://localhost:3306/erp_purchase?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    url: jdbc:postgresql://localhost:5432/erp_purchase
    username: purchase_user
    password: ${DB_PASSWORD:SecurePassword123!}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    database: 1
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: -1ms
  
  # RabbitMQ配置
  rabbitmq:
    host: localhost
    port: 5672
    username: purchase_user
    password: ${MQ_PASSWORD:SecureMQPass123!}
    virtual-host: /erp_purchase
    publisher-confirms: true
    publisher-returns: true
    template:
      mandatory: true
  
  # JPA/Hibernate配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  
  # 缓存配置
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.aiedge.erp.purchase.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token配置
sa-token:
  token-name: Authorization
  timeout: 1800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false
  jwt-secret-key: erp-purchase-jwt-key-change-in-production

# 日志配置
logging:
  level:
    cn.aiedge.erp.purchase: DEBUG
    org.springframework.web: INFO
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/erp-purchase.log
    max-size: 50MB
    max-history: 30

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# 采购管理模块特定配置
erp:
  purchase:
    # API配置
    api:
      prefix: /api/v1/purchase
      admin-prefix: /api/admin/purchase
      mobile-prefix: /api/mobile/purchase
    # 业务配置
    business:
      default-currency: CNY
      tax-rate: 0.13
      approval-threshold: 10000.00
      auto-approve-enabled: true
    # 集成配置
    integration:
      finance:
        base-url: http://localhost:8082/finance
        timeout: 5000
      stock:
        base-url: http://localhost:8083/stock
        timeout: 5000
      supplier:
        base-url: http://localhost:8084/supplier
        timeout: 3000
    # 安全配置
    security:
      allowed-origins: http://localhost:3000,http://localhost:8080
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      max-age: 3600