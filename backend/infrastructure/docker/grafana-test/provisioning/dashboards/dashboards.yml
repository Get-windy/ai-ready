# Grafana Dashboard 自动配置
# Version: v1.0.0
# 创建日期: 2026-04-28

apiVersion: 1

providers:
  # AI-Ready 测试环境 Dashboard
  - name: 'AI-Ready Test Environment'
    orgId: 1
    folder: 'AI-Ready'
    folderUid: 'ai-ready'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/ai-ready
      foldersFromFilesStructure: false

  # 系统监控 Dashboard
  - name: 'System Monitoring'
    orgId: 1
    folder: 'System'
    folderUid: 'system'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/system
      foldersFromFilesStructure: false