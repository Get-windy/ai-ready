# ERP Modules System Alerts
# 系统级监控告警规则

groups:
  - name: erp_system_alerts
    interval: 30s
    rules:
      # 容器状态告警
      - alert: ContainerDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
          module: erp
        annotations:
          summary: "ERP模块容器停止运行"
          description: "模块 {{ $labels.job }} 已停止超过5分钟，请立即检查"

      # CPU使用率告警
      - alert: HighCPUUsage
        expr: process_cpu_usage > 0.8
        for: 5m
        labels:
          severity: warning
          module: erp
        annotations:
          summary: "ERP模块CPU使用率过高"
          description: "模块 {{ $labels.instance }} CPU使用率 {{ $value | humanizePercentage }}，持续5分钟"

      # 内存使用率告警
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          module: erp
        annotations:
          summary: "ERP模块内存使用率过高"
          description: "模块 {{ $labels.instance }} 内存使用率 {{ $value | humanizePercentage }}，持续5分钟"

      # JVM堆内存告警
      - alert: JVMHeapMemoryHigh
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.9
        for: 10m
        labels:
          severity: critical
          module: erp
        annotations:
          summary: "JVM堆内存接近上限"
          description: "模块 {{ $labels.instance }} JVM堆内存使用率 {{ $value | humanizePercentage }}，可能需要调整内存配置"

      # 响应时间告警
      - alert: SlowResponseTime
        expr: http_server_requests_seconds_mean > 2
        for: 5m
        labels:
          severity: warning
          module: erp
        annotations:
          summary: "ERP模块响应时间过长"
          description: "模块 {{ $labels.instance }} 平均响应时间 {{ $value }}秒，持续5分钟"

      # 错误率告警
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          module: erp
        annotations:
          summary: "ERP模块错误率过高"
          description: "模块 {{ $labels.instance }} 5xx错误率 {{ $value | humanizePercentage }}，持续5分钟"

      # 数据库连接池告警
      - alert: DatabaseConnectionPoolLow
        expr: hikaricp_connections_available < 5
        for: 5m
        labels:
          severity: warning
          module: erp
        annotations:
          summary: "数据库连接池可用连接过少"
          description: "模块 {{ $labels.instance }} 可用数据库连接 {{ $value }}个，可能影响性能"

      # Redis连接告警
      - alert: RedisConnectionFailed
        expr: redis_connected_clients == 0
        for: 5m
        labels:
          severity: critical
          module: erp
        annotations:
          summary: "Redis连接失败"
          description: "模块 {{ $labels.instance }} 无法连接到Redis，请检查Redis服务状态"

  - name: database_alerts
    interval: 30s
    rules:
      # PostgreSQL连接数告警
      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count > 100
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL连接数过高"
          description: "PostgreSQL活动连接数 {{ $value }}，可能影响性能"

      # PostgreSQL磁盘空间告警
      - alert: PostgreSQLDiskSpaceLow
        expr: pg_database_size_bytes / 10737418240 > 0.9  # 10GB
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL数据库空间不足"
          description: "数据库大小 {{ $value | humanizeBytes }}，磁盘空间接近上限"

      # Redis内存告警
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis内存使用率过高"
          description: "Redis内存使用率 {{ $value | humanizePercentage }}，持续5分钟"

  - name: container_alerts
    interval: 30s
    rules:
      # 容器重启告警
      - alert: ContainerRestartFrequent
        expr: increase(container_restart_count[1h]) > 3
        for: 5m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "容器频繁重启"
          description: "容器 {{ $labels.name }} 在过去1小时内重启{{ $value }}次，请检查容器稳定性"

      # 容器CPU限制告警
      - alert: ContainerCPUThrottling
        expr: rate(container_cpu_cfs_throttled_seconds_total[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
          component: container
        annotations:
          summary: "容器CPU被频繁限制"
          description: "容器 {{ $labels.name }} CPU被限制 {{ $value | humanizeDuration }}，可能需要调整资源配额"