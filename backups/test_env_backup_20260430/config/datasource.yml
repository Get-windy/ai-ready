# 数据库配置
datasources:
  primary:
    jdbc-url: jdbc:postgresql://localhost:5432/ai_ready
    username: app_user
    password: ${DB_PASSWORD}
    connection-timeout: 30000
    maximum-pool-size: 20
    minimum-idle: 5
    
  replica:
    jdbc-url: jdbc:postgresql://replica:5432/ai_ready
    username: app_user
    password: ${DB_PASSWORD}
    read-only: true
    
redis:
  sentinel:
    master: mymaster
    nodes:
      - redis1:26379
      - redis2:26379
      - redis3:26379
  timeout: 2000
