# API监控告警规则
# 定义API性能和健康度告警

groups:
  - name: api_performance
    interval: 30s
    rules:
      # 响应时间告警 - Warning
      - alert: APIHighResponseTime
        expr: api_response_time_ms > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API响应时间过长"
          description: "API端点 {{ $labels.endpoint }} 响应时间为 {{ $value }}ms，超过阈值1000ms"
      
      # 响应时间告警 - Critical
      - alert: APICriticalResponseTime
        expr: api_response_time_ms > 3000
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API响应时间严重超标"
          description: "API端点 {{ $labels.endpoint }} 响应时间为 {{ $value }}ms，超过阈值3000ms"
      
      # 错误率告警 - Warning
      - alert: APIHighErrorRate
        expr: |
          (
            sum(rate(api_errors_total[5m])) by (endpoint)
            /
            sum(rate(api_requests_total[5m])) by (endpoint)
          ) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API错误率过高"
          description: "API端点 {{ $labels.endpoint }} 错误率为 {{ $value | humanizePercentage }}，超过阈值5%"
      
      # 错误率告警 - Critical
      - alert: APICriticalErrorRate
        expr: |
          (
            sum(rate(api_errors_total[5m])) by (endpoint)
            /
            sum(rate(api_requests_total[5m])) by (endpoint)
          ) > 0.20
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API错误率严重超标"
          description: "API端点 {{ $labels.endpoint }} 错误率为 {{ $value | humanizePercentage }}，超过阈值20%"
      
      # 可用性告警
      - alert: APILowAvailability
        expr: |
          (
            sum(rate(api_requests_total[5m])) by (endpoint)
            -
            sum(rate(api_errors_total[5m])) by (endpoint)
          )
          /
          sum(rate(api_requests_total[5m])) by (endpoint)
          < 0.95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API可用性低"
          description: "API端点 {{ $labels.endpoint }} 可用性为 {{ $value | humanizePercentage }}，低于阈值95%"
      
      # 请求量异常告警
      - alert: APILowRequestRate
        expr: sum(rate(api_requests_total[5m])) by (endpoint) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API请求量异常低"
          description: "API端点 {{ $labels.endpoint }} 请求量异常低，可能服务不可用"

  - name: api_health
    interval: 30s
    rules:
      # 服务宕机告警
      - alert: APIServiceDown
        expr: up{job="api-monitor"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API监控服务宕机"
          description: "API监控服务 {{ $labels.instance }} 已宕机超过30秒"
      
      # 端点健康检查失败
      - alert: APIEndpointDown
        expr: api_response_time_ms == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API端点不可用"
          description: "API端点 {{ $labels.endpoint }} 无法访问，请检查服务状态"
