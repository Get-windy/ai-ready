# AI-Ready Test Environment API Gateway Configuration
# API Gateway (Nginx) - Routes requests to microservices

upstream user-service {
    server localhost:8081;
    server localhost:8082;
}

upstream order-service {
    server localhost:8083;
}

upstream inventory-service {
    server localhost:8085;
}

upstream monitoring-service {
    server localhost:8086;
}

server {
    listen 8080;
    server_name localhost;
    
    # Logging
    access_log /var/log/nginx/api-gateway-access.log;
    error_log /var/log/nginx/api-gateway-error.log;
    
    # API Gateway Routes
    location /api/users/ {
        proxy_pass http://user-service/api/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /api/orders/ {
        proxy_pass http://order-service/api/orders/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /api/inventory/ {
        proxy_pass http://inventory-service/api/inventory/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    location /api/monitoring/ {
        proxy_pass http://monitoring-service/api/monitoring/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Health Check Endpoint
    location /actuator/health {
        proxy_pass http://localhost:8086/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # Root - API Discovery
    location / {
        default_type application/json;
        return 200 '{"status":"OK","services":{"users":"/api/users/","orders":"/api/orders/","inventory":"/api/inventory/","monitoring":"/api/monitoring/","health":"/actuator/health"}}';
    }
}
