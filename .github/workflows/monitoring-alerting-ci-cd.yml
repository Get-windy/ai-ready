# Sprint 29 监控告警模块 CI/CD 流水线
# GitHub Actions 工作流配置
# 版本: v1.0
# 最后更新: 2026-04-27

name: Monitoring Alerting Module CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/monitoring/**'
      - 'backend/alerting/**'
      - '.github/workflows/monitoring-alerting-ci-cd.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/monitoring/**'
      - 'backend/alerting/**'
  schedule:
    - cron: '0 0 * * 0'  # 每周日运行完整性检查
  workflow_dispatch:      # 支持手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/monitoring-alerting
  VERSION: ${{ github.sha }}

jobs:
  # CI 阶段：代码质量检查
  ci-checks:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-
    
    - name: Cache Node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: ${{ runner.os }}-npm-
    
    - name: Run code quality checks
      run: |
        echo "Running code quality checks..."
        # Maven 检查
        mvn -f backend/monitoring/pom.xml clean compile test-compile
        # 代码风格检查
        mvn -f backend/monitoring/pom.xml spotless:check
        # 依赖检查
        mvn -f backend/monitoring/pom.xml dependency-check:check
    
    - name: Run security scanning
      uses: snyk/actions/maven@master
      with:
        args: --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    
    - name: Run unit tests
      run: |
        echo "Running unit tests..."
        mvn -f backend/monitoring/pom.xml test -DskipTests=false
        
        # 生成测试报告
        mvn -f backend/monitoring/pom.xml jacoco:report
        
        # 检查测试覆盖率
        python -c "
        import xml.etree.ElementTree as ET
        tree = ET.parse('backend/monitoring/target/site/jacoco/jacoco.xml')
        root = tree.getroot()
        coverage = float(root.find('.//counter[@type=\"LINE\"]').get('covered')) / float(root.find('.//counter[@type=\"LINE\"]').get('covered')) * 100
        if coverage < 80:
            print(f'Code coverage is {coverage:.2f}% - below threshold of 80%')
            exit(1)
        else:
            print(f'Code coverage is {coverage:.2f}% - PASS')
        "
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          backend/monitoring/target/surefire-reports/
          backend/monitoring/target/site/jacoco/
        retention-days: 7
  
  # 构建阶段
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: ci-checks
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Build application
      run: |
        echo "Building monitoring-alerting module..."
        mvn -f backend/monitoring/pom.xml clean package -DskipTests
        
        # 验证构建产物
        ls -la backend/monitoring/target/*.jar
    
    - name: Build Docker image
      run: |
        echo "Building Docker image..."
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} -f backend/monitoring/Dockerfile backend/monitoring/
        docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -f backend/monitoring/Dockerfile backend/monitoring/
    
    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload vulnerability scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Save Docker image as artifact
      uses: actions/upload-artifact@v3
      with:
        name: docker-image
        path: |
          backend/monitoring/target/*.jar
        retention-days: 7
  
  # 集成测试阶段
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: success()
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: monitoring_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      prometheus:
        image: prom/prometheus:v2.45.0
        options: >-
          --health-cmd "wget -q --spider http://localhost:9090/-/healthy || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9090:9090
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Run integration tests
      run: |
        echo "Running integration tests..."
        mvn -f backend/monitoring/pom.xml verify -Dit.test=*IntegrationTest -DskipTests=false
        
        # 测试Prometheus连接
        curl -f http://localhost:9090/api/v1/status/runtimeinfo
        echo "Prometheus connection test passed"
    
    - name: Run performance tests
      run: |
        echo "Running performance tests with k6..."
        # 安装k6
        sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
        # 运行性能测试
        k6 run backend/monitoring/src/test/k6/performance-test.js --out json=performance-results.json
        
        # 检查性能指标
        python -c "
        import json
        with open('performance-results.json', 'r') as f:
            for line in f:
                data = json.loads(line)
                if data['type'] == 'Metric':
                    if data['data']['metric'] == 'http_req_duration' and data['data']['type'] == 'trend':
                        p95 = data['data']['values']['p95']
                        if p95 > 500:
                            print(f'P95 response time {p95}ms exceeds threshold of 500ms')
                            exit(1)
                        else:
                            print(f'P95 response time {p95}ms - PASS')
        "
    
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: |
          backend/monitoring/target/failsafe-reports/
          performance-results.json
        retention-days: 7
  
  # 部署阶段
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/develop' && success()
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Kubernetes tools
      run: |
        echo "Setting up Kubernetes tools..."
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
        
        # 安装Helm
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    
    - name: Configure Kubernetes
      run: |
        echo "Configuring Kubernetes..."
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > $HOME/.kube/config
        kubectl config use-context ${{ secrets.K8S_CONTEXT_DEV }}
        kubectl get nodes
    
    - name: Deploy to Kubernetes
      run: |
        echo "Deploying monitoring-alerting to Kubernetes..."
        
        # 部署Prometheus
        kubectl apply -f deploy/helm/prometheus/values-dev.yaml
        helm upgrade --install prometheus prometheus-community/prometheus \
          -f deploy/helm/prometheus/values-dev.yaml \
          --namespace monitoring \
          --create-namespace
        
        # 部署AlertManager
        kubectl apply -f deploy/helm/alertmanager/values-dev.yaml
        helm upgrade --install alertmanager prometheus-community/alertmanager \
          -f deploy/helm/alertmanager/values-dev.yaml \
          --namespace monitoring
        
        # 部署Grafana
        kubectl apply -f deploy/helm/grafana/values-dev.yaml
        helm upgrade --install grafana grafana/grafana \
          -f deploy/helm/grafana/values-dev.yaml \
          --namespace monitoring
        
        # 部署应用
        kubectl apply -f deploy/kubernetes/dev/monitoring-deployment.yaml
        kubectl apply -f deploy/kubernetes/dev/monitoring-service.yaml
        kubectl apply -f deploy/kubernetes/dev/monitoring-ingress.yaml
    
    - name: Wait for deployment
      run: |
        echo "Waiting for deployment to be ready..."
        kubectl rollout status deployment/monitoring-alerting -n monitoring --timeout=300s
        
        # 健康检查
        curl -f http://monitoring-dev.ai-ready.local/actuator/health
        echo "Health check passed"
    
    - name: Send deployment notification
      if: success()
      run: |
        echo "Sending deployment notification..."
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "✅ **监控告警模块部署成功**\n\n> 环境: Development\n> 版本: ${{ env.VERSION }}\n> 时间: $(date)\n> 提交: ${{ github.sha }}\n> 部署者: ${{ github.actor }}\n\n**服务状态**:\n- Prometheus: ✅ 运行中\n- AlertManager: ✅ 运行中\n- Grafana: ✅ 运行中\n- 应用服务: ✅ 运行中\n\n[查看监控面板](http://monitoring-dev.ai-ready.local/grafana)"
            }
          }'
    
    - name: Send deployment failure notification
      if: failure()
      run: |
        echo "Sending deployment failure notification..."
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "❌ **监控告警模块部署失败**\n\n> 环境: Development\n> 版本: ${{ env.VERSION }}\n> 时间: $(date)\n> 提交: ${{ github.sha }}\n> 部署者: ${{ github.actor }}\n\n**错误信息**:\n请查看GitHub Actions日志\n\n**需要立即处理**"
            }
          }'

  # 部署到预发布环境（需要手动批准）
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [integration-test, deploy-dev]
    if: github.ref == 'refs/heads/main' && success()
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Kubernetes tools
      run: |
        echo "Setting up Kubernetes tools..."
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
    
    - name: Configure Kubernetes
      run: |
        echo "Configuring Kubernetes for staging..."
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
        kubectl config use-context ${{ secrets.K8S_CONTEXT_STAGING }}
        kubectl get nodes
    
    - name: Deploy with canary strategy
      run: |
        echo "Deploying with canary strategy..."
        
        # 创建金丝雀部署
        kubectl apply -f deploy/kubernetes/staging/monitoring-canary.yaml
        
        # 等待金丝雀部署就绪
        kubectl rollout status deployment/monitoring-alerting-canary -n monitoring --timeout=300s
        
        # 金丝雀测试
        echo "Running canary tests..."
        curl -f http://monitoring-staging.ai-ready.local/actuator/health
        curl -f http://monitoring-staging.ai-ready.local/api/monitor/metrics
        
        # 如果测试通过，逐步扩大流量
        kubectl scale deployment/monitoring-alerting-canary --replicas=2 -n monitoring
        sleep 30
        kubectl scale deployment/monitoring-alerting --replicas=1 -n monitoring
    
    - name: Send staging deployment notification
      run: |
        echo "Sending staging deployment notification..."
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d '{
            "msgtype": "markdown",
            "markdown": {
              "content": "🟡 **监控告警模块金丝雀部署中**\n\n> 环境: Staging\n> 版本: ${{ env.VERSION }}\n> 时间: $(date)\n> 提交: ${{ github.sha }}\n> 部署者: ${{ github.actor }}\n\n**部署状态**:\n- 金丝雀部署: 2个副本\n- 稳定版本: 1个副本\n- 流量比例: 50%/50%\n\n[查看金丝雀监控](http://monitoring-staging.ai-ready.local/grafana/d/canary)"
            }
          }'

  # 监控告警集成
  monitoring-integration:
    name: Monitoring Integration
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging]
    if: always()
    
    steps:
    - name: Send pipeline status to monitoring
      run: |
        echo "Sending pipeline status to monitoring system..."
        
        PIPELINE_STATUS=${{ job.status }}
        PIPELINE_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        # 发送到Prometheus Pushgateway
        cat <<EOF | curl --data-binary @- http://monitoring-prometheus-pushgateway:9091/metrics/job/github_actions/instance/${{ github.run_id }}
        # TYPE github_actions_pipeline_duration_seconds gauge
        github_actions_pipeline_duration_seconds{repository="${{ github.repository }}", workflow="${{ github.workflow }}", branch="${{ github.ref_name }}"} ${{ job.container.duration }}000
        
        # TYPE github_actions_pipeline_status gauge
        github_actions_pipeline_status{repository="${{ github.repository }}", workflow="${{ github.workflow }}", branch="${{ github.ref_name }}"} $(if [ "$PIPELINE_STATUS" = "success" ]; then echo "1"; else echo "0"; fi)
        
        # TYPE github_actions_deployment_count counter
        github_actions_deployment_count{repository="${{ github.repository }}", environment="development"} 1
        EOF
        
        echo "Pipeline metrics sent to monitoring system"
    
    - name: Update deployment dashboard
      run: |
        echo "Updating deployment dashboard..."
        
        # 更新Grafana注释
        curl -X POST http://monitoring-grafana:3000/api/annotations \
          -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "text": "Deployment: ${{ env.VERSION }}",
            "tags": ["deployment", "${{ github.ref_name }}", "${{ github.actor }}"],
            "time": $(date +%s)000
          }'

  # 制品管理
  artifact-management:
    name: Artifact Management
    runs-on: ubuntu-latest
    needs: [build, integration-test]
    if: success()
    
    steps:
    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Push Docker image
      run: |
        echo "Pushing Docker images to registry..."
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
    
    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        format: 'spdx'
    
    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: sbom.spdx.json
        retention-days: 90
    
    - name: Sign container image
      uses: sigstore/cosign-installer@main
      with:
        cosign-release: 'v2.1.1'
    
    - name: Sign the container image
      run: |
        cosign sign --key env://COSIGN_PRIVATE_KEY ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    
    - name: Upload Helm chart
      run: |
        echo "Packaging Helm chart..."
        helm package deploy/helm/monitoring-alerting --version ${{ env.VERSION }} --app-version ${{ env.VERSION }}
        
        # 推送到Helm仓库
        curl -X POST ${{ secrets.HELM_REPO_URL }}/api/charts \
          -H "Authorization: Bearer ${{ secrets.HELM_REPO_TOKEN }}" \
          -F "chart=@monitoring-alerting-${{ env.VERSION }}.tgz"

# 工作流级别的通知
on-completion:
  needs: [deploy-dev, deploy-staging, monitoring-integration, artifact-management]
  runs-on: ubuntu-latest
  if: always()
  
  steps:
    - name: Send final notification
      run: |
        echo "Sending final workflow notification..."
        
        WORKFLOW_STATUS="${{ job.status }}"
        DURATION="$(( ${{ job.container.duration }} / 60000 ))分钟"
        
        if [ "$WORKFLOW_STATUS" = "success" ]; then
          EMOJI="✅"
          MESSAGE="成功"
        else
          EMOJI="❌"
          MESSAGE="失败"
        fi
        
        curl -X POST ${{ secrets.WECOM_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d "{
            \"msgtype\": \"markdown\",
            \"markdown\": {
              \"content\": \"${EMOJI} **监控告警模块CI/CD流水线完成**\\n\\n> 状态: ${MESSAGE}\\n> 持续时间: ${DURATION}\\n> 工作流: ${{ github.workflow }}\\n> 分支: ${{ github.ref_name }}\\n> 提交: ${{ github.sha }}\\n> 触发者: ${{ github.actor }}\\n\\n**各阶段状态**:\\n- CI检查: ${{ needs.ci-checks.result }}\\n- 构建: ${{ needs.build.result }}\\n- 集成测试: ${{ needs.integration-test.result }}\\n- 开发环境部署: ${{ needs.deploy-dev.result }}\\n- 制品管理: ${{ needs.artifact-management.result }}\\n\\n[查看详细日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
            }
          }"