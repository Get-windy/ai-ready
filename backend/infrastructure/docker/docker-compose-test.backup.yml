# AI-Ready Docker 容器化测试环境配置
# Version: v1.0.0
# 创建日期: 2026-04-24
# 用途: 统一测试环境，支持前端、后端各模块、数据库集群、缓存集群、消息队列、监控服务

version: '3.8'

# ==================== 全局配置 ====================
x-common-env: &common-env
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: test

x-healthcheck-config: &healthcheck-config
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-java-options: &java-options
  JAVA_OPTS: >-
    -Xms256m -Xmx512m
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200

# ==================== 网络配置 ====================
networks:
  ai-ready-test-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
    name: ai-ready-test-network

# ==================== 数据卷配置 ====================
volumes:
  # PostgreSQL 数据卷
  postgres-main-data:
    driver: local
  postgres-inventory-data:
    driver: local
  postgres-finance-data:
    driver: local
  postgres-ai-data:
    driver: local
  postgres-data-data:
    driver: local
  
  # Redis 数据卷
  redis-main-data:
    driver: local
  redis-inventory-data:
    driver: local
  redis-finance-data:
    driver: local
  redis-ai-data:
    driver: local
  redis-data-data:
    driver: local
  
  # Kafka 数据卷
  kafka-data:
    driver: local
  zookeeper-data:
    driver: local
  
  # 监控数据卷
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  
  # 应用日志
  api-gateway-logs:
    driver: local
  inventory-logs:
    driver: local
  finance-logs:
    driver: local
  ai-logs:
    driver: local
  data-logs:
    driver: local

# ==================== 服务配置 ====================
services:
  # ============ 前端服务 ============
  frontend:
    image: nginx:alpine
    container_name: ai-ready-frontend-test
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      <<: *common-env
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - ai-ready-test-net
    depends_on:
      - api-gateway
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "nginx", "-t"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============ API Gateway ============
  api-gateway:
    build:
      context: ../../../
      dockerfile: backend/api-gateway/Dockerfile
    image: ai-ready/api-gateway:test
    container_name: ai-ready-api-gateway-test
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-main:5432/gateway_db
      SPRING_DATASOURCE_USERNAME: gateway_user
      SPRING_DATASOURCE_PASSWORD: gateway_pass_2026
      SPRING_REDIS_HOST: redis-main
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 0
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      FINANCE_SERVICE_URL: http://finance-service:8081
      AI_SERVICE_URL: http://ai-service:8083
      DATA_SERVICE_URL: http://data-service:8084
    volumes:
      - api-gateway-logs:/app/logs
    networks:
      - ai-ready-test-net
    depends_on:
      postgres-main:
        condition: service_healthy
      redis-main:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ 库存管理服务 ============
  inventory-service:
    build:
      context: ../../../
      dockerfile: backend/inventory/Dockerfile
    image: ai-ready/inventory:test
    container_name: ai-ready-inventory-test
    restart: unless-stopped
    ports:
      - "8082:8082"
      - "9092:9092"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: inventory_pass_2026
      SPRING_REDIS_HOST: redis-inventory
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: inventory-events
    volumes:
      - inventory-logs:/app/logs
    networks:
      - ai-ready-test-net
    depends_on:
      postgres-inventory:
        condition: service_healthy
      redis-inventory:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ 财务管理服务 ============
  finance-service:
    build:
      context: ../../../
      dockerfile: backend/finance/Dockerfile
    image: ai-ready/finance:test
    container_name: ai-ready-finance-test
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-finance:5432/finance_db
      SPRING_DATASOURCE_USERNAME: finance_user
      SPRING_DATASOURCE_PASSWORD: finance_pass_2026
      SPRING_REDIS_HOST: redis-finance
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 2
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: finance-events
    volumes:
      - finance-logs:/app/logs
    networks:
      - ai-ready-test-net
    depends_on:
      postgres-finance:
        condition: service_healthy
      redis-finance:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ AI智能服务 ============
  ai-service:
    build:
      context: ../../../
      dockerfile: backend/ai-service/Dockerfile
    image: ai-ready/ai:test
    container_name: ai-ready-ai-test
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-ai:5432/ai_db
      SPRING_DATASOURCE_USERNAME: ai_user
      SPRING_DATASOURCE_PASSWORD: ai_pass_2026
      SPRING_REDIS_HOST: redis-ai
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 3
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ai-events
    volumes:
      - ai-logs:/app/logs
    networks:
      - ai-ready-test-net
    depends_on:
      postgres-ai:
        condition: service_healthy
      redis-ai:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ 数据管理服务 ============
  data-service:
    build:
      context: ../../../
      dockerfile: backend/data-service/Dockerfile
    image: ai-ready/data:test
    container_name: ai-ready-data-test
    restart: unless-stopped
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      <<: *common-env
      <<: *java-options
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-data:5432/data_db
      SPRING_DATASOURCE_USERNAME: data_user
      SPRING_DATASOURCE_PASSWORD: data_pass_2026
      SPRING_REDIS_HOST: redis-data
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 4
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: data-events
    volumes:
      - data-logs:/app/logs
    networks:
      - ai-ready-test-net
    depends_on:
      postgres-data:
        condition: service_healthy
      redis-data:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      <<: *healthcheck-config
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============ PostgreSQL 集群 ============
  # 主数据库
  postgres-main:
    image: postgres:14-alpine
    container_name: ai-ready-postgres-main-test
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_pass_2026
      POSTGRES_DB: gateway_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-main-data:/var/lib/postgresql/data
      - ./init-scripts/main:/docker-entrypoint-initdb.d:ro
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d gateway_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # 库存模块数据库
  postgres-inventory:
    image: postgres:14-alpine
    container_name: ai-ready-postgres-inventory-test
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass_2026
      POSTGRES_DB: inventory_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
      - ./init-scripts/inventory:/docker-entrypoint-initdb.d:ro
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 财务模块数据库
  postgres-finance:
    image: postgres:14-alpine
    container_name: ai-ready-postgres-finance-test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_pass_2026
      POSTGRES_DB: finance_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-finance-data:/var/lib/postgresql/data
      - ./init-scripts/finance:/docker-entrypoint-initdb.d:ro
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_user -d finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # AI模块数据库
  postgres-ai:
    image: postgres:14-alpine
    container_name: ai-ready-postgres-ai-test
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_pass_2026
      POSTGRES_DB: ai_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-ai-data:/var/lib/postgresql/data
      - ./init-scripts/ai:/docker-entrypoint-initdb.d:ro
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 数据模块数据库
  postgres-data:
    image: postgres:14-alpine
    container_name: ai-ready-postgres-data-test
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: data_user
      POSTGRES_PASSWORD: data_pass_2026
      POSTGRES_DB: data_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data-data:/var/lib/postgresql/data
      - ./init-scripts/data:/docker-entrypoint-initdb.d:ro
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_user -d data_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============ Redis 缓存集群 ============
  # 主缓存
  redis-main:
    image: redis:7-alpine
    container_name: ai-ready-redis-main-test
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --databases 16
    volumes:
      - redis-main-data:/data
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 库存模块缓存
  redis-inventory:
    image: redis:7-alpine
    container_name: ai-ready-redis-inventory-test
    restart: unless-stopped
    ports:
      - "6374:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --databases 4
    volumes:
      - redis-inventory-data:/data
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # 财务模块缓存
  redis-finance:
    image: redis:7-alpine
    container_name: ai-ready-redis-finance-test
    restart: unless-stopped
    ports:
      - "6373:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --databases 4
    volumes:
      - redis-finance-data:/data
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # AI模块缓存
  redis-ai:
    image: redis:7-alpine
    container_name: ai-ready-redis-ai-test
    restart: unless-stopped
    ports:
      - "6375:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --databases 8
    volumes:
      - redis-ai-data:/data
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

  # 数据模块缓存
  redis-data:
    image: redis:7-alpine
    container_name: ai-ready-redis-data-test
    restart: unless-stopped
    ports:
      - "6376:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --databases 4
    volumes:
      - redis-data-data:/data
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ============ Kafka 消息队列 ============
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ai-ready-zookeeper-test
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - ai-ready-test-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ai-ready-kafka-test
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ai-ready-test-net
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============ 监控服务 ============
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ai-ready-prometheus-test
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-test/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-test/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus/data
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus/data'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ai-ready-grafana-test
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_test_2026
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-test/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-test/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ai-ready-test-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: ai-ready-alertmanager-test
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager-test/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - ai-ready-test-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M