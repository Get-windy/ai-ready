# Authentication Service for AI-Ready Test Environment
# Simple OAuth2 Authorization Server using Keycloak

version: '3.8'

services:
  # Keycloak - OAuth2/OpenID Connect Server
  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: ai-ready-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-auth:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8087
      KC_PROXY: edge
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
    ports:
      - "8087:8080"
    volumes:
      - ./keycloak-data:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes
    depends_on:
      - postgres-auth
    networks:
      - ai-ready-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # PostgreSQL for Keycloak
  postgres-auth:
    image: postgres:15-alpine
    container_name: ai-ready-postgres-auth
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init-keycloak-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - ai-ready-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Simple OAuth2 Mock Service (fallback if Keycloak is too heavy)
  oauth2-mock:
    image: nginx:alpine
    container_name: ai-ready-oauth2-mock
    ports:
      - "8097:80"
    volumes:
      - ./oauth2-mock.conf:/etc/nginx/conf.d/default.conf:ro
      - ./oauth2-mock-data:/usr/share/nginx/html
    networks:
      - ai-ready-test-network
    restart: unless-stopped

networks:
  ai-ready-test-network:
    external: true
    name: ai-ready-test-network

volumes:
  keycloak-data:
  postgres-data:
  oauth2-mock-data: